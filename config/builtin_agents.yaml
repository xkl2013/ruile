# Built-in Agent Configuration with i18n support
# Each agent has localized name, description, avatar, and config overrides per language.
# The "default" locale is used as fallback when the user's language is not found.

builtin_agents:
  - id: "builtin-quick-answer"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Quick Answer"
        description: "Knowledge base RAG Q&A for fast and accurate answers"
      zh-CN:
        name: "快速问答"
        description: "基于知识库的 RAG 问答，快速准确地回答问题"
      zh-TW:
        name: "快速問答"
        description: "基於知識庫的 RAG 問答，快速準確地回答問題"
      ja-JP:
        name: "クイック回答"
        description: "ナレッジベース RAG Q&A による迅速で正確な回答"
      ko-KR:
        name: "빠른 답변"
        description: "지식 베이스 RAG Q&A를 통한 빠르고 정확한 답변"
    config:
      agent_mode: "quick-answer"
      system_prompt_id: "default_kb"
      context_template_id: "default_context"
      temperature: 0.7
      max_completion_tokens: 2048
      web_search_enabled: true
      web_search_max_results: 5
      multi_turn_enabled: true
      history_turns: 5
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      enable_query_expansion: true
      enable_rewrite: true
      fallback_strategy: "model"

  - id: "builtin-smart-reasoning"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "Smart Reasoning"
        description: "ReAct reasoning framework with multi-step thinking and tool calling"
      zh-CN:
        name: "智能推理"
        description: "ReAct 推理框架，支持多步思考与工具调用"
      zh-TW:
        name: "智能推理"
        description: "ReAct 推理框架，支援多步思考與工具呼叫"
      ja-JP:
        name: "スマート推論"
        description: "ReAct 推論フレームワーク、マルチステップ思考とツール呼び出し対応"
      ko-KR:
        name: "스마트 추론"
        description: "ReAct 추론 프레임워크, 다단계 사고 및 도구 호출 지원"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "rag-qa"
      system_prompt: ""
      temperature: 0.7
      max_completion_tokens: 2048
      max_iterations: 50
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "list_knowledge_chunks"
        - "query_knowledge_graph"
        - "get_document_info"
      web_search_enabled: true
      web_search_max_results: 5
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 5
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-sales-director"
    avatar: "💼"
    is_builtin: true
    i18n:
      default:
        name: "Sales Director"
        description: "Education and training sales strategy agent for frontline consultants, providing sales playbooks, talk tracks, objection handling and follow-up plans"
      zh-CN:
        name: "销售总监"
        description: "面向教培行业一线员工，提供销售策略、沟通话术、异议处理和跟进计划"
      zh-TW:
        name: "銷售總監"
        description: "面向教培行業一線員工，提供銷售策略、溝通話術、異議處理和跟進計畫"
      ja-JP:
        name: "営業ディレクター"
        description: "教育・研修業界の現場スタッフ向けに、営業戦略、トークスクリプト、反論処理、フォロー計画を提供するエージェント"
      ko-KR:
        name: "영업 총괄"
        description: "교육 및 트레이닝 업계의 현장 직원을 위해 영업 전략, 상담 스크립트, 이의 대응, 후속 계획을 제공하는 에이전트"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "education-sales"
      model_id: "${QWEN37_MAX_MODEL_ID}"
      system_prompt_id: "education_sales_director"
      temperature: 0.6
      max_completion_tokens: 4096
      max_iterations: 30
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      citation_enabled: false
      include_retrieved_images: false
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "list_knowledge_chunks"
        - "get_document_info"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 10
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      question_suggestions:
        starters:
          enabled: true
          mode: "curated"
          count: 4
          items:
            - "整理当前客户的回复话术"
            - "找出这次服务的重点和依据"
            - "把下一步跟进拆成三步"
            - "生成一条温和的微信跟进"
        follow_ups:
          enabled: false
          mode: "hybrid"
          count: 3
          max_context_turns: 2
          suppress_on_fallback: true
          suppress_when_answer_asks_question: true
          knowledge_fallback: true
          allow_regenerate: false

  - id: "builtin-service-assistant"
    avatar: "📌"
    is_builtin: true
    i18n:
      default:
        name: "Service Reminder"
        description: "Internal education service assistant for memory-grounded reminders, talk tracks and next actions"
      zh-CN:
        name: "服务提醒"
        description: "面向教培一线服务人员，基于记忆证据整理客户摘要、服务话术和下一步动作"
      zh-TW:
        name: "服務提醒"
        description: "面向教培一線服務人員，基於記憶證據整理客戶摘要、服務話術和下一步動作"
      ja-JP:
        name: "サービスリマインダー"
        description: "教育現場向けに、記憶証拠に基づく顧客要約、応対文、次の行動を整理する内部エージェント"
      ko-KR:
        name: "서비스 알림"
        description: "교육 현장 직원을 위해 기억 근거 기반 고객 요약, 응대 문구, 다음 조치를 정리하는 내부 에이전트"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "education-sales"
      model_id: "${QWEN37_MAX_MODEL_ID}"
      system_prompt_id: "service_reminder_assistant"
      temperature: 0.5
      max_completion_tokens: 3072
      max_iterations: 20
      kb_selection_mode: "all"
      retrieve_kb_only_when_mentioned: false
      citation_enabled: false
      include_retrieved_images: false
      allowed_tools:
        - "knowledge_search"
        - "grep_chunks"
        - "list_knowledge_chunks"
        - "get_document_info"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 8
      faq_priority_enabled: true
      faq_direct_answer_threshold: 0.9
      faq_score_boost: 1.2
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
      question_suggestions:
        starters:
          enabled: true
          mode: "curated"
          count: 4
          items:
            - "整理当前客户的回复话术"
            - "找出这次服务的重点和依据"
            - "把下一步跟进拆成三步"
            - "生成一条温和的微信跟进"
        follow_ups:
          enabled: false
          mode: "hybrid"
          count: 3
          max_context_turns: 2
          suppress_on_fallback: true
          suppress_when_answer_asks_question: true
          knowledge_fallback: true
          allow_regenerate: false

  - id: "builtin-wiki-fixer"
    avatar: "🔧"
    is_builtin: true
    i18n:
      default:
        name: "Wiki Fixer"
        description: "Specialized agent for revising Wiki pages based on inspection issues"
      zh-CN:
        name: "维基修订"
        description: "专门用于根据巡检问题修订 Wiki 页面的智能体"
      zh-TW:
        name: "維基修訂"
        description: "專門用於根據巡檢問題修訂 Wiki 頁面的智能體"
      ja-JP:
        name: "Wiki 修訂"
        description: "検査の問題に基づいてWikiページを修復および最適化するための専用エージェント"
      ko-KR:
        name: "위키 수정"
        description: "검사 문제를 기반으로 Wiki 페이지를 修復하고 最適化하는 전용 에이전트"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "wiki_fixer"
      temperature: 0.7
      max_completion_tokens: 4096
      max_iterations: 30
      kb_selection_mode: "selected"
      retrieve_kb_only_when_mentioned: false
      retain_retrieval_history: true
      allowed_tools:
        - "wiki_search"
        - "wiki_read_page"
        - "wiki_read_source_doc"
        - "wiki_write_page"
        - "wiki_replace_text"
        - "wiki_rename_page"
        - "wiki_delete_page"
        - "wiki_read_issue"
        - "wiki_update_issue"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true
      history_turns: 10
      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3
