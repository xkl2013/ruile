<!DOCTYPE html>
<html lang="zh-CN" theme-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新用户注册引导原型 · 睿乐大脑</title>
<style>
  :root{
    --app-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --brand:#07c05f; --brand-hover:#08dd6e; --brand-active:#06b04d;
    --brand-1:#e9f8ec; --brand-3:#08dd6e; --brand-6:#049b38; --brand-8:#027218;
    --warn:#ed7b2f; --warn-1:#fef3e6;
    --error:#e34d59; --error-1:#fdecee;
    --success:#00a870; --success-1:#e8f8f2;
    --info:#2f7de1; --info-1:#eaf1ff;
    --g1:#f3f3f3; --g2:#eee; --g3:#e7e7e7; --g4:#dcdcdc; --g5:#c5c5c5;
    --g6:#a6a6a6; --g7:#8b8b8b; --g9:#5e5e5e; --g12:#2c2c2c;
    --t1:rgba(0,0,0,.9); --t2:rgba(0,0,0,.6); --t3:rgba(0,0,0,.4); --t4:rgba(0,0,0,.26);
    --bg-page:#f3f5f4; --bg-card:#fff; --bd:#e7e7e7; --bd2:#dcdcdc;
    --r-s:2px; --r:3px; --r-m:6px; --r-l:9px; --r-xl:12px; --r-round:999px;
    --sh1:0 1px 10px rgba(0,0,0,.05),0 4px 5px rgba(0,0,0,.04),0 2px 4px -1px rgba(0,0,0,.06);
    --sh2:0 3px 14px 2px rgba(0,0,0,.05),0 8px 10px 1px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--app-font-family);background:var(--bg-page);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--g4);border-radius:var(--r-round)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── 原型外壳 ───────────────────────────────────────── */
  .app{display:flex;height:100vh;overflow:hidden}
  .rail{width:238px;flex:0 0 238px;background:#fbfcfb;border-right:1px solid var(--bd);display:flex;flex-direction:column}
  .rail-head{padding:18px 18px 14px}
  .rail-title{font-size:15px;font-weight:600;letter-spacing:.2px}
  .rail-sub{font-size:12px;color:var(--t3);margin-top:4px;line-height:1.6}
  .rail-group{padding:6px 10px;overflow-y:auto;flex:1}
  .rail-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-m);color:var(--t2);text-align:left;line-height:1.35;transition:background .14s,color .14s;margin-bottom:2px}
  .rail-btn:hover{background:var(--g1);color:var(--t1)}
  .rail-btn.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .rail-btn .idx{width:19px;height:19px;flex:0 0 19px;border-radius:var(--r-round);background:var(--g3);color:var(--g7);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .rail-btn.on .idx{background:var(--brand);color:#fff}
  .rail-btn .lb{font-size:13px}
  .rail-note{margin:10px 10px 0;padding:9px 11px;border-radius:var(--r-l);background:var(--warn-1);color:#8a4a12;font-size:11.5px;line-height:1.65}
  .rail-note b{display:block;font-size:12px;margin-bottom:3px;color:#6f3a08}
  .rail-foot{padding:12px 18px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--t4);line-height:1.7}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-page)}
  .bar{display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--bg-card);border-bottom:1px solid var(--bd);flex-wrap:wrap;min-height:56px}
  .bar h1{margin:0;font-size:16px;font-weight:600}
  .bar .path{font-size:11.5px;color:var(--t3);font-family:ui-monospace,Menlo,monospace;background:var(--g1);padding:3px 8px;border-radius:var(--r)}
  .verstamp{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--brand-6);background:var(--brand-1);border:1px solid #b9e8c9;padding:2px 7px;border-radius:var(--r-round);cursor:help}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .scroll{flex:1;overflow-y:auto;padding:18px 22px 60px}
  .canvas{max-width:1180px;margin:0 auto}
  .canvas.bleed{max-width:none}

  /* ── 通用控件 ───────────────────────────────────────── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 15px;border-radius:var(--r-m);border:1px solid var(--bd2);background:#fff;color:var(--t1);font-size:13px;transition:all .14s;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand-6)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
  .btn.pri:hover{background:var(--brand-active);border-color:var(--brand-active);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--t2)}
  .btn.ghost:hover{background:var(--g1);color:var(--t1)}
  .btn.sm{height:27px;padding:0 11px;font-size:12px}
  .btn.lg{height:38px;padding:0 22px;font-size:14px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--bd2);color:var(--t1)}
  .btn.pri:disabled:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  .tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r);font-size:11px;background:var(--g1);color:var(--t2);white-space:nowrap}
  .tag.brand{background:var(--brand-1);color:var(--brand-6)}
  .tag.warn{background:var(--warn-1);color:#b25f14}
  .tag.info{background:var(--info-1);color:#2258a8}
  .tag.err{background:var(--error-1);color:#b03442}
  .chip{height:28px;padding:0 13px;border-radius:var(--r-round);border:1px solid var(--bd2);background:#fff;font-size:12px;color:var(--t2);transition:all .14s}
  .chip:hover{border-color:var(--brand);color:var(--brand-6)}
  .chip.on{background:var(--brand-1);border-color:var(--brand);color:var(--brand-6);font-weight:600}
  .card{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-xl);box-shadow:var(--sh1)}
  .muted{color:var(--t3)}
  .mono{font-family:ui-monospace,Menlo,monospace}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--g1);padding:1px 5px;border-radius:var(--r)}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);background:rgba(0,0,0,.86);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:var(--r-l);opacity:0;pointer-events:none;transition:all .22s;z-index:99}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .anno{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:var(--r);background:#fff4d6;color:#8a6d12;font-size:10.5px;font-weight:600;border:1px solid #f0dfa8;white-space:nowrap}
  .annoline{border-left:3px solid var(--brand);background:#fafdfb;padding:8px 12px;border-radius:0 var(--r-l) var(--r-l) 0;font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:14px}
  .annoline.warn{border-left-color:var(--warn);background:#fffaf4}
  .annoline b{font-weight:600}

  /* ══ 引导页外壳 ══════════════════════════════════════ */
  .onb{height:calc(100vh - 56px - 36px - 60px);min-height:640px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh1)}
  .onb-top{display:flex;align-items:center;gap:16px;padding:16px 32px;border-bottom:1px solid var(--bd);background:#fcfdfc}
  .onb-brand{display:flex;align-items:center;gap:8px}
  .onb-logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-6));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .onb-brandname{font-size:13.5px;font-weight:600}
  .steps{display:flex;align-items:center;gap:8px;margin-left:14px}
  .step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t4);white-space:nowrap}
  .step .dot{width:22px;height:22px;flex:0 0 22px;border-radius:var(--r-round);border:1px solid var(--bd2);background:#fff;color:var(--t4);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .step.on{color:var(--t1);font-weight:600}
  .step.on .dot{background:var(--brand);border-color:var(--brand);color:#fff}
  .step.done{color:var(--brand-6)}
  .step.done .dot{background:var(--brand-1);border-color:#b9e8c9;color:var(--brand-6)}
  .step-line{width:30px;height:1px;background:var(--bd2);flex:none}
  .onb-skip{margin-left:auto;font-size:12.5px;color:var(--t3)}
  .onb-skip:hover{color:var(--t1)}
  .onb-body{flex:1;overflow-y:auto;padding:34px 32px}
  .onb-inner{max-width:820px;margin:0 auto}
  .onb-h{font-size:21px;font-weight:600;margin:0 0 8px;letter-spacing:.2px}
  .onb-p{font-size:13px;color:var(--t2);line-height:1.75;margin:0 0 4px}
  .onb-foot{display:flex;align-items:center;gap:10px;padding:14px 32px;border-top:1px solid var(--bd);background:#fcfdfc}
  .onb-foot .grow{margin-left:auto}
  .onb-foothint{font-size:12px;color:var(--t4)}

  /* 选项卡片（四列） */
  .ogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:20px}
  .ocard{position:relative;text-align:left;padding:14px 13px 15px;border:1px solid var(--bd2);border-radius:var(--r-xl);background:#fff;transition:all .14s}
  .ocard:hover{border-color:var(--brand);box-shadow:var(--sh1)}
  .ocard.on{border-color:var(--brand);background:var(--brand-1)}
  .ocard .cico{width:30px;height:30px;border-radius:var(--r-l);background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:9px;transition:background .14s}
  .ocard.on .cico{background:#fff}
  .ocard .cnm{font-size:13.5px;font-weight:600;margin-bottom:5px;line-height:1.35}
  .ocard .cds{font-size:11.5px;color:var(--t3);line-height:1.6}
  .ocard .ck{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:var(--r-round);border:1px solid var(--bd2);background:#fff;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .ocard.on .ck{background:var(--brand);border-color:var(--brand)}
  .ocard.on .cnm{color:var(--brand-8)}

  /* 岗位（列表卡片） */
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
  .rrow{display:flex;align-items:center;gap:11px;text-align:left;padding:11px 13px;border:1px solid var(--bd2);border-radius:var(--r-l);background:#fff;transition:all .14s}
  .rrow:hover{border-color:var(--brand)}
  .rrow.on{border-color:var(--brand);background:var(--brand-1)}
  .rrow .rav{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-round);background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2);font-weight:600}
  .rrow.on .rav{background:var(--brand);color:#fff}
  .rrow .rnm{font-size:13px;font-weight:500}
  .rrow .rdp{font-size:11px;color:var(--t3);margin-top:2px}
  .rrow.on .rnm{color:var(--brand-8)}

  /* 推荐清单 */
  .rgroup{margin-bottom:20px}
  .rgt{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:9px}
  .rgt .rgn{font-size:11px;font-weight:500;color:var(--t3);background:var(--g1);padding:1px 7px;border-radius:var(--r-round)}
  .ritem{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--bd);border-radius:var(--r-l);margin-bottom:7px;background:#fff;text-align:left;transition:all .14s}
  .ritem:hover{border-color:var(--brand)}
  .ritem.off{opacity:.55;background:var(--g1)}
  .ritem .rcb{width:16px;height:16px;flex:0 0 16px;border-radius:4px;border:1px solid var(--bd2);background:#fff;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .ritem.on .rcb{background:var(--brand);border-color:var(--brand)}
  .ritem .rnm{font-size:13px}
  .ritem .rmeta{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}

  /* 创建进度 */
  .prog{max-width:560px;margin:0 auto}
  .pline{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--bd);border-radius:var(--r-l);margin-bottom:7px;background:#fff;font-size:12.5px}
  .pline.doing{border-color:var(--brand);background:var(--brand-1)}
  .pline.wait{opacity:.45}
  .pline .pdot{width:18px;height:18px;flex:0 0 18px;border-radius:var(--r-round);background:var(--brand);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  .pline.wait .pdot{background:var(--g4)}
  .pline .pk{margin-left:auto;font-size:11px;color:var(--t3);font-family:ui-monospace,Menlo,monospace}
  .progbar{height:5px;border-radius:var(--r-round);background:var(--g3);overflow:hidden;margin:16px 0 8px}
  .progbar i{display:block;height:100%;background:var(--brand);border-radius:var(--r-round);transition:width .3s}

  /* 完成 */
  .donehead{text-align:center;padding:6px 0 20px}
  .doneico{width:56px;height:56px;border-radius:var(--r-round);background:var(--brand-1);color:var(--brand-6);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:1px solid #b9e8c9}
  .dcard{border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;margin-bottom:12px}
  .dcard-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fcfdfc;border-bottom:1px solid var(--bd);font-size:12.5px;font-weight:600}
  .dcard-h .cnt{margin-left:auto;font-size:11px;color:var(--t3);font-weight:500}
  .drow{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--g1)}
  .drow:last-child{border-bottom:none}
  .drow .di{width:20px;height:20px;flex:0 0 20px;border-radius:var(--r-m);background:var(--brand-1);color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:11px}
  .drow .dn{margin-left:auto;font-size:11px;color:var(--t3)}

  /* 产品截图模拟 */
  .shots{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .shot{border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;background:#fff}
  .shot-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;border-bottom:1px solid var(--bd);background:#fcfdfc;font-size:12px;font-weight:600}
  .shot-bar .sdot{width:8px;height:8px;border-radius:50%;background:var(--g4)}
  .shot-body{padding:11px 13px}
  .srow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--g2);border-radius:var(--r-m);margin-bottom:6px;font-size:12.5px}
  .srow .si{width:22px;height:22px;flex:0 0 22px;border-radius:var(--r-m);background:var(--brand-1);color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:11px}
  .srow .snm{font-weight:500}
  .srow .sds{font-size:11px;color:var(--t3);margin-top:2px}
  .srow .sm{margin-left:auto;flex:none}
  .newmk{font-size:10px;color:#fff;background:var(--brand);padding:1px 5px;border-radius:var(--r-round);font-weight:600}

  /* 说明页 */
  .lead{font-size:13px;color:var(--t2);line-height:1.75;margin:0 0 16px}
  h2{font-size:15px;font-weight:600;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
  h2:first-child{margin-top:0}
  h3{font-size:13px;font-weight:600;margin:18px 0 9px}
  .dtable{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden}
  .dtable th{background:#fcfdfc;text-align:left;padding:9px 12px;font-weight:600;color:var(--t2);border-bottom:1px solid var(--bd);font-size:12px}
  .dtable td{padding:9px 12px;border-bottom:1px solid var(--g1);vertical-align:top;line-height:1.65}
  .dtable tr:last-child td{border-bottom:none}
  .dtable .a{font-weight:600;white-space:nowrap}
  .dtable .b{color:var(--t2)}
  .pill{display:inline-block;padding:1px 7px;border-radius:var(--r-round);font-size:10.5px;font-weight:600;white-space:nowrap}
  .pill.keep{background:var(--brand-1);color:var(--brand-6)}
  .pill.add{background:var(--info-1);color:#2258a8}
  .pill.warnp{background:var(--warn-1);color:#b25f14}
  .pill.demote{background:var(--g2);color:var(--t2)}
  .flow{display:flex;align-items:stretch;gap:0;margin:14px 0 6px;flex-wrap:wrap}
  .fbox{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:var(--r-l);padding:12px 13px;background:#fff}
  .fbox .fn{font-size:10.5px;color:var(--t4);font-weight:600;margin-bottom:5px;letter-spacing:.4px}
  .fbox .ft{font-size:12.5px;font-weight:600;margin-bottom:3px}
  .fbox .fd{font-size:11.5px;color:var(--t3);line-height:1.6}
  .farr{display:flex;align-items:center;justify-content:center;width:26px;flex:none;color:var(--t4);font-size:14px}
  .pre{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;background:#fcfdfc;border:1px solid var(--bd);border-radius:var(--r-l);padding:12px 14px;overflow-x:auto;color:var(--t2);white-space:pre}
  ul.tight{margin:8px 0;padding-left:20px;font-size:12.5px;line-height:1.8;color:var(--t2)}
  ul.tight li{margin-bottom:3px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-title">新用户注册引导 · 原型</div>
      <div class="rail-sub">v1.0 · 8 个场景 · 3 步引导<br/>配套《新用户注册引导功能方案》</div>
    </div>
    <div class="rail-group" id="rail"></div>
    <div class="rail-note">
      <b>怎么看这份原型</b>
      左侧切换场景。第 2–4 个场景是<b>可点的</b>：选完场景与岗位点「下一步」，第 3 步能取消勾选，再点「一键创建」看完整闭环。
    </div>
    <div class="rail-foot">睿乐大脑 · 引导与推荐<br/>白底 / 品牌绿 #07c05f</div>
  </aside>
  <main class="stage">
    <div class="bar">
      <h1 id="barTitle"></h1>
      <span class="path" id="barPath"></span>
      <span class="verstamp" title="如果你看到的版本号比这个旧，说明浏览器在用缓存的旧文件——按 ⌘⇧R 强制刷新">v1.0</span>
      <div class="bar-right" id="barRight"></div>
    </div>
    <div class="scroll"><div class="canvas" id="root"></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   工具
   ═══════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ═══════════════════════════════════════════════════════
   数据（与方案 §3.3 的映射表一致）
   ═══════════════════════════════════════════════════════ */
const SCENE_OPTS = [
  { key:'admissions_growth',        icon:'◎', label:'招生增长',        desc:'线索、到访、转化与渠道效果' },
  { key:'parent_service',           icon:'☺', label:'家长服务',        desc:'家长沟通、顾虑与跟进' },

const state = {
  scene: (location.hash || '').replace('#','') || 'trigger',
  step: 1,
  selScenes: ['admissions_growth'],
  selRole: '招生顾问',
  off: {},                 // 被取消勾选的推荐项
  progress: -1,            // creating 场景：-1 未开始，0..n 进行中
  result: null
};

function recommend(){
  const org = [], svc = [], seen = {};
  const addO = (key, from) => {
    if (seen['o'+key]) return;
    seen['o'+key] = 1;
    const t = ALL_ORG.find(x => x.key === key);
    if (t) org.push(Object.assign({}, t, { from }));
  };
  const addS = (key, from) => {
    if (seen['s'+key]) return;
    seen['s'+key] = 1;
    const t = ALL_SVC.find(x => x.key === key);
    if (t) svc.push(Object.assign({}, t, { from }));
  };
  state.selScenes.forEach(sk => {
    const r = RECO[sk]; if (!r) return;
    const label = (SCENE_OPTS.find(s => s.key === sk) || {}).label || sk;
    r.org.forEach(k => addO(k, '来自：' + label));
    r.svc.forEach(k => addS(k, '来自：' + label));
  });
  (ROLE_BOOST[state.selRole] || []).forEach(k => {
    const from = '来自岗位：' + state.selRole;
    addO(k, from); addS(k, from);
  });
  return { org, svc };
}

function pickedCount(){
  const r = recommend();
  return {
    org: r.org.filter(x => !state.off['o'+x.key]).length,
    svc: r.svc.filter(x => !state.off['s'+x.key]).length,
    total: r.org.filter(x => !state.off['o'+x.key]).length + r.svc.filter(x => !state.off['s'+x.key]).length
  };
}

  const names = ['工作场景','岗位','确认能力'];

    const cls = no < active ? 'done' : (no === active ? 'on' : '');
    return `<div class="step ${cls}"><span class="dot">${no < active ? '✓' : no}</span><span>${n}</span></div>`

  }).join('') + `</div>`;
}

      ${group('整理能力', r.org, 'o')}
      ${group('服务空间', r.svc, 's')}
    </div>`;
}

function stepFoot(n){
  const pc = pickedCount();

  return `${back}${hint}<span class="grow"></span>${next}`;

/* ── 创建中 ───────────────────────────────────────── */
function creatingView(){
  const r = recommend();
  const tasks = [];
  r.org.forEach(x => { if (!state.off['o'+x.key]) tasks.push({ kind:'整理', name:x.name, meta:x.sched === 'manual' ? '不自动跑' : SCHED_LABEL[x.sched] }); });
  r.svc.forEach(x => { if (!state.off['s'+x.key]) tasks.push({ kind:'服务', name:x.name, meta:'激活为可用' }); });

  const done = state.progress;
  const lines = tasks.map((t, i) => {
    const st = i < done ? '' : (i === done ? 'doing' : 'wait');
    return `<div class="pline ${st}">
      <span class="pdot">${i < done ? '✓' : (i === done ? '·' : '')}</span>
      <span><span style="font-weight:500">${esc(t.name)}</span> <span class="muted">· ${esc(t.kind)}</span></span>
      <span class="pk">${esc(i < done ? '已创建 · ' + t.meta : (i === done ? '创建中…' : '等待'))}</span>
    </div>`;
  }).join('');

  const pct = tasks.length ? Math.round(Math.max(0, done) / tasks.length * 100) : 100;
  const finished = done >= tasks.length;

  return `<div class="onb">
    <div class="onb-top">
      <div class="onb-brand"><div class="onb-logo">睿</div><div class="onb-brandname">睿乐大脑</div></div>
      ${stepper(3)}
      <span class="onb-skip"></span>
    </div>
    <div class="onb-body"><div class="onb-inner">
      <h2 class="onb-h" style="border:none;margin:0 0 8px;padding:0">${finished ? '正在收尾…' : '正在为你创建'}</h2>
      <p class="onb-p">共 ${tasks.length} 项。任意一项失败都不会中断其余项，结果页会列出失败项供重试。</p>
      <div class="prog" style="margin-top:20px">
        <div class="progbar"><i style="width:${pct}%"></i></div>
        <div style="display:flex;font-size:11.5px;color:var(--t3)"><span>${Math.max(0,done)} / ${tasks.length} 已完成</span><span style="margin-left:auto">${pct}%</span></div>
        <div style="margin-top:16px">${lines || '<div class="annoline warn">没有勾选任何能力，无需创建。</div>'}</div>
      </div>
    </div></div>
    <div class="onb-foot">
      <span class="onb-foothint">创建过程使用幂等键，重复提交不会产生重复对象</span>
      <span class="grow"></span>
      <button class="btn" data-create-step>下一项</button>
      <button class="btn pri" data-goto="done" ${finished ? '' : ''}>查看创建结果</button>
    </div>
  </div>`;
}

    </div>`).join('') || `<div class="muted" style="font-size:12px;padding:8px">本次未创建服务空间</div>`;

  return `
  <div class="annoline">引导只是入口，<b>建出来的东西必须能在真实页面里看到</b>。下面是引导完成后「整理」与「服务」两个页面的样子——都带「新建」标记。</div>
  <div class="shots">
    <div class="shot">
      <div class="shot-bar"><span class="sdot"></span>整理 · 定时配置</div>
      <div class="shot-body">${orgRows}</div>
    </div>
    <div class="shot">
      <div class="shot-bar"><span class="sdot"></span>服务 · 我的服务空间</div>
      <div class="shot-body">${svcRows}</div>
    </div>
  </div>

  <div class="annoline warn" style="margin-top:18px">方案 §9 的风险 3：新建的定时配置如果一开始就是 <b>daily / weekly</b>，而用户还没有任何记忆，到点会跑出「记录中未提供」的空成果。建议第一期<b>复盘类默认手动触发</b>，跟进类才开自动；或首次到点前给一条可关闭的提示。</div>

  <h2>创建的是什么，不是一次任务</h2>
  <table class="dtable">
    <thead><tr><th style="width:26%">对象</th><th style="width:30%">接口</th><th>说明</th></tr></thead>
    <tbody>
      <tr><td class="a">整理配置</td><td class="mono b">POST /organize/configs</td><td class="b">一条模板 + 一套调度。真正的执行由调度器每分钟扫到期配置触发（<code>/organize/jobs</code> 的 <code>config_id</code> 是必填）。</td></tr>
      <tr><td class="a">服务空间</td><td class="mono b">POST /services/templates/:key/apply</td><td class="b">一键套用内置模板。模板自带「服务助理」专家，正好满足「激活时至少一个启用专家」的硬约束。</td></tr>
      <tr><td class="a">工作画像</td><td class="mono b">同 apply 请求内回写</td><td class="b">改写 <code>work_profile_description</code>；<b>必须先与默认值比对</b>，用户手改过就不覆盖。</td></tr>
    </tbody>
  </table>`;
}

/* ── 说明页：约定与缺口 ─────────────────────────────── */
function notesView(){

      <tr><td class="a">家长服务</td><td class="b">沟通复盘（手动）</td><td class="b">t8 早教机构会员服务</td></tr>
      <tr><td class="a">活动策划</td><td class="b muted">—</td><td class="b">t5 活动筹备</td></tr>
      <tr><td class="a">园所运营</td><td class="b muted">—</td><td class="b">t3 一日流程巡查</td></tr>
      <tr><td class="a">团队运营 / 领导力</td><td class="b muted">—</td><td class="b">t4 新教师带教</td></tr>
      <tr><td class="a">儿童营养与食育</td><td class="b muted">—</td><td class="b muted">—</td></tr>
      <tr><td class="a">空间设计 / 环创</td><td class="b">环创提案（手动）</td><td class="b muted">—</td></tr>
      <tr><td class="a">教师成长 / 教研</td><td class="b">教研提炼 · 磨课复盘 · 个案观察（均手动）</td><td class="b">t6 教学教研沉淀</td></tr>
    </tbody>
  </table>
  <div class="annoline warn" style="margin-top:12px">看到两处<b>真实缺口</b>：①「儿童营养与食育」在这张映射表里没有对应能力；②「活动策划 / 园所运营 / 团队运营」只有服务、没有整理。这不是原型偷懒——是当前平台模板的真实覆盖情况（8 个整理模板、8 个服务模板）。缺口由<b>岗位兜底</b>缓解（选岗位后相关能力会补进推荐）；要根治就走后台新建模板，<b>不用写代码</b>。</div>

  <h2>3 · 落库结构（零迁移）</h2>
  <div class="pre">{
  "LastActiveTenantID": 1,

  <ul class="tight">

/* ═══════════════════════════════════════════════════════
   场景与渲染
   ═══════════════════════════════════════════════════════ */
const SCENES = [
  { key:'trigger',  n:1, label:'触发 · 登录后如何进入',   path:'/onboarding/setup  ← 登录分流' },
  { key:'step1',    n:2, label:'第 1 步 · 选工作场景',     path:'/onboarding/setup  ① 工作场景' },
  { key:'step2',    n:3, label:'第 2 步 · 选岗位',         path:'/onboarding/setup  ② 岗位' },
  { key:'step3',    n:4, label:'第 3 步 · 确认推荐能力',   path:'/onboarding/setup  ③ 确认能力' },
  { key:'creating', n:5, label:'一键创建 · 进度',          path:'POST /onboarding/apply' },
  { key:'done',     n:6, label:'完成 · 创建结果',          path:'/onboarding/setup  完成' },
  { key:'product',  n:7, label:'创建后 · 落到整理与服务',   path:'/platform/organize  ·  /platform/service' },
  { key:'notes',    n:8, label:'约定 · 映射与落库',        path:'—' }
];

const RENDER = {
  trigger:  () => layout(triggerView()),
  step1:    () => layout(onbView(1), true),
  step2:    () => layout(onbView(2), true),
  step3:    () => layout(onbView(3), true),
  creating: () => layout(creatingView(), true),
  done:     () => layout(doneView()),
  product:  () => layout(productView()),
  notes:    () => layout(notesView())
};

function layout(inner, bleed){ return `<div class="canvas ${bleed ? 'bleed' : ''}">${inner}</div>`; }

function render(){
  const sc = SCENES.find(s => s.key === state.scene) || SCENES[0];
  state.scene = sc.key;
  $('#barTitle').textContent = sc.label;
  $('#barPath').textContent = sc.path;
  $('#root').className = 'canvas' + (['step1','step2','step3','creating'].includes(sc.key) ? ' bleed' : '');
  $('#root').innerHTML = RENDER[sc.key] ? RENDER[sc.key]() : '';
  $('#rail').innerHTML = SCENES.map(s => `
    <button class="rail-btn ${state.scene === s.key ? 'on' : ''}" data-scene="${s.key}">
      <span class="idx">${s.n}</span><span class="lb">${s.label}</span>
    </button>`).join('');

  const br = $('#barRight');
  if (['step1','step2','step3'].includes(sc.key)) {
    br.innerHTML = `<button class="chip" data-goto="trigger">看触发说明</button>`;
  } else if (sc.key === 'done') {
    br.innerHTML = `<button class="chip" data-restart>重走一遍</button>`;
  } else br.innerHTML = '';
}

/* ═══════════════════════════════════════════════════════
   事件
   ═══════════════════════════════════════════════════════ */
function goScene(k){
  state.scene = k;
  if (k !== 'creating') state.progress = -1;
  history.replaceState(null, '', '#' + k);
  render();
  const sc = $('.scroll'); if (sc) sc.scrollTop = 0;
}

document.addEventListener('click', e => {
  const hit = s => e.target.closest(s);

  const noop = hit('[data-noop]');
  if (noop && !hit('[data-scene]') && !hit('[data-goto]')) { toast('这是原型，仅演示布局与信息层级'); return; }

  const sc = hit('[data-scene]');
  if (sc) { goScene(sc.dataset.scene); return; }

  const gp = hit('[data-scene-pick]');
  if (gp) {
    const k = gp.dataset.scenePick;
    const i = state.selScenes.indexOf(k);
    if (i >= 0) state.selScenes.splice(i, 1);
    else {
      if (state.selScenes.length >= 3) { toast('最多选 3 个工作场景'); return; }
      state.selScenes.push(k);
    }
    render();
    return;
  }

  const rp = hit('[data-role-pick]');
  if (rp) { state.selRole = rp.dataset.rolePick; render(); return; }

  const tg = hit('[data-toggle]');
  if (tg) {
    const k = tg.dataset.toggle;
    state.off[k] = !state.off[k];
    render();
    return;
  }

  const gt = hit('[data-goto]');
  if (gt) {
    const to = gt.dataset.goto;
    if (to === 'done') { goScene('done'); return; }
    const n = Number(to);
    if (n >= 1 && n <= 3) {
      if (n === 2 && !state.selScenes.length) { toast('至少选一个工作场景'); return; }
      goScene('step' + n);
      return;
    }
    if (to === 'trigger') { goScene('trigger'); return; }
    goScene(to);
    return;
  }

  const cst = hit('[data-create-step]');
  if (cst) {
    const total = pickedCount().total;
    if (state.progress < total) state.progress += 1;
    render();
    return;
  }

  const cr = hit('[data-create]');
  if (cr) {
    if (!pickedCount().total) { toast('没有勾选任何能力'); return; }
    state.progress = 0;
    goScene('creating');
    return;
  }

  const rs = hit('[data-restart]');
  if (rs) {
    state.selScenes = []; state.selRole = ''; state.off = {}; state.progress = -1;
    goScene('step1');
    return;
  }

  const sk = hit('[data-skip]');
  if (sk) { toast('已跳过引导（原型演示）—— 真实实现会写 onboarding.skipped 并跳到知识库页'); return; }
});

render();
window.addEventListener('hashchange', () => {
  state.scene = (location.hash || '').replace('#','') || 'trigger';
  render();
});
</script>
</body>
