<!DOCTYPE html>
<html lang="zh-CN" theme-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小睿 AI · Web 端设计原型 · 睿乐大脑</title>
<style>
  /* ═══ 令牌：web 真源 = frontend/src/assets/theme/theme.css（TDesign） ═══ */
  :root{
    --app-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --brand:#07c05f; --brand-hover:#08dd6e; --brand-active:#06b04d;
    --brand-1:#e9f8ec; --brand-2:#d6f2e0; --brand-6:#049b38; --brand-8:#027218;
    --warn:#ed7b2f; --warn-1:#fef3e6; --error:#e34d59; --error-1:#fdecee;
    --success:#00a870; --success-1:#e8f8f2; --info:#2f7de1; --info-1:#eaf1ff;
    --violet:#7a5af8; --violet-1:#f0edff;
    --g1:#f3f3f3; --g2:#eee; --g3:#e7e7e7; --g4:#dcdcdc; --g5:#c5c5c5;
    --g6:#a6a6a6; --g7:#8b8b8b; --g9:#5e5e5e; --g12:#2c2c2c;
    --t1:rgba(0,0,0,.9); --t2:rgba(0,0,0,.6); --t3:rgba(0,0,0,.4); --t4:rgba(0,0,0,.26);
    --bg-page:#f3f5f4; --bg-card:#fff; --bg-sub:#fbfcfb; --bd:#e7e7e7; --bd2:#dcdcdc;
    --r-s:3px; --r-m:6px; --r-l:9px; --r-xl:12px; --r-round:999px;
    --sh1:0 1px 2px rgba(0,0,0,.03),0 1px 6px rgba(0,0,0,.05);
    --sh2:0 4px 14px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
    /* 间距栅格（4px 基数） */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--app-font-family);background:var(--bg-page);color:var(--t1);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;text-align:left;line-height:inherit}
  ::selection{background:var(--brand-2);color:var(--brand-8)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--g4);border-radius:var(--r-round);border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--g5);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── 原型外壳 ─────────────────────────────────────── */
  .app{display:flex;height:100vh;overflow:hidden}
  .rail{width:240px;flex:0 0 240px;background:var(--bg-sub);border-right:1px solid var(--bd);display:flex;flex-direction:column}
  .rail-head{padding:var(--s5) var(--s5) var(--s3)}
  .rail-title{font-size:13.5px;font-weight:600;letter-spacing:.2px;color:var(--t1)}
  .rail-sub{font-size:11.5px;color:var(--t3);margin-top:var(--s1);line-height:1.7}
  .rail-group{padding:var(--s1) var(--s3);overflow-y:auto;flex:1}
  .rail-btn{display:flex;align-items:center;gap:var(--s2);width:100%;padding:7px 10px;border-radius:var(--r-m);color:var(--t2);line-height:1.4;transition:background .15s,color .15s;margin-bottom:2px}
  .rail-btn:hover{background:var(--g1);color:var(--t1)}
  .rail-btn.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .rail-btn .idx{width:18px;height:18px;flex:0 0 18px;border-radius:var(--r-round);background:var(--g2);color:var(--g7);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .rail-btn.on .idx{background:var(--brand);color:#fff}
  .rail-btn .lb{font-size:12.5px}
  .rail-note{margin:var(--s3);padding:11px var(--s3);border-radius:var(--r-l);background:var(--warn-1);color:#8a4a12;font-size:11.5px;line-height:1.72}
  .rail-note b{display:block;font-size:11.5px;font-weight:600;margin-bottom:var(--s1);color:#6f3a08}
  .rail-foot{padding:var(--s3) var(--s5) var(--s4);border-top:1px solid var(--bd);font-size:11px;color:var(--t4);line-height:1.75}
  .rail-foot code{font-family:ui-monospace,Menlo,monospace;font-size:10px;background:var(--g1);padding:1px 4px;border-radius:var(--r-s);color:var(--t3)}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-page)}
  .bar{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);background:var(--bg-card);border-bottom:1px solid var(--bd);flex-wrap:wrap;min-height:56px;flex:0 0 auto}
  .bar h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  .bar .path{font-size:11.5px;color:var(--t3);font-family:ui-monospace,Menlo,monospace;background:var(--g1);padding:3px 8px;border-radius:var(--r-m)}
  .verstamp{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--brand-6);background:var(--brand-1);border:1px solid #bdeccd;padding:2px 8px;border-radius:var(--r-round);letter-spacing:.2px}
  .scroll{flex:1;overflow-y:auto;padding:var(--s5) var(--s5) 56px}
  .canvas{max-width:1240px;margin:0 auto}

  /* ── 规格面板 ─────────────────────────────────────── */
  .spec{max-width:1240px;margin:var(--s5) auto 0;background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-xl);padding:var(--s5) var(--s6);box-shadow:var(--sh1)}
  .spec h3{margin:0 0 var(--s1);font-size:14px;font-weight:600;letter-spacing:.2px}
  .spec .goal{font-size:12.5px;line-height:1.75;color:var(--t2);margin:0}
  .spec .plabel{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--t4);margin:var(--s5) 0 var(--s3)}
  .spec ul{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.78;color:var(--t2)}
  .spec ul li{position:relative;padding-left:26px;margin-bottom:var(--s3)}
  .spec ul li:last-child{margin-bottom:0}
  .spec ul li .n{position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:var(--r-m);background:var(--brand-1);color:var(--brand-6);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .spec ul li b{color:var(--t1);font-weight:600}
  .spec ul li code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--g1);padding:1px 5px;border-radius:var(--r-s);color:var(--brand-8)}
  .spec .pnote{margin-top:var(--s4);padding:11px var(--s3);border-radius:var(--r-l);background:var(--warn-1);color:#8a4a12;font-size:12px;line-height:1.75}
  .spec .pnote b{display:block;font-size:11.5px;font-weight:600;color:#6f3a08;margin-bottom:2px}

  /* ── 产品壳 ───────────────────────────────────────── */
  .product{display:flex;height:calc(100vh - 56px - var(--s5) - 56px);min-height:640px;background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh2)}
  .product.flat{height:auto;min-height:0;display:block;padding:var(--s6);overflow:visible;box-shadow:var(--sh1)}
  .pside{width:216px;flex:0 0 216px;background:var(--bg-sub);border-right:1px solid var(--bd);display:flex;flex-direction:column}
  .pside-brand{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s4) var(--s3)}
  .pside-brandname{font-size:13px;font-weight:600;letter-spacing:.2px}
  .pside-nav{padding:2px var(--s2) var(--s3)}
  .pnav{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-m);color:var(--t2);font-size:12.5px;margin-bottom:2px;transition:background .15s,color .15s}
  .pnav:hover{background:var(--g1);color:var(--t1)}
  .pnav.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .pnav .pi{width:16px;flex:0 0 16px;display:flex;justify-content:center;color:var(--g7)}
  .pnav.on .pi{color:var(--brand-6)}
  .pnav .bdg{margin-left:auto;font-size:10.5px;color:var(--t3);font-weight:500;font-variant-numeric:tabular-nums;background:var(--g2);padding:1px 6px;border-radius:var(--r-round)}
  .pnav.on .bdg{background:#fff;color:var(--brand-6)}
  .pnav-group{font-size:10.5px;color:var(--t4);padding:var(--s4) 10px var(--s2);letter-spacing:.6px}
  .puser{margin-top:auto;border-top:1px solid var(--bd);padding:var(--s3) var(--s4);display:flex;align-items:center;gap:9px}
  .puser .nm{flex:1;min-width:0}
  .puser .nm b{display:block;font-size:12.5px;font-weight:600;line-height:1.4}
  .puser .nm i{display:block;font-style:normal;font-size:10.5px;color:var(--t3);margin-top:1px}
  .pmain{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-card)}

  /* ── 品牌标记（六边形 + spark，替代 emoji） ── */
  .mark{display:flex;align-items:center;justify-content:center;flex:0 0 auto}

  /* ── 顶栏 ── */
  .phead{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);height:54px;border-bottom:1px solid var(--bd);flex:0 0 54px}
  .phead .ht{font-size:14px;font-weight:600;letter-spacing:.2px}
  .status-pill{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:var(--r-round);font-size:11.5px;font-weight:500;background:var(--warn-1);color:#b25f14;cursor:pointer;transition:background .15s;border:1px solid #f7ddc2}
  .status-pill:hover{background:#fdecd9}
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:0 0 6px}
  .phead-r{margin-left:auto;display:flex;align-items:center;gap:var(--s1)}
  .hbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-m);border:1px solid transparent;color:var(--t2);font-size:12.5px;transition:background .15s,color .15s,border-color .15s}
  .hbtn:hover{background:var(--g1);color:var(--t1)}
  .hbtn.hic{width:30px;padding:0;justify-content:center;border-color:var(--bd)}
  .hbtn.hic:hover{border-color:var(--brand);color:var(--brand-6)}
  .hbtn svg{width:15px;height:15px}

  /* ── 工作台（首页） ── */
  .wb{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:var(--s6) var(--s7) 0}
  .wbcol{width:100%;max-width:768px;display:flex;flex-direction:column;flex:1;min-height:0}

  .notice{display:flex;align-items:center;gap:var(--s3);padding:11px var(--s3) 11px var(--s2);border-radius:var(--r-l);background:linear-gradient(180deg,#f2fbf5,#eaf9ef);border:1px solid #cdeeda}
  .notice .ni{width:32px;height:32px;flex:0 0 32px;border-radius:var(--r-m);background:#fff;border:1px solid #d8f0e2;color:var(--brand-6);display:flex;align-items:center;justify-content:center}
  .notice .ni svg{width:16px;height:16px}
  .notice .nt{flex:1;min-width:0}
  .notice .nt b{display:block;font-size:13px;font-weight:600;color:var(--t1);letter-spacing:.1px}
  .notice .nt i{display:block;font-style:normal;font-size:11.5px;color:var(--t2);margin-top:1px}
  .notice .go{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 10px;border-radius:var(--r-m);font-size:12px;font-weight:600;color:var(--brand-6);background:#fff;border:1px solid #cdeeda;transition:all .15s}
  .notice .go:hover{background:var(--brand-1);border-color:var(--brand)}
  .notice .go svg{width:13px;height:13px}

  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--s8) 0 var(--s6)}
  .herowrap{position:relative}
  .datecard{position:absolute;right:-56px;top:2px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-l);box-shadow:var(--sh1);overflow:hidden;width:44px;text-align:center}
  .datecard .m{display:block;font-size:9.5px;font-weight:600;color:#fff;background:var(--brand);padding:2px 0;letter-spacing:.4px}
  .datecard .d{display:block;font-size:16px;font-weight:600;color:var(--t1);padding:2px 0 3px;font-variant-numeric:tabular-nums;line-height:1.3}
  .hero .hi{margin-top:var(--s5);font-size:22px;font-weight:600;line-height:1.4;letter-spacing:.2px}
  .hero .hi .em{color:var(--brand-6);margin-right:5px}
  .hero .tagline{margin-top:var(--s2);font-size:13px;color:var(--t2);line-height:1.75;max-width:460px}

  /* ── 专家卡滚动带 ── */
  .expertwrap{margin-top:var(--s2);position:relative;overflow:hidden;width:100%;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .experttrack{display:flex;gap:var(--s3);width:max-content;padding:2px}
  @media (prefers-reduced-motion: no-preference){
    .experttrack{animation:scrollx 46s linear infinite}
    .expertwrap:hover .experttrack{animation-play-state:paused}
    @keyframes scrollx{to{transform:translateX(calc(-50% - 6px))}}
  }
  .expcard{width:224px;flex:0 0 224px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-l);padding:var(--s3) var(--s3) 11px;text-align:left;transition:border-color .15s,box-shadow .15s}
  .expcard:hover{border-color:var(--brand);box-shadow:var(--sh2)}
  .expcard .eh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .expcard .ea{width:32px;height:32px;flex:0 0 32px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center}
  .expcard .ea svg{width:16px;height:16px}
  .expcard .et{flex:1;min-width:0}
  .expcard .et b{display:block;font-size:13px;font-weight:600;color:var(--t1);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .expcard .et i{display:block;font-style:normal;font-size:10.5px;color:var(--t3);margin-top:1px}
  .expcard .ed{font-size:11.5px;color:var(--t2);line-height:1.65;height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .expcard .etags{display:flex;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid var(--g1);overflow:hidden}
  .expcard .etg{font-size:10px;font-weight:500;color:var(--brand-6);background:var(--brand-1);padding:2px 7px;border-radius:var(--r-round);white-space:nowrap}
  .exphint{text-align:center;font-size:11px;color:var(--t4);margin-top:var(--s2);letter-spacing:.1px}
  .exphint b{color:var(--t3);font-weight:500}

  /* ── 输入框（对齐现有 Web 产品形态） ── */
  .composer{margin:auto 0 0;padding:var(--s5) 0 var(--s5);width:100%}
  .cbox{background:#fff;border:1px solid var(--bd2);border-radius:var(--r-xl);padding:var(--s3) var(--s3) 9px;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s}
  .cbox:hover{border-color:var(--g5)}
  .cbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-1)}
  .cbox .cph{display:block;font-size:13.5px;color:var(--t4);padding:3px 6px var(--s6);line-height:1.6}
  .cbox .crow{display:flex;align-items:center;gap:2px}
  .csel{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 11px;border-radius:var(--r-m);border:1px solid var(--bd);background:#fff;font-size:12px;font-weight:500;color:var(--t1);transition:all .15s;white-space:nowrap;max-width:190px}
  .csel:hover{border-color:var(--brand);color:var(--brand-6);background:var(--brand-1)}
  .csel .nm2{overflow:hidden;text-overflow:ellipsis}
  .csel svg{width:12px;height:12px;color:var(--t3);flex:0 0 12px}
  .csel .cdot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:0 0 6px}
  .cin{width:30px;height:30px;flex:0 0 30px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;color:var(--g7);transition:background .15s,color .15s}
  .cin:hover{background:var(--g1);color:var(--t1)}
  .cin svg{width:16px;height:16px}
  .cmode{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 8px 0 11px;border-radius:var(--r-m);border:1px solid var(--bd);background:#fff;font-size:12px;color:var(--t2);transition:all .15s;white-space:nowrap}
  .cmode:hover{border-color:var(--brand);color:var(--brand-6);background:var(--brand-1)}
  .cmode svg{width:12px;height:12px;color:var(--t3);flex:0 0 12px}
  .csend{width:32px;height:32px;flex:0 0 32px;margin-left:var(--s2);border-radius:var(--r-m);background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s}
  .csend:hover{background:var(--brand-active)}
  .csend svg{width:16px;height:16px}
  .csend.dim{background:var(--brand-2);color:#fff;cursor:default}
  .chint{text-align:center;font-size:11px;color:var(--t4);margin-top:var(--s3);letter-spacing:.1px}
  .chint b{color:var(--t3);font-weight:500}

  /* ── 对话 · 成稿工作区 ── */
  .chat{flex:1;min-height:0;overflow-y:auto;padding:var(--s6) var(--s7) var(--s3)}
  .chatcol{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}
  .msg.me{display:flex;justify-content:flex-end}
  .msg.me .bub{background:var(--brand-1);color:var(--t1);border-radius:var(--r-l) var(--r-l) var(--r-s) var(--r-l);padding:10px 14px;max-width:74%;line-height:1.72;font-size:13px}
  .msg.me .bub .ctx{display:block;font-size:10.5px;color:var(--brand-6);font-weight:600;margin-bottom:3px;letter-spacing:.2px}
  .msg.ai{display:flex;gap:11px}
  .msg.ai .body{flex:1;min-width:0}
  .msg.ai .who{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:7px}
  .draft{border:1px solid var(--bd);border-radius:var(--r-l);background:#fff;box-shadow:var(--sh1);overflow:hidden}
  .draft .dh{display:flex;align-items:center;gap:var(--s2);padding:9px var(--s4);border-bottom:1px solid var(--bd);background:var(--bg-sub)}
  .draft .dh .dtg{font-size:10.5px;font-weight:600;color:var(--brand-6);background:var(--brand-1);padding:2px 8px;border-radius:var(--r-round)}
  .draft .dh .sc{font-size:10.5px;color:var(--t3);margin-left:auto;font-variant-numeric:tabular-nums}
  .draft .db{padding:var(--s4) var(--s4) var(--s3);font-size:13px;line-height:1.85;color:var(--t1)}
  .draft .db p{margin:0 0 9px}
  .draft .db p:last-child{margin:0}
  .draft .dcite{padding:9px var(--s4);border-top:1px dashed var(--bd);font-size:10.5px;color:var(--t3);line-height:1.7;background:var(--bg-sub)}
  .draft .dcite b{color:var(--t2);font-weight:600}
  .acts{display:flex;gap:var(--s2);margin-top:10px;flex-wrap:wrap}
  .act{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:var(--r-m);border:1px solid var(--bd);background:#fff;font-size:12px;font-weight:500;color:var(--t2);transition:all .15s}
  .act:hover{border-color:var(--brand);color:var(--brand-6);background:var(--brand-1)}
  .act svg{width:13px;height:13px}
  .chatbar{flex:0 0 auto;padding:var(--s2) var(--s7) var(--s5)}
  .chatbar .inwrap{max-width:700px;margin:0 auto}

  /* ── 映射对照表 ── */
  .dtbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh1)}
  .dtbl th{text-align:left;font-size:11px;font-weight:600;color:var(--t3);padding:11px var(--s4);background:var(--bg-sub);letter-spacing:.4px;border-bottom:1px solid var(--bd)}
  .dtbl td{padding:12px var(--s4);border-top:1px solid var(--g1);vertical-align:top;line-height:1.7;color:var(--t1)}
  .dtbl tr:first-child td{border-top:none}
  .dtbl tbody tr:hover td,.dtbl tr:hover td{background:#fcfdfc}

  { key:'home', n:1, label:'小睿 · 首页', path:'登录默认页 / 左栏「小睿」', render:vHome },

  { key:'map',  n:3, label:'移动端 → Web 端映射', path:'—', render:vMap }
];
var SPECS = {
  home: { goal:'web 首页只回答一件事：现在能让小睿写什么。结构从移动端截图逐元素搬过来，位置跟着 web 的壳走。',
    pts:[
      '<b>左栏 = 移动端 dock 的同构体</b>：小睿 / 记忆 / 整理 / 提醒四项原样上移；<b>专家广场、客户空间</b>收进左栏「入口」分组——移动端它们在 dock 上方，web 端对应导航下方，同一信息只出现这一次。',
      '<b>说话入口从凸起键换成常驻输入条</b>，形态对齐现有 Web 产品输入框：上排输入区、下排工具行——左为<b>专家切换</b>（选中专家带绿点）/ 附件 / @引用（挂记忆与待办），右为<b>回复模式（均衡）</b>与发送；空输入时发送置灰。输入条是首页唯一的主操作区。',
      '<b>「记忆卡未连接」从副标题升为顶栏状态徽标</b>：橙色圆点 + 文案，可点击查看原因。警示但不阻断——下方功能全部可用，只是提醒「连上后小睿会记得更准」。',
      '<b>秋季招生冲刺收成一行通知条</b>：标题 + 今天 0 条待处理 + 去处理。移动端整幅卡在 web 端压缩为一行，把竖向空间还给问候区和专家卡带。',
      '<b>能力卡区 = 动态滚动的专家卡片带</b>：把静态能力卡四件套与「专家广场预览」<b>合并成一条</b>无缝滚动卡带——每张专家卡自带擅长能力标签（家校反馈 / 到访跟进长在卡上），原本两处讲能力、现在只此一处。卡带两端渐隐、悬停暂停、点击进对话；卡数多于可视宽度才滚，内容持续轮播不重页。它与左栏「专家广场」不冲突：卡带是<b>可直接开工的预览</b>，左栏入口进<b>全量广场</b>（按岗位筛选 / 浏览全部），层级不同。',
      '<b>六边形头像 + 日期徽章 + Hi 问候区原样保留</b>：这是页面的情绪锚点，也是「小睿是人不是工具」的落点；日期徽章挪到头像右侧悬浮卡。',
      '<b>视觉改版要点（v1.1）</b>：头像弃 emoji 与渐变，改<b>六边形品牌标记</b>（品牌绿描边 + spark）；专家头像改<b>纯色底 + 同色深图标</b>四色轮转；字重收敛为 <b>400 / 600</b>；间距全量对齐 <b>4px 栅格</b>；去掉一切发光与重力阴影，只留 <code>--sh1/--sh2</code> 两级。'
    ],
    api:'接线：<code>GET /agent/status</code>（记忆卡连接态，驱动顶栏徽标）· <code>GET /service/reminders?due=today</code>（通知条计数）· 专家卡点击即带对应专家与场景预填进 <code>/agent/chat</code>。'},
  chat: { goal:'成稿工作区证明那句话：「发什么我来写——每次都给你能直接发出去的成稿」。',
    pts:[
      '<b>产出物是一张成稿卡</b>，不是一段聊天回复：带「可直接发送的成稿」标签、字数与口吻标注（微信口吻 / 约 120 字）。',
      '<b>依据压成卡底一行灰字</b>（试听观察 · 家庭档案 · 顾虑台账）：分身与通用助手的可见差别就是它引用的是这个家的记录。',
      '<b>动作只给三个改稿动作 + 发送</b>：换个说法 / 再短一点 / 带上观察记录；右下发送键 = <b>复制成稿</b>，复制动作本身点了才生效（先确认后执行，小睿不直接发给家长）。',
      '<b>顶栏出现「新对话」</b>：进入对话后首页输入条让位，新对话入口顶栏接管（同一条信息不出现两次）。',
      '<b>输入条沿用同一构件</b>：只把专家选择器切到当前专家（绿点 + 名称）、发送键语义改为「复制成稿」——两端同一个 <code>composerBox()</code>，改一处全生效。'
    ]},
  map: { goal:'把「搬什么、换什么、为什么」一次讲清，评审按行确认。',
    pts:[
      '<b>原样搬的</b>：四 tab 结构、专家能力四件套、问候区、专家广场 / 客户空间入口——信息架构不因端而变。',
      '<b>换位置的</b>：dock → 左栏、副标题状态 → 顶栏徽标、整幅横幅 → 一行通知条、2×2 → 专家卡滚动带。',
      '<b>换形态的</b>：凸起键 → 常驻输入条；能力卡 → 动态滚动专家卡带（能力标签上卡，专家广场预览合并进来）。',
      '<b>颜色换源</b>：移动端绿 #23B99D 不进 web；web 一律 TDesign 绿 #07c05f。两族并存、各守各的真源，不做颜色混用。',
      '<b>视觉级差（v1.1）</b>：移动端保留 emoji 狮头插画（有插画真源），web 端不抬 emoji，统一用六边形品牌标记；两端共享同一套语义色与圆角阶梯，字重都收敛到两档。'
    ]}
};

var RENDER = {};
SCENES.forEach(function(s){ RENDER[s.key] = s.render; });
var state = { scene:'home' };
function $(s){ return document.querySelector(s); }

function layout(){
  var s = SCENES.filter(function(x){ return x.key === state.scene; })[0] || SCENES[0];
  state.scene = s.key;
  $('#barTitle').textContent = s.label;
  $('#barPath').textContent = s.path;
  $('#canvas').innerHTML = RENDER[s.key]();
  var sp = SPECS[s.key];
  $('#spec').innerHTML = '<h3>' + s.label + '</h3><p class="goal">' + sp.goal + '</p>' +
    '<div class="plabel">设计要点</div><ul>' +
    sp.pts.map(function(p, i){ return '<li><span class="n">' + (i + 1) + '</span>' + p + '</li>'; }).join('') +
    '</ul>' + (sp.api ? '<div class="pnote"><b>接线</b>' + sp.api + '</div>' : '');
  $('#rail').innerHTML = SCENES.map(function(x){
    return '<button class="rail-btn' + (x.key === s.key ? ' on' : '') + '" data-scene="' + x.key + '">' +
      '<span class="idx">' + x.n + '</span><span class="lb">' + x.label + '</span></button>';
  }).join('');
}

function setHash(h){ try { history.replaceState(null, '', '#' + h); } catch (err) {} }
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-scene],[data-act],[data-pill],[data-exp]');
  if (!t) return;
  if (t.hasAttribute('data-scene')){ state.scene = t.getAttribute('data-scene'); setHash(state.scene); return layout(); }
  var n = t.getAttribute('data-act') || t.getAttribute('data-pill') || t.getAttribute('data-exp');
  if (n){ t.title = '原型演示：' + n + '（真实产品中此处进入对应流程）'; return; }
});
window.addEventListener('hashchange', function(){
  var k = (location.hash || '').replace('#','');
  if (k && k !== state.scene && RENDER[k]){ state.scene = k; layout(); }
});
(function(){ var k = (location.hash || '').replace('#',''); if (k && RENDER[k]) state.scene = k; })();
layout();
</script>
</body>
