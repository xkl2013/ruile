<!DOCTYPE html>
<html lang="zh-CN" theme-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>服务模块优化原型 · 睿乐大脑</title>
<style>
  :root{
    --app-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --brand:#07c05f; --brand-hover:#08dd6e; --brand-active:#06b04d;
    --brand-1:#e9f8ec; --brand-3:#08dd6e; --brand-6:#049b38; --brand-8:#027218;
    --warn:#ed7b2f; --warn-1:#fef3e6;
    --error:#e34d59; --error-1:#fdecee;
    --success:#00a870; --success-1:#e8f8f2;
    --info:#2f7de1; --info-1:#eaf1ff;
    --g1:#f3f3f3; --g2:#eee; --g3:#e7e7e7; --g4:#dcdcdc; --g5:#c5c5c5;
    --g6:#a6a6a6; --g7:#8b8b8b; --g9:#5e5e5e; --g12:#2c2c2c;
    --t1:rgba(0,0,0,.9); --t2:rgba(0,0,0,.6); --t3:rgba(0,0,0,.4); --t4:rgba(0,0,0,.26);
    --bg-page:#f3f5f4; --bg-card:#fff; --bd:#e7e7e7; --bd2:#dcdcdc;
    --r-s:2px; --r:3px; --r-m:6px; --r-l:9px; --r-xl:12px; --r-round:999px;
    --sh1:0 1px 10px rgba(0,0,0,.05),0 4px 5px rgba(0,0,0,.04),0 2px 4px -1px rgba(0,0,0,.06);
    --sh2:0 3px 14px 2px rgba(0,0,0,.05),0 8px 10px 1px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--app-font-family);background:var(--bg-page);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--g4);border-radius:var(--r-round)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── 原型外壳 ───────────────────────────────────────── */
  .app{display:flex;height:100vh;overflow:hidden}
  .rail{width:238px;flex:0 0 238px;background:#fbfcfb;border-right:1px solid var(--bd);display:flex;flex-direction:column}
  .rail-head{padding:18px 18px 14px}
  .rail-title{font-size:15px;font-weight:600;letter-spacing:.2px}
  .rail-sub{font-size:12px;color:var(--t3);margin-top:4px;line-height:1.6}
  .rail-group{padding:6px 10px;overflow-y:auto;flex:1}
  .rail-label{font-size:11px;color:var(--t4);padding:12px 8px 6px;letter-spacing:.6px}
  .rail-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-m);color:var(--t2);text-align:left;line-height:1.35;transition:background .14s,color .14s;margin-bottom:2px}
  .rail-btn:hover{background:var(--g1);color:var(--t1)}
  .rail-btn.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .rail-btn .idx{width:19px;height:19px;flex:0 0 19px;border-radius:var(--r-round);background:var(--g3);color:var(--g7);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
  .rail-btn.on .idx{background:var(--brand);color:#fff}
  .rail-btn .lb{font-size:13px}
  .rail-note{margin:10px 10px 0;padding:9px 11px;border-radius:var(--r-l);background:var(--warn-1);color:#8a4a12;font-size:11.5px;line-height:1.65}
  .rail-note b{display:block;font-size:12px;margin-bottom:3px;color:#6f3a08}
  .rail-foot{padding:12px 18px 16px;border-top:1px solid var(--bd);font-size:11px;color:var(--t4);line-height:1.7}

  .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-page)}
  .bar{display:flex;align-items:center;gap:12px;padding:11px 22px;background:var(--bg-card);border-bottom:1px solid var(--bd);flex-wrap:wrap;min-height:56px}
  .bar h1{margin:0;font-size:16px;font-weight:600}
  .bar .path{font-size:11.5px;color:var(--t3);font-family:ui-monospace,Menlo,monospace;background:var(--g1);padding:3px 8px;border-radius:var(--r)}
  .verstamp{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--brand-6);background:var(--brand-1);border:1px solid #b9e8c9;padding:2px 7px;border-radius:var(--r-round);cursor:help}
  .bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .scroll{flex:1;overflow-y:auto;padding:18px 22px 60px}
  .canvas{max-width:1180px;margin:0 auto}
  .canvas.bleed{max-width:none}

  /* ── 通用控件 ───────────────────────────────────────── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 15px;border-radius:var(--r-m);border:1px solid var(--bd2);background:#fff;color:var(--t1);font-size:13px;transition:all .14s;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand-6)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
  .btn.pri:hover{background:var(--brand-active);border-color:var(--brand-active);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--t2)}
  .btn.ghost:hover{background:var(--g1);color:var(--t1)}
  .btn.sm{height:27px;padding:0 11px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:var(--r);font-size:11px;background:var(--g1);color:var(--t2);white-space:nowrap}
  .tag.brand{background:var(--brand-1);color:var(--brand-6)}
  .tag.warn{background:var(--warn-1);color:#b25f14}
  .tag.info{background:var(--info-1);color:#2258a8}
  .tag.err{background:var(--error-1);color:#b03442}
  .chip{height:28px;padding:0 13px;border-radius:var(--r-round);border:1px solid var(--bd2);background:#fff;font-size:12px;color:var(--t2);transition:all .14s}
  .chip:hover{border-color:var(--brand);color:var(--brand-6)}
  .chip.on{background:var(--brand-1);border-color:var(--brand);color:var(--brand-6);font-weight:600}
  .field{height:32px;padding:0 11px;border:1px solid var(--bd2);border-radius:var(--r-m);background:#fff;width:100%;outline:none;transition:border-color .14s}
  .field:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-1)}
  .field::placeholder{color:var(--t4)}
  textarea.field{height:auto;padding:9px 11px;resize:vertical;line-height:1.6}
  .lbl{font-size:12px;color:var(--t2);margin-bottom:6px;display:block}
  .lbl .req{color:var(--error);margin-left:3px}
  .lbl .opt{color:var(--t4);font-size:11px;margin-left:5px}
  .hint{font-size:11.5px;color:var(--t3);line-height:1.65;margin-top:6px}
  .muted{color:var(--t3)}
  .mono{font-family:ui-monospace,Menlo,monospace}
  .sec-title{font-size:13px;font-weight:600;margin:0 0 10px}
  .card{background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-xl);box-shadow:var(--sh1)}
  .note{border-radius:var(--r-l);padding:11px 14px;font-size:12.5px;line-height:1.7}
  .note.brand{background:var(--brand-1);color:#155f36;border:1px solid #b9e8c9}
  .note.warn{background:var(--warn-1);color:#8a4a12;border:1px solid #f5d3ae}
  .note.gray{background:var(--g1);color:var(--t2);border:1px solid var(--bd)}
  .note.err{background:var(--error-1);color:#8f2a36;border:1px solid #f6c8cd}
  .note b{font-weight:600}

  /* ── 产品外壳（侧栏 + 主区） ─────────────────────────── */
  .product{display:flex;height:calc(100vh - 56px - 36px - 60px);min-height:620px;background:var(--bg-card);border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh1)}
  .pside{width:236px;flex:0 0 236px;background:#fbfcfb;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
  .pside-brand{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
  .pside-logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand-6));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700}
  .pside-brandname{font-size:13.5px;font-weight:600}
  .pside-nav{padding:2px 10px 12px;overflow-y:auto;flex:1}
  .pnav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-m);color:var(--t2);font-size:13px}
  .pnav:hover{background:var(--g1)}
  .pnav.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .pnav .pi{width:16px;flex:0 0 16px;text-align:center;color:var(--t3)}
  .pnav.on .pi{color:var(--brand-6)}
  .pnav .chev{margin-left:auto;color:var(--t4);font-size:10px}
  .psub{padding-left:4px}
  .pservice{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-m);color:var(--t2);font-size:12.5px}
  .pservice:hover{background:var(--g1)}
  .pservice.on{background:#eef6f1;color:var(--brand-6);font-weight:600}
  .pservice .psi{width:14px;flex:0 0 14px;text-align:center;color:var(--t3)}
  .pservice.on .psi{color:var(--brand-6)}
  .pservice .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pservice .cnt{margin-left:auto;font-size:11px;color:var(--t4)}
  /* v1.16：＋ 收进服务行——平时显示会话计数，悬停该行时计数换成 ＋（新建会话） */
  .pservice .padd{display:none;margin-left:auto;width:20px;height:20px;border-radius:var(--r);border:1px solid var(--line);background:#fff;color:var(--t2);font-size:13px;line-height:1;align-items:center;justify-content:center;flex:none}
  .pservice .padd:hover{border-color:var(--brand-5);color:var(--brand-6);background:var(--g1)}
  .pservice:hover .cnt{display:none}
  .pservice:hover .padd{display:inline-flex}
  .psessions{padding:1px 0 4px 22px}
  .psess{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:var(--r);color:var(--t3);font-size:12px;text-align:left}
  .psess:hover{background:var(--g1);color:var(--t1)}
  .psess.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .psess .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .psess .pin{margin-left:auto;color:var(--brand);font-size:8px}
  .psess-more{display:block;width:100%;padding:5px 8px;color:var(--t4);font-size:11.5px;text-align:left}
  .psess-more:hover{color:var(--brand-6)}
  .pmain{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-card)}

  /* ── 服务头 ─────────────────────────────────────────── */
  .sphead{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--bd);flex:0 0 52px;position:relative;background:#fff}
  .spback{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:16px;line-height:1}
  .spback:hover{background:var(--g1);color:var(--t1)}
  .spico{width:22px;height:22px;flex:0 0 22px;border-radius:var(--r-m);background:var(--brand-1);color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:12px}
  .spname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
  .sptype{font-size:11px;color:var(--t3);background:var(--g1);padding:2px 7px;border-radius:var(--r);white-space:nowrap}
  .spstate{font-size:11px;padding:2px 7px;border-radius:var(--r);background:var(--warn-1);color:#b25f14;white-space:nowrap}
  .spactions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .hbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:var(--r-m);border:1px solid transparent;color:var(--t2);font-size:12.5px;transition:all .14s}
  .hbtn:hover{background:var(--g1);color:var(--t1)}
  .hbtn.on{background:var(--brand-1);color:var(--brand-6);font-weight:600}
  .hbtn .ci{font-size:13px}
  .hbtn em{font-style:normal;font-size:11px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-round);background:var(--g2);color:var(--t2);display:inline-flex;align-items:center;justify-content:center}
  .hbtn.on em{background:var(--brand);color:#fff}
  .cbtn{width:30px;height:30px;flex:0 0 30px;border-radius:var(--r-round);border:1px solid var(--bd2);background:#fff;color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;transition:all .14s}
  .cbtn:hover{border-color:var(--brand);color:var(--brand-6)}
  .morewrap{position:relative}
  .moremenu{position:absolute;right:0;top:36px;z-index:40;width:236px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-l);box-shadow:var(--sh2);padding:5px;font-size:13px}
  .mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-m);color:var(--t1);text-align:left}
  .mi:hover{background:var(--g1)}
  .mi .mx{margin-left:auto;color:var(--t4);font-size:11px}
  .msep{height:1px;background:var(--bd);margin:5px 6px}
  .mgroup{font-size:10.5px;color:var(--t4);padding:7px 10px 3px;letter-spacing:.5px}
  .mi.danger{color:var(--error)}
  .mi.danger:hover{background:var(--error-1)}
  .msub{background:#fbfcfb;border:1px solid var(--bd);border-radius:var(--r-m);margin:3px 0;overflow:hidden}

  /* ── 对话区 ─────────────────────────────────────────── */
  .workbench{flex:1;min-height:0;display:flex;position:relative}
  .chatcol{flex:1;min-width:0;display:flex;flex-direction:column}
  .chathead{display:flex;align-items:center;gap:9px;padding:10px 20px;border-bottom:1px solid var(--bd);flex:0 0 auto}
  .chathead strong{font-size:13px;font-weight:600}
  .chathead .expert{font-size:11px;color:var(--brand-6);background:var(--brand-1);padding:2px 7px;border-radius:var(--r)}
  .chathead .time{margin-left:auto;font-size:11px;color:var(--t4)}
  .chatbody{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 12px}
  .msg{max-width:720px;margin:0 auto 18px}
  .msg.me{display:flex;justify-content:flex-end}
  .msg.me .bubble{background:var(--brand-1);color:var(--t1);border-radius:var(--r-l) var(--r-l) var(--r-s) var(--r-l);padding:10px 14px;max-width:76%;line-height:1.72;font-size:13.5px}
  .msg.ai .who{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .msg.ai .who b{font-size:12.5px}
  .msg.ai .who .done{font-size:11px;color:var(--success);background:var(--success-1);padding:1px 7px;border-radius:var(--r)}
  .steps{border:1px solid var(--bd);border-radius:var(--r-m);background:#fbfcfb;margin-bottom:9px}
  .steps summary{padding:7px 11px;font-size:11.5px;color:var(--t2);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
  .steps summary::-webkit-details-marker{display:none}
  .steps .st{padding:0 11px 9px 26px;font-size:11.5px;color:var(--t3);line-height:1.9}
  .aitext{font-size:13.5px;line-height:1.78;color:var(--t1)}
  .aitext p{margin:0 0 9px}
  .artcard{display:flex;align-items:center;gap:11px;border:1px solid var(--bd);border-radius:var(--r-l);background:#fff;padding:11px 13px;margin-top:10px;cursor:pointer;transition:all .14s;box-shadow:var(--sh1)}
  .artcard:hover{border-color:var(--brand);box-shadow:var(--sh2)}
  .artcard .ico{width:34px;height:34px;flex:0 0 34px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:var(--success)}
  .artcard .ico.xlsx{background:var(--success)}
  .artcard .ico.md{background:var(--info)}
  .artcard .ico.pdf{background:var(--error)}
  .artcard .t{font-size:13px;font-weight:600}
  .artcard .m{font-size:11.5px;color:var(--t3);margin-top:2px}
  .artcard .go{margin-left:auto;font-size:11.5px;color:var(--brand-6)}
  .msgfoot{display:flex;gap:16px;margin-top:9px;font-size:11.5px;color:var(--t3)}
  .msgfoot button:hover{color:var(--brand-6)}
  .composer{flex:0 0 auto;padding:0 20px 18px}
  .composer-inner{max-width:720px;margin:0 auto}
  .box{border:1px solid var(--bd2);border-radius:var(--r-xl);background:#fff;box-shadow:var(--sh1);transition:border-color .14s}
  .box:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-1)}
  .box textarea{width:100%;border:none;outline:none;padding:12px 14px 4px;resize:none;font-size:13.5px;line-height:1.7;background:none;display:block;height:56px}
  .box textarea::placeholder{color:var(--t4)}
  .boxfoot{display:flex;align-items:center;gap:8px;padding:6px 9px 9px 12px}
  .boxfoot .spacer{flex:1}
  .expick{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 6px 0 9px;border-radius:var(--r-round);border:1px solid var(--bd2);font-size:12px;color:var(--t2);background:#fff}
  .expick:hover{border-color:var(--brand);color:var(--brand-6)}
  .expick .av{width:16px;height:16px;border-radius:var(--r-round);background:var(--brand-1);color:var(--brand-6);font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .expick .cw{color:var(--t4);font-size:9px}
  .sendbtn{width:32px;height:32px;border-radius:var(--r-round);background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
  .suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .suggest button{height:28px;padding:0 12px;border-radius:var(--r-round);border:1px dashed var(--bd2);color:var(--t2);font-size:12px;background:#fff}
  .suggest button:hover{border-color:var(--brand);border-style:solid;color:var(--brand-6)}
  .emptychat{max-width:720px;margin:0 auto;padding-top:34px;text-align:center}
  .emptychat .ei{width:46px;height:46px;margin:0 auto 12px;border-radius:var(--r-round);background:var(--brand-1);color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:20px}
  .emptychat h3{margin:0 0 6px;font-size:15px;font-weight:600}
  .emptychat p{margin:0;font-size:12.5px;color:var(--t3);line-height:1.75}
  .emptychat .suggest{justify-content:center;margin-top:14px}

  /* ── 右侧浮层 ───────────────────────────────────────── */
  .sidepanel{position:absolute;right:12px;top:0;bottom:78px;width:330px;background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);box-shadow:var(--sh2);display:flex;flex-direction:column;overflow:hidden;z-index:20}
  .sp-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--bd);flex:0 0 auto}
  .sp-head strong{font-size:13px;font-weight:600}
  .sp-head .x{margin-left:auto;width:24px;height:24px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px}
  .sp-head .x:hover{background:var(--g1);color:var(--t1)}
  .sp-body{flex:1;min-height:0;overflow-y:auto;padding:12px}
  .sp-tabs{display:flex;gap:6px;padding:0 12px 10px;border-bottom:1px solid var(--bd)}
  .artitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-l);border:1px solid transparent;text-align:left;transition:all .14s}
  .artitem:hover{background:var(--g1)}
  .artitem.on{background:var(--brand-1);border-color:#b9e8c9}
  .artitem .ico{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;background:var(--success)}
  .artitem .ico.md{background:var(--info)}
  .artitem .t{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .artitem .m{font-size:11px;color:var(--t4);margin-top:2px}
  .artprev{border:1px solid var(--bd);border-radius:var(--r-l);overflow:hidden;margin-top:10px}
  .artprev .ph{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#fbfcfb;border-bottom:1px solid var(--bd);font-size:12px}

  .artprev .pf{display:flex;gap:14px;padding:8px 11px;border-top:1px solid var(--bd);font-size:11.5px}
  .artprev .pf a{color:var(--brand-6);text-decoration:none}
  .rform{border:1px solid var(--bd);border-radius:var(--r-l);background:#fbfcfb;padding:11px;margin-bottom:12px}
  .rform .row{display:flex;gap:8px;margin-top:8px}
  .ritem{border:1px solid var(--bd);border-radius:var(--r-l);padding:10px 11px;margin-bottom:9px;background:#fff}
  .rfoot{margin:12px 2px 4px;font-size:11px;color:var(--t3);line-height:1.7;border-top:1px dashed var(--bd2);padding-top:10px}
  .rfoot b{color:var(--t2);font-weight:600}
  .ritem .rh{display:flex;align-items:flex-start;gap:8px}
  .ritem .rt{font-size:12.5px;font-weight:600;line-height:1.45}
  .ritem .pr{font-size:10.5px;padding:1px 6px;border-radius:var(--r);background:var(--error-1);color:#b03442;white-space:nowrap}
  .ritem .pr.mid{background:var(--warn-1);color:#b25f14}
  .ritem .pr.low{background:var(--g1);color:var(--t2)}
  .ritem .rm{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--t3);margin-top:7px;flex-wrap:wrap}
  .ritem .who{display:flex;align-items:center;gap:5px}
  .ritem .av{width:18px;height:18px;border-radius:var(--r-round);background:var(--brand-1);color:var(--brand-6);font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .ritem .rf{display:flex;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--bd)}
  .tlbtn{font-size:11.5px;color:var(--brand-6);padding:3px 9px;border-radius:var(--r-round);border:1px solid #b9e8c9;background:var(--brand-1)}
  .tlbtn:hover{background:#d8f2e0}
  .collab{margin-top:10px;border-top:1px dashed var(--bd);padding-top:10px}
  .cmt{display:flex;gap:8px;margin-bottom:9px}
  .cmt .av{width:22px;height:22px;flex:0 0 22px;border-radius:var(--r-round);background:var(--g2);color:var(--t2);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .cmt .cb{font-size:12px;line-height:1.65;color:var(--t1)}
  .cmt .cd{font-size:10.5px;color:var(--t4);margin-top:3px}
  .empty{font-size:12px;color:var(--t3);text-align:center;padding:26px 12px;line-height:1.75}

  /* ── 列表页 ─────────────────────────────────────────── */
  .listhead{display:flex;align-items:flex-start;gap:16px;padding:22px 26px 16px}
  .listhead h1{margin:0 0 5px;font-size:20px;font-weight:700;letter-spacing:.2px}
  .listhead p{margin:0;font-size:12.5px;color:var(--t3)}
  .listhead .act{margin-left:auto;flex:0 0 auto}
  .listbody{padding:0 26px 30px}
  .sechead{display:flex;align-items:center;gap:10px;margin:6px 0 13px}
  .sechead .st{font-size:13.5px;font-weight:600}
  .sechead .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .search{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--bd2);border-radius:var(--r-m);background:#fff;min-width:180px}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-1)}
  .search input{border:none;outline:none;background:none;flex:1;min-width:0;font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px}
  .scard{background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);padding:15px 16px;box-shadow:var(--sh1);transition:all .16s;cursor:pointer;text-align:left;display:block;width:100%}
  .scard:hover{border-color:var(--brand);box-shadow:var(--sh2);transform:translateY(-2px)}
  .scard .top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .scard .ic{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-m);background:var(--brand-1);color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:14px}
  .scard .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scard .dots{margin-left:auto;color:var(--t4);font-size:13px;padding:0 3px}
  .scard .tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .scard .desc{font-size:12.5px;color:var(--t2);line-height:1.65;min-height:38px;margin:0 0 11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .scard .mt{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--t4);padding-top:10px;border-top:1px solid var(--bd)}
  .tgroups{margin-top:22px}
  .tgroup{margin-bottom:20px}
  .tglabel{font-size:12px;color:var(--t3);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .tglabel:after{content:'';flex:1;height:1px;background:var(--bd)}
  .tcard{background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);padding:15px 16px;box-shadow:var(--sh1);transition:all .16s;cursor:pointer;text-align:left;width:100%;display:block}
  .tcard:hover{border-color:var(--brand);box-shadow:var(--sh2)}
  .tcard .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .tcard .ic{width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-m);background:var(--info-1);color:#2258a8;display:flex;align-items:center;justify-content:center;font-size:14px}
  .tcard .nm{font-size:13.5px;font-weight:600}
  .tcard p{margin:0 0 9px;font-size:12px;color:var(--t2);line-height:1.65;min-height:38px}
  .tcard .ft{font-size:11px;color:var(--t4);display:flex;align-items:center;gap:6px}

  /* ── 空态 ───────────────────────────────────────────── */
  .emptywrap{background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);padding:44px 26px;text-align:center;box-shadow:var(--sh1)}
  .emptywrap .ei{width:56px;height:56px;margin:0 auto 16px;border-radius:18px;background:var(--brand-1);color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:24px}
  .emptywrap h2{margin:0 0 8px;font-size:17px;font-weight:600}
  .emptywrap p{margin:0 auto;font-size:13px;color:var(--t3);line-height:1.8;max-width:520px}
  .emptywrap .acts{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

  /* ── 创建表单 ───────────────────────────────────────── */
  .formwrap{max-width:660px;margin:0 auto}
  .formcard{padding:22px 24px;margin-bottom:14px}
  .fgroup{margin-bottom:20px}
  .fgroup:last-child{margin-bottom:0}
  .radiogroup{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .radio{border:1px solid var(--bd2);border-radius:var(--r-l);padding:11px 12px;cursor:pointer;transition:all .14s;background:#fff;text-align:left}
  .radio:hover{border-color:var(--brand)}
  .radio.on{border-color:var(--brand);background:var(--brand-1);box-shadow:inset 0 0 0 1px var(--brand)}
  .radio .rt{font-size:13px;font-weight:600;display:block;margin-bottom:3px}
  .radio.on .rt{color:var(--brand-6)}
  .radio .rd{font-size:11px;color:var(--t3);line-height:1.55}
  .picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pickchip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 9px;border-radius:var(--r-round);background:var(--brand-1);border:1px solid #b9e8c9;font-size:12.5px;color:var(--brand-6)}
  .pickchip .av{width:18px;height:18px;border-radius:var(--r-round);background:var(--brand);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .pickchip .x{width:18px;height:18px;border-radius:var(--r-round);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--brand-6)}
  .pickchip .x:hover{background:#cbeed8}
  .addchip{height:32px;padding:0 13px;border-radius:var(--r-round);border:1px dashed var(--bd2);color:var(--t2);font-size:12.5px;background:#fff}
  .addchip:hover{border-color:var(--brand);border-style:solid;color:var(--brand-6)}
  .formfoot{display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--bd);background:#fbfcfb;border-radius:0 0 var(--r-xl) var(--r-xl)}
  .formfoot .spacer{flex:1}

  /* ── 设置页 ─────────────────────────────────────────── */
  .settings{display:flex;min-height:520px}
  .setnav{width:186px;flex:0 0 186px;border-right:1px solid var(--bd);padding:12px 10px;background:#fbfcfb}
  .setnav .sn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:var(--r-m);font-size:12.5px;color:var(--t2);text-align:left}
  .setnav .sn:hover{background:var(--g1)}
  .setnav .sn.on{background:#fff;color:var(--brand-6);font-weight:600;box-shadow:var(--sh1)}
  .setnav .sngroup{font-size:10.5px;color:var(--t4);padding:12px 10px 5px;letter-spacing:.5px}
  .setbody{flex:1;min-width:0;padding:20px 24px}
  .setbody h2{margin:0 0 6px;font-size:15px;font-weight:600}
  .setbody .sub{font-size:12px;color:var(--t3);margin:0 0 18px;line-height:1.7}
  .fgrid{border:1px solid var(--bd);border-radius:var(--r-l);overflow:hidden}
  .frow{display:grid;grid-template-columns:1fr 96px 66px;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);background:#fff}
  .frow:last-child{border-bottom:none}
  .frow.head{background:#fbfcfb;font-size:11.5px;color:var(--t3);font-weight:600}
  .frow .c{display:flex;align-items:center;gap:8px}
  .frow .del{font-size:11.5px;color:var(--error);text-align:right}
  .frow .del:hover{text-decoration:underline}
  .switch{width:34px;height:19px;border-radius:var(--r-round);background:var(--brand);position:relative;flex:0 0 34px;cursor:pointer}
  .switch:after{content:'';position:absolute;width:15px;height:15px;border-radius:var(--r-round);background:#fff;top:2px;left:17px}
  .addrow{display:flex;gap:9px;margin-top:12px;align-items:center}

  /* ── 重点记录（推荐 chips + 标签 + 预览） ─────────────── */
  .ovgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .ovbox{background:#fff;border:1px solid var(--bd);border-radius:var(--r-l);padding:14px 15px}
  .ovbox h3{margin:0 0 4px;font-size:12.5px;font-weight:600}
  .ovbox .hint{font-size:11.5px;color:var(--t3);line-height:1.65;margin:0 0 12px}
  .ovsec{font-size:11px;color:var(--t4);letter-spacing:.4px;margin:14px 0 8px}
  .ovsec:first-of-type{margin-top:0}
  .sugrow{display:flex;flex-wrap:wrap;gap:8px}
  .sug{height:30px;padding:0 12px;border-radius:var(--r-round);border:1px solid var(--bd2);background:#fff;font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .sug:hover{border-color:var(--brand);color:var(--brand-6)}
  .sug i{font-style:normal;color:var(--brand);font-weight:700}
  .ftags{display:flex;flex-wrap:wrap;gap:8px}
  .ftag{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 11px;border-radius:var(--r-round);background:var(--brand-1);border:1px solid #b9e8c9;font-size:12px;color:var(--brand-6)}
  .ftag b{font-weight:600;cursor:pointer}
  .ftag .x{width:18px;height:18px;border-radius:var(--r-round);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--brand-6)}
  .ftag .x:hover{background:#cbeed8}
  .ftag .src{font-size:9.5px;line-height:1;padding:3px 5px;border-radius:var(--r-s);background:#fff;border:1px solid #b9e8c9;color:var(--brand-6)}
  .ovadd{display:flex;gap:8px;margin-top:12px}
  .ovadd .field{max-width:220px}
  /* ── 待办配置：状态流转 ─────────────── */
  /* ── 资料：来源行 ─────────────── */
  .srcrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  .srcrow .ic{width:32px;height:32px;border-radius:8px;background:#eef7f1;color:var(--brand-6);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .srcrow .meta{flex:1;min-width:0}
  .srcrow .meta b{font-size:13px;display:block}
  .srcrow .meta small{font-size:11px;color:var(--t3)}
  .srcrow .rm{font-size:12px;color:var(--t3);border:1px solid var(--line);border-radius:var(--r-round);padding:4px 11px;background:#fff;flex:none}
  .srcrow .rm:hover{color:#d4380d;border-color:#ffd5bf;background:#fff4ef}
  /* ── 成员：头像 / 角色选择 / 主人锁定 ─────────────── */
  .mavatar{width:32px;height:32px;border-radius:var(--r-round);background:#eef2f7;color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
  .srcrow .rsel{height:28px;padding:0 10px;border-radius:var(--r-round);border:1px solid var(--line);background:#fff;font-size:12px;color:var(--t2);flex:none}
  .srcrow .rsel:hover{border-color:var(--brand);color:var(--brand-6)}
  .rlock{font-size:12px;color:var(--t4);border:1px solid var(--line);border-radius:var(--r-round);padding:4px 11px;background:#fafafa;flex:none}
  /* ── v1.15 动态时间线 ── */
  .tlfilters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
  .tlchip{font-size:12px;color:var(--t2);background:#fff;border:1px solid var(--bd);border-radius:var(--r-round);padding:4px 11px;cursor:pointer}
  .tlchip.on{color:var(--brand-6);background:var(--brand-1);border-color:#b9e8c9;font-weight:600}
  .tlday{font-size:11.5px;color:var(--t3);font-weight:600;margin:18px 0 8px;letter-spacing:.3px}
  .tlline{position:relative;padding-left:26px}
  .tlline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--bd)}
  .tlitem{position:relative;padding:0 0 16px}
  .tlitem .tdot{position:absolute;left:-23px;top:4px;width:15px;height:15px;border-radius:var(--r-round);background:#fff;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--t3)}
  .tlitem.sub .tdot{border-color:#b9e8c9;background:var(--brand-1);color:var(--brand-6)}
  .tlitem.act .tdot{border-color:#c9ddfb;background:var(--info-1);color:var(--info)}
  .tlitem .tmain{font-size:13px;color:var(--t1);line-height:1.7}
  .tlitem .tmain b{font-weight:600}
  .tlitem .tmeta{font-size:11.5px;color:var(--t3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tlitem .tmeta .src{border:1px solid var(--bd);border-radius:var(--r-round);padding:1px 7px;background:#fafafa;color:var(--t2);cursor:pointer}
  .tlitem .tmeta .src:hover{border-color:#b9e8c9;background:var(--brand-1);color:var(--brand-6)}
  .tlval{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--g1);border-radius:4px;padding:1px 6px}
  .tlfrom{color:var(--t4);text-decoration:line-through}
  .tlnote{margin-top:22px;padding:11px 13px;border:1px dashed var(--bd2);border-radius:var(--r-l);font-size:11.5px;color:var(--t2);line-height:1.75;background:#fcfcfc}
  .ovadd .rsel{height:34px;padding:0 12px;border-radius:var(--r-m);border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--t2);flex:none}
  /* 预览卡 */
  .pvcard{border:1px solid var(--bd);border-radius:var(--r-l);background:#fff;overflow:hidden}
  .pvcard .pvhead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--bd);background:#fbfcfb;font-size:12px;font-weight:600}
  .pvcard .pvhead .dot{width:8px;height:8px;border-radius:var(--r-round);background:var(--brand)}
  .pvcard .pvhead small{font-weight:400;color:var(--t3);margin-left:auto;font-size:10.5px}
  .pvrow{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid var(--bd);font-size:12px;line-height:1.6}
  .pvrow:last-child{border-bottom:none}
  .pvrow .k{flex:0 0 84px;color:var(--t3)}
  .pvrow .v{color:var(--t1)}
  .pvfoot{padding:8px 13px;font-size:10.5px;color:var(--t4);background:#fbfcfb}

  /* ── 对照页 ─────────────────────────────────────────── */
  .diff h2{font-size:16px;font-weight:600;margin:0 0 6px}
  .diff .lead{font-size:13px;color:var(--t3);line-height:1.75;margin:0 0 20px;max-width:800px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
  .kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);padding:15px 16px;box-shadow:var(--sh1)}
  .kpi .kn{font-size:12px;color:var(--t3);margin-bottom:9px}
  .kpi .kv{display:flex;align-items:baseline;gap:8px}
  .kpi .before{font-size:19px;font-weight:700;color:var(--t4);text-decoration:line-through}
  .kpi .arrow{color:var(--t4);font-size:13px}
  .kpi .after{font-size:24px;font-weight:700;color:var(--brand)}
  .kpi .ku{font-size:11.5px;color:var(--t3);margin-left:2px}
  .dtable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--sh1);margin-bottom:26px;font-size:12.5px}
  .dtable th{background:#fbfcfb;text-align:left;padding:11px 14px;font-size:12px;font-weight:600;color:var(--t2);border-bottom:1px solid var(--bd);white-space:nowrap}
  .dtable td{padding:11px 14px;border-bottom:1px solid var(--bd);vertical-align:top;line-height:1.65}
  .dtable tr:last-child td{border-bottom:none}
  .dtable td.b{color:var(--t3)}
  .dtable td.a{color:var(--t1);font-weight:500}
  .pill{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:var(--r);font-size:10.5px;font-weight:600;white-space:nowrap}
  .pill.keep{background:var(--brand-1);color:var(--brand-6)}
  .pill.drop{background:var(--error-1);color:#b03442}
  .pill.demote{background:var(--warn-1);color:#b25f14}
  .pill.move{background:var(--info-1);color:#2258a8}
  .prod{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}
  .pcol h3{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:7px}
  .pcol.old h3{color:var(--error)}
  .pcol.new h3{color:var(--brand-6)}
  .pbox{border:1px solid var(--bd);border-radius:var(--r-l);padding:12px 13px;background:#fff;font-size:12px;line-height:1.75;color:var(--t2);min-height:96px}
  .pbox.old{background:#fdfafa;border-color:#f2d9dc}
  .pbox.new{background:#fafdfb;border-color:#c9ebd6}
  .pbox code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--g1);padding:1px 4px;border-radius:var(--r-s);color:var(--t1)}
  .pbox ul{margin:0;padding-left:17px}
  .pbox li{margin-bottom:4px}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);background:rgba(0,0,0,.86);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:var(--r-l);opacity:0;pointer-events:none;transition:all .22s;z-index:99}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .anno{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:var(--r);background:#fff4d6;color:#8a6d12;font-size:10.5px;font-weight:600;border:1px solid #f0dfa8;white-space:nowrap}
  .annoline{border-left:3px solid var(--brand);background:#fafdfb;padding:8px 12px;border-radius:0 var(--r-l) var(--r-l) 0;font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:14px}
  .annoline.warn{border-left-color:var(--warn);background:#fffaf4}
</style>
</head>

<div class="app">
  <aside class="rail">

/* ═══════════════════════════════════════════════════════

const SCENES = [

  { key:'create',   n:2, label:'创建服务 · 整页表单',       path:'/platform/service/new' },
  { key:'space',    n:3, label:'服务空间 · 优化后服务头',   path:'/platform/service/:serviceId/sessions/:sessionId' },
  { key:'artifacts',n:4, label:'服务空间 · 产物浮层',       path:'/platform/service/:serviceId  ▤ 产物 3' },
  { key:'reminders',n:5, label:'服务空间 · 待办浮层',       path:'/platform/service/:serviceId  ☑ 待办 3' },
  { key:'overview', n:6, label:'⋯ → 服务概览 / 服务对象',   path:'/platform/service/:serviceId/overview' },
  { key:'activity', n:7, label:'⋯ → 动态 · 时间线',        path:'/platform/service/:serviceId/activity' },
  { key:'settings', n:8, label:'服务设置 · 整页 4 分区',    path:'/platform/service/:serviceId/settings/fields' },
  { key:'diff',     n:9, label:'改造对照 · 问题与概念收敛', path:'—' }
];

const state = {
  scene: (location.hash || '').replace('#', '') || 'list',
  lmode: 'data',
  panel: '',
  moreOpen: false,
  sel: 'a2',
  collabOpen: '',
  emptyChat: false,
  newChat: false, // v1.14 新会话空态（对话区切换，不新开页面）；v1.16 起入口从服务头 ＋ 改为左侧服务行悬停 ＋
  sec: 'fields'   // 设置场景内的分区：basic / fields / sources / members（v1.13：「专家」并入基本信息，共 4 个分区）
};

const RENDER = {
  list:      () => layout(listView(state.lmode)),
  create:    () => layout(createView()),
  space:     () => layout(spaceView(state.panel, state.moreOpen, state.sel, state.collabOpen, state.emptyChat), true),
  artifacts: () => layout(spaceView('artifacts', false, state.sel, '', false), true),
  reminders: () => layout(spaceView('reminders', false, '', state.collabOpen, false), true),
  overview:  () => layout(overviewView(), true),
  activity:  () => layout(activityView(), true),
  subjects:  () => layout(subjectsView(), true),
  settings:  () => layout(settingsView(), true),
  diff:      () => layout(diffView())
};
function layout(inner, bleed){ return `<div class="canvas ${bleed ? 'bleed' : ''}">${inner}</div>`; }

function render(){
  const sc = SCENES.find(s => s.key === state.scene) || SCENES[0];
  state.scene = sc.key;
  $('#barTitle').textContent = sc.label;
  $('#barPath').textContent = sc.path;
  $('#root').innerHTML = RENDER[state.scene] ? RENDER[state.scene]() : '';
  $('#rail').innerHTML = SCENES.map(s => `
    <button class="rail-btn ${state.scene === s.key ? 'on' : ''}" data-scene="${s.key}">
      <span class="idx">${s.n}</span><span class="lb">${s.label}</span>
    </button>`).join('');

  const br = $('#barRight');
  if (state.scene === 'space') {
    br.innerHTML = `
      <button class="chip ${state.emptyChat ? '' : 'on'}" data-empty="0">有会话</button>
      <button class="chip ${state.emptyChat ? 'on' : ''}" data-empty="1">空态</button>
      <button class="chip ${state.newChat ? 'on' : ''}" data-newchat>新会话（悬停服务行点 ＋）</button>
      <button class="chip ${state.moreOpen ? 'on' : ''}" data-more>${state.moreOpen ? '收起 ⋯ 菜单' : '展开 ⋯ 菜单'}</button>`;
  } else br.innerHTML = '';
}

/* ═══════════════════════════════════════════════════════
   事件
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const hit = s => e.target.closest(s);

  const noop = hit('[data-noop]');
  if (noop && !hit('[data-scene]') && !hit('[data-panel]') && !hit('[data-art]') && !hit('[data-more]') && !hit('[data-lmode]') && !hit('[data-empty]') && !hit('[data-collab]') && !hit('[data-newchat]')) {
    toast('这是原型，仅演示布局与信息层级');
    return;
  }

  const nc = hit('[data-newchat]');
  if (nc) { state.newChat = true; state.emptyChat = false; state.panel = ''; state.moreOpen = false; if (nc.dataset.svc) { state.scene = 'space'; } render(); return; }

  const sc = hit('[data-scene]');
  if (sc) {
    const k = sc.dataset.scene;
    state.scene = k;
    if (k === 'space') { state.panel = ''; state.moreOpen = false; state.emptyChat = false; state.newChat = false; }
    history.replaceState(null, '', '#' + k);
    render();
    $('.scroll').scrollTop = 0;
    return;
  }

  const sec = hit('[data-sec]');
  if (sec) { state.sec = sec.dataset.sec; render(); return; }

  const lm = hit('[data-lmode]');
  if (lm) { state.lmode = lm.dataset.lmode; render(); return; }

  const em = hit('[data-empty]');
  if (em) { state.emptyChat = em.dataset.empty === '1'; state.newChat = false; render(); return; }

  const more = hit('[data-more]');
  if (more) { state.moreOpen = !state.moreOpen; render(); return; }

  const pl = hit('[data-panel]');
  if (pl) {
    const k = pl.dataset.panel;
    state.panel = (state.panel === k) ? '' : k;
    state.moreOpen = false;
    render();
    return;
  }

  const art = hit('[data-art]');
  if (art) { state.sel = art.dataset.art; render(); return; }

  const cb = hit('[data-collab]');
  if (cb) { state.collabOpen = state.collabOpen === cb.dataset.collab ? '' : cb.dataset.collab; render(); return; }
});

render();
window.addEventListener('hashchange', () => {
  state.scene = (location.hash || '').replace('#', '') || 'list';
  state.panel = ''; state.moreOpen = false;
  render();
});
</script>
