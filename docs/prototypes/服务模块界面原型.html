<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="H3OfEGFWB5abu7do4XM2GK">
<head data-page-node-id="DPxnxq6JVBTtDxdq7fLYjP">
<meta charset="UTF-8" data-page-node-id="7DRKW0nX4YAYmcEncYG4bV" />
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="TBeHp68AS8RhVnIk2k0bdi" />
<title>服务模块界面原型 · 睿乐大脑</title>
<style>
  :root{
    --brand:#07c05f; --brand-hover:#06b04d; --brand-dark:#038626; --brand-light:#e9f8ec;
    --text-1:rgba(0,0,0,.9); --text-2:rgba(0,0,0,.6); --text-3:rgba(0,0,0,.4);
    --page-bg:#f5f5f5; --card:#fff; --sidebar:#f9f9f9;
    --border:#e7e7e7; --border-strong:#dcdcdc; --border-hover:#c5c5c5;
    --warn-bg:#fef3e6; --warn-text:#ba431b; --danger:#e34d59;
    --r:6px; --r-lg:12px;
    /* 侧栏栅格：直接取自 frontend/src/components/menu.vue 的 --sidebar-inset-x（14px）
       与 TDesign 的 --td-bg-color-container-hover（light 下 = #f3f3f3，
       注意它与 --td-bg-color-secondarycontainer 同值——这就是知识库的「当前项」
       不能靠底色区分、必须靠右侧圆点的原因）。 */
    --inset-x:14px; --nav-hover:#f3f3f3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page-bg); color:var(--text-1); font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;}

  .app{display:flex; min-height:100vh;}

  /* 侧栏容器与顶部 logo 行：对齐 frontend menu.vue 的 .aside_box / .logo_row（宽 260、logo 行高 50） */
  /* 侧栏自身滚动（D21）：会话挂到侧栏之后，一个服务展开、再点「还有 N 个」可能列出几十行；
     不独立滚动就会把整页撑长、侧栏跟着页面一起滚走。真实产品里侧栏是固定的——这里对齐它。 */
  .sidebar{width:260px; flex:none; background:var(--sidebar); border-right:1px solid var(--border); padding:8px 6px 6px;
    position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:8px; height:50px; flex-shrink:0; padding:0 10px 0 var(--inset-x);}
  .brand-logo{width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:500;}
  .brand-name{font-size:14px;font-weight:500;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  /* ── 一级项「服务」：规格照抄 frontend/src/components/KnowledgeBaseMenu.vue 的 .kb-menu-header
        （28px 高 / 13px / 字重 500 / 次要色 / 8px 圆角 / hover 灰底）。
        注意它**没有「激活底色」**：知识库标题本身不表示「当前在哪个知识库」，
        当前项由下面二级列表里的圆点表示。 */
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;
    padding:0 8px 0 var(--inset-x);border-radius:8px;cursor:pointer;border:none;background:none;
    text-align:left;width:100%;transition:background-color .18s ease;}
  .nav-item:hover{background:var(--nav-hover);}
  .nav-title{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    color:var(--text-2);font-size:13px;font-weight:500;line-height:18px;}
  /* 右侧操作组：计数常态可见；折叠箭头照 .kb-menu-actions 的规矩——hover 才出现 */
  .nav-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .nav-count{font-size:12px;line-height:18px;color:var(--text-3);}
  .nav-toggle{width:24px;height:24px;border-radius:6px;padding:0;display:inline-flex;align-items:center;
    justify-content:center;background:transparent;color:var(--text-2);cursor:pointer;flex-shrink:0;
    opacity:0;pointer-events:none;transition:opacity .18s ease,background-color .18s ease,color .18s ease;}
  .nav-item:hover .nav-toggle,.nav-item:focus-within .nav-toggle{opacity:1;pointer-events:auto;}
  .nav-toggle:hover{background:var(--nav-hover);color:var(--text-1);}
  .nav-toggle svg{width:16px;height:16px;transition:transform .18s ease;}
  .nav-toggle.collapsed svg{transform:rotate(-90deg);}
  /* 侧栏二级菜单（D20）：服务列表直接挂在「服务」下面——
     少一次「先进列表、再点一次」的中转，但列表页本身仍在，由一级项进入。
     **整组规格以 KnowledgeBaseMenu.vue 为唯一基准**（一级 .kb-menu-header / 二级 .kb-menu-item），
     所以也照它带一个折叠控件（上一版写的「不做折叠控件，折叠没有信息量」作废：
     知识库就是这么做的，两处形态必须一致，否则同一根侧栏里会出现两种折叠范式）。 */
  /* ── 二级项：规格照抄 .kb-menu-item，**只少一样东西：左侧的 20px 模板图形**。
        一级项「服务」本身就不带图标，二级再带一个反而让"服务列表"看起来像另一套菜单；
        去掉之后整根侧栏彻底无图标，层级改由**等距缩进**表达（每级 20px）：
        一级文字 14px → 二级文字 34px → 三级文字 54px。
        （v1.15：v1.13 照抄知识库的 20px 模板图形已按老师意见删除，见界面说明 §2.3.1 的有意偏离。）
        「当前项」不是绿字，而是「与 hover 同色的底 + 右侧 12px 绿点」
        （light 下 hover 与 active 底色同值，靠底色区分不出来，所以必须有点）。 */
  .nav-sub{display:flex;flex-direction:column;gap:2px;padding:1px 0 4px;}
  .nav-sub[hidden]{display:none;}
  .nav-sub-item{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;
    padding:0 8px 0 calc(var(--inset-x) + 20px);border:none;border-radius:8px;background:transparent;
    text-align:left;cursor:pointer;transition:background-color .18s ease;}
  .nav-sub-item:hover{background:var(--nav-hover);}
  .nav-sub-item.on{background:var(--nav-hover);}
  .nav-sub-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--text-1);font-size:12px;font-weight:500;line-height:18px;}
  .nav-sub-trail{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;flex-shrink:0;}
  .nav-sub-dot{width:12px;height:12px;border-radius:50%;background:var(--brand);}
  /* 每个服务右侧的折叠箭头（D21）：照一级项的规矩 hover 才现。
     占位固定 20px、只切 opacity——否则鼠标一划过来箭头挤进来，文字会横向抖一下。 */
  .nav-sub-caret{width:20px;height:20px;border-radius:6px;flex:none;display:inline-flex;
    align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .18s ease,background-color .18s ease;}
  .nav-sub-item:hover .nav-sub-caret,.nav-sub-item:focus-within .nav-sub-caret{opacity:1;pointer-events:auto;}
  .nav-sub-caret:hover{background:#e8e8e8;color:var(--text-1);}
  .nav-sub-caret svg{width:14px;height:14px;transition:transform .18s ease;}
  .nav-sub-caret.collapsed svg{transform:rotate(-90deg);}

  /* ── 三级：某个服务下的会话（D21）。
        上位变化：会话原先只活在服务空间内部的会话栏里，现在挂到侧栏的服务名下方——
        **侧栏取代了那条会话栏**，服务空间由三块（会话栏 / 对话区 / 右侧面板）变成两块。
        规格：**比二级文字再缩进一级**——二级文字 34px、三级文字 54px，步长与一级→二级同为 20px。
        v1.14 曾让三级与二级文字**左对齐**（同为 54px），那是在**二级带图标**的前提下的结论
        （当时二级文字被 20px 图标推到 54px，三级写 46px 反而"比二级更靠左"）。
        v1.15 图标删掉、二级文字回到 34px 之后**那个前提就不存在了**，
        三级与二级改为等距缩进；层级由「缩进 + 颜色（次要色） + 所在分组」三者共同表达。
        字号仍取 12px（再小一档在这个字号体系里已经读不清），颜色降到次要色。
        「当前会话」不给右侧圆点：那个位置要留给 hover 才现的 ⋯，
        改用「同色底 + 主色文字 + 字重 500」三件一起表达（底与 hover 同值时靠后两者区分）。 */
  .nav-sess{display:flex;flex-direction:column;gap:2px;padding:1px 0 3px;}
  .nav-sess[hidden]{display:none;}
  .nav-sess-item{display:flex;align-items:center;gap:8px;width:100%;min-height:26px;
    padding:0 8px 0 54px;border:none;border-radius:8px;background:transparent;text-align:left;
    cursor:pointer;transition:background-color .18s ease;}
  .nav-sess-item:hover{background:var(--nav-hover);}
  .nav-sess-item.on{background:var(--nav-hover);}
  .nav-sess-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--text-2);font-size:12px;line-height:18px;}
  .nav-sess-item.on .nav-sess-name{color:var(--text-1);font-weight:500;}
  /* 置顶标记：**放右侧且永远占位**——放标题左边会让置顶行与非置顶行的文字起点差出 17px，
     一列会话看下来文字会左右跳；固定占位也让 hover 时冒出来的 ⋯ 不会把有置顶的行推来推去。 */
  .nav-sess-pin{flex:none;width:10px;text-align:center;font-size:8px;line-height:1;color:var(--brand);}
  .nav-sess-more{width:18px;height:18px;flex:none;padding:0;border:none;background:none;border-radius:5px;
    color:var(--text-3);font-size:13px;line-height:1;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .18s ease,background-color .18s ease;}
  .nav-sess-item:hover .nav-sess-more,.nav-sess-item:focus-within .nav-sess-more{opacity:1;pointer-events:auto;}
  .nav-sess-more:hover{background:#e8e8e8;color:var(--text-1);}
  .nav-sess-rename{flex:1;min-width:0;font-size:12px;font-family:inherit;color:var(--text-1);
    border:1px solid var(--brand);border-radius:6px;padding:1px 5px;outline:none;}
  /* 会话多于上限时的一行「还有 N 个」——是入口，不是说明文字 */
  .nav-sess-all{width:100%;border:none;background:none;text-align:left;cursor:pointer;font-family:inherit;
    padding:4px 8px 4px 54px;border-radius:8px;font-size:12px;line-height:18px;color:var(--text-3);}
  .nav-sess-all:hover{background:var(--nav-hover);color:var(--text-1);}
  .nav-sess-empty{width:100%;border:none;background:none;text-align:left;cursor:pointer;font-family:inherit;
    padding:4px 8px 5px 54px;border-radius:8px;font-size:12px;line-height:18px;color:var(--text-3);}
  .nav-sess-empty:hover{background:var(--nav-hover);color:var(--text-1);}
  .nav-sub-empty{margin:0;padding:8px 14px 6px var(--inset-x);font-size:12px;line-height:18px;color:var(--text-3);}
  /* 侧栏会话行的 ⋯ 菜单（重命名 / 置顶 / 删除）：视口定位——
     侧栏是滚动容器，相对定位的菜单会被 overflow 裁掉 */
  .nav-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:var(--r);
    box-shadow:0 4px 16px rgba(0,0,0,.1);padding:4px;min-width:132px;z-index:60;}

  .main{flex:1;min-width:0;padding:28px 32px 60px;}

  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .page-title{margin:0;font-size:20px;font-weight:500;letter-spacing:.2px;}
  .page-sub{margin:4px 0 0;font-size:13px;color:var(--text-2);}
  .head-art{flex:none;}

  .btn{padding:7px 14px;border-radius:var(--r);border:1px solid var(--border-strong);background:#fff;font-size:13px;cursor:pointer;color:var(--text-1);transition:border-color .15s,background .15s;}
  .btn:hover{border-color:var(--border-hover);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);}
  .btn-primary:disabled{background:#8ce0af;border-color:#8ce0af;cursor:not-allowed;}
  .btn-text{background:none;border:none;color:var(--brand);cursor:pointer;font-size:13px;padding:0;}
  .btn-text:hover{color:var(--brand-dark);text-decoration:underline;}

  .create-row{margin-bottom:24px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .section-title{font-size:14px;font-weight:500;}
  .section-tools{display:flex;align-items:center;gap:8px;}
  .search{display:flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:var(--r);padding:5px 10px;width:170px;background:#fff;}
  .search input{border:none;outline:none;font-size:13px;width:100%;background:none;color:var(--text-1);}
  .search input::placeholder{color:var(--text-3);}
  .sort-select{border:1px solid var(--border-strong);border-radius:var(--r);padding:5px 8px;font-size:13px;background:#fff;color:var(--text-2);outline:none;cursor:pointer;}

  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
  @media(max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media(max-width:880px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));}}

  .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;cursor:pointer;transition:border-color .15s,box-shadow .2s;}
  .card:hover{border-color:var(--border-hover);}
  .card.draft{border-style:dashed;}
  .card.flash{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light);}
  .card-row1{display:flex;align-items:center;gap:7px;}
  .card-icon{width:24px;height:24px;border-radius:7px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;flex:none;color:var(--brand-dark);}
  /* 同一模板用同一图形（界面说明 §3.4）：图形取自模板，不是每个服务随机一个 */
  .card-icon svg{width:14px;height:14px;}
  .card-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-more{border:none;background:none;color:var(--text-3);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;}
  .card-more:hover{color:var(--text-1);background:#f0f0f0;}
  .card-row2{display:flex;align-items:center;gap:5px;margin-top:8px;}
  .tag{font-size:11px;background:var(--brand-light);color:var(--brand-dark);padding:1px 5px;border-radius:3px;white-space:nowrap;}
  .tag-custom{background:#f3f3f3;color:var(--text-3);}
  .tag-role{font-size:11px;background:#f3f3f3;color:var(--text-2);padding:1px 5px;border-radius:3px;white-space:nowrap;}
  .card-meta{font-size:11px;color:var(--text-3);margin-top:7px;}
  /* 服务描述（D18）：把"这个服务管什么"摊在卡片上，省得靠名字猜。
     最多两行——描述是给人快速判断的，不是给人读的。 */
  .card-desc{font-size:12px;color:var(--text-2);line-height:1.6;margin-top:7px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta .draft-mark{color:var(--warn-text);}

  .menu{position:absolute;top:34px;right:6px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.1);padding:4px;min-width:152px;z-index:30;}
  .menu-item{display:block;width:100%;text-align:left;padding:7px 10px;border:none;background:none;font-size:13px;cursor:pointer;border-radius:4px;color:var(--text-1);}
  .menu-item:hover{background:#f3f3f3;}
  .menu-item.danger{color:var(--danger);}
  .menu-item:disabled{color:var(--text-3);cursor:default;}
  .menu-item:disabled:hover{background:none;}
  .menu-sep{height:1px;background:var(--border);margin:4px 6px;}

  .tpl-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;cursor:pointer;transition:border-color .15s;}
  .tpl-card:hover{border-color:var(--brand);}
  /* 空态是唯一有空间展示完整模板价值的时刻：卡片放大、内边距加到 12px（界面说明 §4.1） */
  .tpl-card.big{padding:12px 13px;}
  .tpl-card.big .tpl-icon{width:24px;height:24px;border-radius:7px;}
  .tpl-card.big .tpl-icon svg{width:14px;height:14px;}
  .tpl-card.big .tpl-name{font-size:13px;}
  .tpl-card.big .tpl-desc{font-size:12px;}
  .tpl-row1{display:flex;align-items:center;gap:7px;}
  .tpl-icon{width:20px;height:20px;border-radius:6px;background:var(--brand-light);flex:none;display:flex;align-items:center;justify-content:center;color:var(--brand-dark);}
  .tpl-icon svg{width:12px;height:12px;}
  .tpl-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tpl-desc{font-size:11px;color:var(--text-3);margin:6px 0 0;line-height:1.5;}
  .tpl-prev{font-size:11px;color:var(--text-3);margin:4px 0 0;}

  .empty-card{border:1px dashed var(--border-hover);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:22px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;background:#fcfcfc;}
  .empty-title{font-size:14px;font-weight:500;margin:0;}
  .empty-text{font-size:13px;color:var(--text-2);margin:6px 0 0;line-height:1.7;}

  .no-result{padding:32px 0;text-align:center;font-size:13px;color:var(--text-2);}

  /* 创建表单（D11：单页表单，无步骤条） */
  .create{max-width:1000px;}
  @media(max-width:880px){
    .create{max-width:none;}
    .expert-card{flex-wrap:wrap;}
  }

  .panel{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field-label{display:flex;align-items:center;font-size:13px;color:var(--text-2);margin-bottom:6px;}
  .field-label .req{color:var(--danger);margin-left:2px;}
  .input,select.input,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--r);font-size:13px;background:#fff;color:var(--text-1);outline:none;transition:border-color .15s,box-shadow .15s;}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light);}
  textarea.input{resize:vertical;line-height:1.6;}
  .input.err{border-color:var(--danger);}
  .err-msg{font-size:12px;color:var(--danger);margin-top:6px;}
  .field-hint{font-size:12px;color:var(--text-3);margin-top:6px;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--brand-light);color:var(--brand-dark);padding:3px 8px;border-radius:4px;}
  .chip-x{border:none;background:none;color:var(--brand-dark);cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.7;}
  .chip-x:hover{opacity:1;}
  /* 专家 / 知识库 / 技能三处共用的选择浮层（D23）。
     类名由 .tpl-picker / .tpl-opt 改来——创建表单里的模板入口已删除（模板入口只剩列表页
     「从模板创建」），这个浮层不再服务模板，继续叫 tpl-* 会让评审以为模板还在表单里。 */
  .pick-panel{border:1px solid var(--border-strong);border-radius:var(--r);padding:10px 12px;margin-bottom:16px;background:#fff;}
  .pick-panel-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:8px;}
  .pick-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:var(--r);font-size:13px;cursor:pointer;color:var(--text-1);}
  .pick-opt:hover{background:#f3f3f3;}
  .pick-opt.on{background:var(--brand-light);color:var(--brand-dark);font-weight:500;}
  .pick-opt-main{display:flex;align-items:center;gap:8px;min-width:0;}
  .pick-opt span{font-size:12px;color:var(--text-3);}
  .pick-opt.on span{color:var(--brand-dark);opacity:.8;}
  /* 浮层底部的口径说明：为什么没有「全选」、留空代表什么（D23——两处"空"都是"不启用"） */
  .pick-note{font-size:11px;color:var(--text-3);line-height:1.6;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--border);}

  .notice{display:flex;align-items:flex-start;gap:8px;background:var(--warn-bg);border-radius:var(--r);padding:9px 11px;}
  .notice-text{font-size:12px;color:var(--warn-text);line-height:1.6;}
  .notice-line{font-size:12px;color:var(--text-3);margin-top:8px;}

  .form-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;}
  .form-hint{font-size:12px;color:var(--text-3);}
  .form-actions{display:flex;align-items:center;gap:8px;}

  /* 字数计数（界面说明 §5.3：指令框右下角实时显示 0 / 4000） */
  .count{font-size:11px;color:var(--text-3);text-align:right;margin-top:5px;}
  .count.over{color:var(--danger);}

  .banner{display:flex;align-items:center;gap:10px;background:var(--brand-light);border:1px solid #c9edd6;border-radius:var(--r);padding:10px 12px;margin-bottom:18px;font-size:13px;color:var(--brand-dark);}
  .banner-x{margin-left:auto;border:none;background:none;cursor:pointer;color:var(--brand-dark);font-size:15px;line-height:1;padding:0 2px;opacity:.6;}
  .banner-x:hover{opacity:1;}

  .demo-bar{position:fixed;right:18px;bottom:18px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border-strong);border-radius:999px;padding:8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.09);font-size:12px;color:var(--text-2);z-index:100;}
  .demo-bar strong{color:var(--text-1);font-weight:500;}
  .toggle{display:flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;}
  .toggle button{border:none;background:none;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--text-2);}
  .toggle button.on{background:var(--brand);color:#fff;font-weight:500;}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;font-size:13px;padding:9px 18px;border-radius:var(--r);opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;}
  .toast.on{opacity:1;}
  [hidden]{display:none !important;}
  /* 专家卡片与折叠区（创建表单，D11） */
  .expert-list{display:flex;flex-direction:column;gap:8px;}
  .expert-card{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;background:#fff;}
  .expert-ic{width:26px;height:26px;flex:none;border-radius:7px;background:var(--brand-light);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  .expert-main{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
  .expert-name{font-size:13px;color:var(--text-1);}
  .expert-meta{font-size:11px;color:var(--text-3);}

  /* ---------- 服务空间（D15：会话工作台 / D21：会话栏上移到应用级侧栏） ---------- */
  /* 形态取自 WorkBuddy「项目」：**会话列表挂在侧栏的服务名下方**（D21），
     中间是当前会话的对话区，产物卡片出现在对话里，点开在右侧面板预览。
     会话不是列表页里的一行，而是**可进入的对话**——产物与其他信息都从对话中产出并更新。 */
  .space-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;}
  .back-btn{border:none;background:none;font-size:13px;color:var(--text-2);cursor:pointer;padding:4px 6px;border-radius:var(--r);}
  .back-btn:hover{background:#f0f0f0;color:var(--text-1);}
  .space-name{font-size:16px;font-weight:600;color:var(--text-1);}
  .space-tpl{font-size:11px;padding:2px 8px;border-radius:999px;background:#f2f2f2;color:var(--text-2);}
  .space-head-r{margin-left:auto;display:flex;align-items:center;gap:8px;}

  /* D18：服务空间内部**不再有服务级导航栏**（D16 的图标栏、再早的横向 tab 条都已删）。
     导航栏的存在本身就在问用户"你要去哪个页面"，可进了服务之后用户只有一个意图——继续干活。
     页面级入口按"离工作有多近"分层：
       ① 服务头右侧「产物 / 事项」—— 天天要点，带计数、放在手边（点击在右侧面板查看）；
       ② 服务头 ⋯ 菜单 —— 服务本身的设置（改名 / 改描述 / 分享），配一次就忘。
     概览、服务对象、运行记录、服务设置收进 ⋯ 的「更多 ›」，不再各占一个位置。
     ⇒ D21 之后服务空间只剩**两块**：对话区 / 右侧面板。
       原来那条 236px 的会话栏由**应用级侧栏**取代（会话挂到服务名下方，见 D21），
       它底部的「产物 / 事项」入口随之提到服务头右侧，与「新建会话 ⊕」并排。 */

  /* 服务头右侧的两个圆钮（对齐 WorkBuddy 项目头）：⋯ 更多操作、⊕ 新建会话 */
  .icon-btn{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;
    color:var(--text-2);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;font-family:inherit;padding:0;}
  .icon-btn:hover{border-color:var(--brand);color:var(--brand-dark);background:var(--brand-light);}
  .icon-btn.add{border-color:var(--brand);color:var(--brand-dark);font-size:15px;font-weight:500;}

  /* 右侧面板内的通用排版（面板容器样式见下 .art-panel） */
  .pane-sub{font-size:12px;color:var(--text-3);margin:0 0 16px;line-height:1.7;}
  .pane-empty{font-size:13px;color:var(--text-3);line-height:1.9;}
  .set-row{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--border);
    border-radius:var(--r);margin-bottom:8px;cursor:pointer;}
  .set-row:hover{border-color:var(--brand);background:var(--brand-light);}
  .set-name{flex:none;width:76px;font-size:13px;font-weight:500;color:var(--text-1);}
  .set-desc{flex:1;min-width:0;font-size:12px;color:var(--text-3);line-height:1.6;}

  /* 两块工作台（D21：会话栏撤掉，只剩对话区 + 浮层面板；产物面板不参与 flex 挤压）
     高度按视口算，并给底部演示条留出余量，避免整页出现无意义滚动 */
  .workbench{position:relative;display:flex;gap:14px;align-items:stretch;height:calc(100vh - 200px);min-height:400px;}

  /* 服务头右侧的常驻入口（D21）：产物 / 事项带计数。
     它们原先长在会话栏底部；会话栏上移到应用级侧栏之后，这里是它们的新家——
     服务头本来就是"服务级"信息行，与 ⋯ 的分工也最清楚（⋯ 管服务本身，这两个管服务里攒下的东西）。
     带计数是必要的：这两个入口没有页面标题承载"有多少"，数字只能挂在入口上。 */
  .head-tools{display:flex;align-items:center;gap:6px;}
  .head-tool{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
    border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--text-2);
    font-size:12px;font-family:inherit;cursor:pointer;
    transition:border-color .18s ease,background-color .18s ease,color .18s ease;}
  .head-tool:hover{border-color:var(--brand);background:var(--brand-light);color:var(--brand-dark);}
  .head-tool.on{border-color:var(--brand);background:var(--brand-light);color:var(--brand-dark);font-weight:500;}
  .head-tool svg{width:14px;height:14px;flex:none;}
  .head-tool .tool-count{font-size:11px;color:var(--text-3);}
  .head-tool.on .tool-count{color:var(--brand-dark);}

  /* 中：对话区 —— 「从会话中更新产物以及其他的信息」 */
  .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;overflow:hidden;}
  .chat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);}
  .chat-title{font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-meta{flex:none;font-size:11px;color:var(--text-3);}
  /* 对话滚动区（右侧面板的定位基准）。
     面板必须贴着"消息区"而不是整个对话列——贴着整列会把输入框右端的
     专家选择器与发送按钮一起盖住，面板一开就没法发消息了（真浏览器才测得出）。 */
  .chat-body{position:relative;flex:1;min-height:0;display:flex;}
  .chat-scroll{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px;}
  .msg-user{align-self:flex-end;max-width:78%;background:var(--brand-light);color:var(--text-1);border-radius:var(--r-lg);padding:9px 13px;font-size:13px;line-height:1.65;}
  .msg-bot{display:flex;flex-direction:column;gap:9px;}
  .msg-bot-head{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);}
  .bot-avatar{width:20px;height:20px;flex:none;border-radius:6px;background:var(--brand-light);color:var(--brand-dark);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .bot-name{font-size:12px;color:var(--text-1);font-weight:500;}
  .bot-state{font-size:11px;padding:1px 7px;border-radius:999px;background:#f2f2f2;color:var(--text-2);}
  .bot-state.ok{background:var(--brand-light);color:var(--brand-dark);}
  .bot-state.doing{background:var(--warn-bg);color:var(--warn-text);}

  /* 执行过程：默认折叠，不把技术日志摊在用户脸上（Web端PRD §6.2） */
  .steps{border:1px solid var(--border);border-radius:var(--r);background:#fafafa;}
  .steps-head{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:none;background:none;padding:8px 11px;font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit;}
  .steps-arrow{transition:transform .15s;font-size:13px;color:var(--text-3);display:inline-block;}
  .steps.open .steps-arrow{transform:rotate(90deg);}
  .steps-body{display:none;padding:0 11px 9px;flex-direction:column;gap:4px;}
  .steps.open .steps-body{display:flex;}
  .step{font-size:12px;color:var(--text-2);line-height:1.6;}

  /* 服务卡片：只说结论与下一步，详细内容走产物（Web端PRD §12.1） */
  .svc-card{border:1px solid #c9edd6;background:#fbfffc;border-radius:var(--r);padding:10px 12px;}
  .svc-card h5{margin:0 0 4px;font-size:13px;font-weight:500;}
  .svc-card p{margin:0;font-size:12px;color:var(--text-2);line-height:1.65;}
  .svc-next{margin:6px 0 0;font-size:12px;color:var(--brand-dark);}

  /* 产物卡片：点开在右侧面板预览 */
  .art-cards{display:flex;flex-wrap:wrap;gap:8px;}
  .art-card{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;background:#fff;cursor:pointer;min-width:196px;}
  .art-card:hover{border-color:var(--brand);}
  .art-card.on{border-color:var(--brand);background:var(--brand-light);}
  .art-ic{width:26px;height:26px;flex:none;border-radius:6px;background:var(--brand-light);color:var(--brand-dark);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .art-name{font-size:12px;color:var(--text-1);}
  .art-sub{font-size:11px;color:var(--text-3);}
  .msg-actions{display:flex;gap:14px;}

  /* 右：统一侧面板（点产物卡、或服务头右侧的产物 / 事项入口打开）。
     浮层：不挤压对话区、开关时消息不横向跳动；定位基准是 .chat-body（消息区），
     所以它**不会盖住下方的输入框**——盖住了面板一开就没法发消息。 */
  .art-panel{position:absolute;top:0;right:0;bottom:0;width:320px;z-index:40;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;overflow:hidden;box-shadow:-10px 0 26px rgba(0,0,0,.10);}
  .art-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
  .art-head-title{font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .art-head-x{margin-left:auto;border:none;background:none;font-size:15px;color:var(--text-3);cursor:pointer;line-height:1;padding:0 2px;}
  .art-body{flex:1;overflow-y:auto;padding:12px;}
  .art-meta{font-size:11px;color:var(--text-3);line-height:1.8;margin-bottom:10px;}
  .art-preview{border:1px solid var(--border);border-radius:var(--r);background:#fafafa;padding:12px;font-size:12px;color:var(--text-2);line-height:1.8;}
  .art-preview h6{margin:0 0 6px;font-size:12px;color:var(--text-1);}
  .art-preview table{width:100%;border-collapse:collapse;font-size:11px;}
  .art-preview th,.art-preview td{border:1px solid var(--border);padding:3px 5px;text-align:left;}
  .art-preview th{background:#f0f0f0;color:var(--text-1);}
  .art-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);}
  .art-foot .btn{flex:1;text-align:center;}

  /* ⋯ 菜单的二级「更多 ›」（对齐 WorkBuddy 项目菜单）：一级只留最常用的三项，
     其余收进二级——一级菜单超过 5 项就开始"什么都没突出"。
     二级往**左**展开，不是往右：⋯ 本来就在窗口右上角，往右会直接跑到屏幕外。 */
  .space-sub{position:absolute;right:100%;top:-4px;margin-right:2px;background:#fff;border:1px solid var(--border);
    border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px;min-width:136px;display:none;}
  .space-more-menu.sub-open .space-sub{display:block;}
  .menu-item.has-sub{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;}
  .sub-arrow{color:var(--text-3);font-size:11px;}

  /* 轻量模态：⋯ 菜单里的「修改名称 / 修改描述 / 分享设置」共用（D18）。
     原型不做真弹窗组件，但要让人看清"这三项点下去是什么样子"。 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90;display:flex;align-items:center;justify-content:center;}
  .modal{width:420px;max-width:calc(100vw - 40px);background:#fff;border-radius:var(--r-lg);
    box-shadow:0 16px 48px rgba(0,0,0,.24);overflow:hidden;}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text-1);}
  .modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
  .modal-label{font-size:12px;color:var(--text-2);}
  .modal-input,.modal-textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:var(--r);
    padding:8px 11px;font-size:13px;color:var(--text-1);outline:none;font-family:inherit;}
  .modal-input:focus,.modal-textarea:focus{border-color:var(--brand);}
  .modal-textarea{min-height:76px;resize:vertical;line-height:1.7;}
  .modal-hint{font-size:11px;color:var(--text-3);line-height:1.7;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);}
  /* 分享设置：三档可见范围，选了就说明白"谁能看到" */
  .share-opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);border-radius:var(--r);
    padding:10px 12px;cursor:pointer;}
  .share-opt:hover{border-color:var(--brand);}
  .share-opt.on{border-color:var(--brand);background:var(--brand-light);}
  .share-dot{flex:none;width:14px;height:14px;margin-top:2px;border-radius:50%;border:1px solid var(--text-3);}
  .share-opt.on .share-dot{border:4px solid var(--brand);}
  .share-name{font-size:13px;color:var(--text-1);font-weight:500;}
  .share-desc{font-size:11px;color:var(--text-3);line-height:1.6;margin-top:2px;}

  /* 右侧面板里的「事项」列表 */
  .rem-row{border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;margin-bottom:8px;cursor:pointer;}
  .rem-row:hover{border-color:var(--brand);}
  .rem-top{display:flex;align-items:flex-start;gap:8px;}
  .rem-title{flex:1;min-width:0;font-size:12px;color:var(--text-1);line-height:1.5;}
  .rem-state{flex:none;font-size:10px;padding:1px 7px;border-radius:999px;background:#f2f2f2;color:var(--text-2);}
  .rem-state.ok{background:var(--brand-light);color:var(--brand-dark);}
  .rem-sub{font-size:11px;color:var(--text-3);margin-top:4px;}
  .rem-from{font-size:11px;color:var(--text-3);margin-top:2px;}

  /* 右侧面板里的「产物」列表：整宽卡片，与对话内的产物卡共用一套视觉语言 */
  .art-card.wide{width:100%;min-width:0;box-sizing:border-box;margin-bottom:8px;}

  /* 右侧面板里的「概览」统计 */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat-card{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px;}
  .stat-n{font-size:20px;font-weight:600;color:var(--brand-dark);line-height:1.2;}
  .stat-l{font-size:11px;color:var(--text-3);}

  /* 对话区底部输入框：常驻，是「工作现场」的视觉锚点 */
  .composer{border-top:1px solid var(--border);background:#fff;padding:11px 13px;display:flex;flex-direction:column;gap:9px;}
  .composer-row{display:flex;align-items:center;gap:9px;}
  .composer-input{flex:1;min-width:0;border:1px solid var(--border-strong);border-radius:var(--r);padding:8px 10px;outline:none;font-size:13px;color:var(--text-1);background:#fff;}
  .composer-input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-light);}
  .composer-input::placeholder{color:var(--text-3);}
  .expert-pick{flex:none;border:1px solid var(--border);background:#fafafa;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit;}
  .expert-pick:hover{border-color:var(--brand);color:var(--brand-dark);}
  /* 只读 / 已归档：输入框置灰并说明原因，不隐藏 */
  .composer.locked{background:#fafafa;}
  .composer.locked .composer-input{color:var(--text-3);cursor:not-allowed;background:#f5f5f5;}
  .composer.locked .expert-pick,.composer.locked .btn-primary{opacity:.55;pointer-events:none;}
  .composer-lock{font-size:12px;color:var(--text-3);}

  /* 空态：不是空白，是引导 */
  .chat-empty{margin:auto;text-align:center;max-width:430px;}
  .chat-empty h4{margin:0 0 6px;font-size:14px;font-weight:500;}
  .chat-empty p{margin:0 0 14px;font-size:12px;color:var(--text-2);line-height:1.7;}
  .chat-examples{display:flex;flex-direction:column;gap:7px;}
  .chat-example{border:1px solid var(--border);background:#fff;border-radius:var(--r);padding:8px 11px;font-size:12px;color:var(--text-2);cursor:pointer;text-align:left;font-family:inherit;}
  .chat-example:hover{border-color:var(--brand);color:var(--brand-dark);}
</style>
