   「设为默认服务」全局唯一——已是默认时该项显示为「默认服务」并置灰（§3.5 末条）。 */
function menuItems(s){
  const isOwner = s.role === 'owner';
  const isAdmin = s.role === 'owner' || s.role === 'admin';
  const out = [{ k:'open', label:'打开服务' }];
  if (isAdmin) out.push({ k:'default', label: s.is_default ? '默认服务' : '设为默认服务', disabled: !!s.is_default },
                        { k:'rename', label:'重命名' });
  out.push({ k:'info', label:'服务信息' });
  if (isAdmin) out.push({ k:'members', label:'成员管理' }, { k:'settings', label:'服务设置' });
  out.push({ sep:true });
  if (isOwner) out.push({ k:'archive', label:'归档服务', danger:true });
  else out.push({ k:'leave', label:'退出服务', danger:true });
  return out;
}

function cardHtml(s){
  const menu = menuItems(s).map(it => {
    if (it.sep) return '<div class="menu-sep"></div>';
    return '<button class="menu-item' + (it.danger ? ' danger' : '') + '"' + (it.disabled ? ' disabled' : '') +
      ' onclick="menuAct(event,\'' + it.k + '\',\'' + s.id + '\')">' + it.label + '</button>';
  }).join('');
  const meta = s.state === 'draft'
    ? '<span class="draft-mark">草稿 · 未启用</span>'
    : esc(s.label) + ' · ' + s.members + ' 人';
  return '<div class="card' + (s.state === 'draft' ? ' draft' : '') + '" id="card-' + s.id + '" onclick="openService(\'' + s.id + '\')">' +
      '<div class="card-row1">' +
        '<div class="card-icon">' + icon(tplIconPath(s.tpl)) + '</div>' +
        '<span class="card-name">' + esc(s.name) + '</span>' +
        '<button class="card-more" onclick="toggleMenu(event,\'' + s.id + '\')" aria-label="更多操作">&#8943;</button>' +
      '</div>' +
      '<div class="card-row2">' + (s.tpl ? '<span class="tag">' + esc(s.tpl) + '</span>' : '<span class="tag tag-custom">自定义</span>') + '<span class="tag-role">' + ROLE[s.role] + '</span></div>' +
      (s.desc ? '<div class="card-desc">' + esc(s.desc) + '</div>' : '') +
      '<div class="card-meta">' + meta + '</div>' +
      (openMenuId === s.id ? '<div class="menu" onclick="event.stopPropagation()">' + menu + '</div>' : '') +
    '</div>';
}

function visibleServices(){
  let list = services.filter(s => s.state !== 'archived');
  /* 搜索匹配**名称与描述**（界面说明 §3.6）——不搜服务对象与产物内容（那是服务空间内搜索的职责） */
  if (mode.q.trim()) {
    const q = mode.q.trim().toLowerCase();
    list = list.filter(s => s.name.toLowerCase().includes(q) || (s.desc || '').toLowerCase().includes(q));
  }
  if (mode.sort === 'recent') list.sort((a,b) => b.ts - a.ts);
  if (mode.sort === 'created') list.sort((a,b) => (b.created || b.ts) - (a.created || a.ts));
  if (mode.sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'zh'));
  return list;
}

/* ---------- 侧栏二级菜单（D19 / D20） ----------
   二级列的是「能进去干活的服务」。与列表页的口径只差一处：**草稿不进二级**——
   草稿不是一个能进去的工作现场（点它只会回到创建表单），它留在列表页里更合适。
   搜索框是列表页的局部筛选，不联动侧栏：侧栏是全局导航，不该跟着页面筛选跳。 */
function navServices(){
  if (mode.demo === 'empty') return [];
  return services
    .filter(s => s.state !== 'archived' && s.state !== 'draft')
    .slice()
    .sort((a, b) => b.ts - a.ts);
}

let navOpen = true;         /* 一级「服务」列表的折叠状态。真实产品存在 localStorage，原型刷新重置即可 */
let navExpanded = null;     /* 手风琴：当前展开会话列表的那个服务；null = 全部折叠（D21） */
let navSessAll = {};        /* 哪些服务的会话已经「全部展开」——只在超出上限时才用得上 */
const NAV_SESS_LIMIT = 8;   /* 每个服务在侧栏最多列几条会话：侧栏是导航，不是全量列表（PRD Q39） */

function toggleNav(e){
  /* 别把点击冒泡给一级项——那是「进服务列表」，两个动作不能连在一起触发 */
  if (e) { e.preventDefault(); e.stopPropagation(); }
  navOpen = !navOpen;
  renderNav();
}

/* 某个服务右侧的折叠箭头（D21）：手风琴——同一时刻只展开一个服务的会话列表。
   全展开会把侧栏撑成一面墙，"我要去的那个服务"反而找不到了；
   点开一个就收掉上一个，正好也把"我手上正干着哪个服务"讲清楚。 */
function toggleNavSess(e, sid){
  if (e) { e.preventDefault(); e.stopPropagation(); }
  navExpanded = (navExpanded === sid) ? null : sid;
  renderNav();
}

function expandNavSess(e, sid){
  if (e) e.stopPropagation();
  navSessAll[sid] = true;
  renderNav();
}

/* 一级项、二级项、三级会话都在这里一次出完：侧栏是一棵树，
   分几次渲染就会出现"一半新一半旧"的中间态。 */
function renderNav(){
  const list = navServices();
  const cnt = document.getElementById('nav-count');
  if (cnt) cnt.textContent = list.length;
  const host = document.getElementById('nav-sub');
  const tg = document.getElementById('nav-toggle');
  if (tg) tg.classList.toggle('collapsed', !navOpen);
  if (!host) return;
  host.hidden = !navOpen;
  if (!list.length) {
    host.innerHTML = '<p class="nav-sub-empty">' + (mode.demo === 'empty' ? '还没有服务' : '服务都已归档') + '</p>';
    return;
  }
  /* 「当前」只在服务空间里算：创建表单与列表页都不归属任何服务，别在侧栏留一个亮着的项 */
  const inSpace = !document.getElementById('view-space').hidden && document.getElementById('view-create').hidden;
  host.innerHTML = list.map(s => navGroupHtml(s, inSpace)).join('');
  /* 行内重命名的输入框在侧栏里（会话栏撤掉之后这里是唯一的位置） */
  const ri = document.getElementById('rename-in');
  if (ri) { ri.focus(); ri.select(); }
}

/* 一个服务 + 它下面的会话（D20 的二级项 + D21 的三级列表）。
   会话行只在**当前所在的那个服务**上出现 ⋯ 菜单：别的服务是"入口"，进来才是"在里面"——
   写操作（重命名 / 置顶 / 删除）都发生在自己脚下，
   不会出现「在服务列表页顺手删掉某个陌生服务里的会话」这种事故。 */
function navGroupHtml(s, inSpace){
  const on = inSpace && space.serviceId === s.id;
  const open = navExpanded === s.id;
  const head =
    '<button class="nav-sub-item' + (on ? ' on' : '') + '" title="' + esc(s.name) + '" onclick="navService(\'' + s.id + '\')">' +
      /* 这里原本有一个 20px 的模板图形（tplIconPath + icon），v1.15 按老师意见删除：
         一级项「服务」本就不带图标，二级再带一个会让"服务列表"看起来像另一套菜单。
         模板信息在**列表页卡片**上仍有（.card-icon，同一对函数继续服务那一处），侧栏不再表达模板。 */
      '<span class="nav-sub-name">' + esc(s.name) + '</span>' +
      '<span class="nav-sub-trail">' +
        (on ? '<span class="nav-sub-dot"></span>' : '') +
        '<span class="nav-sub-caret' + (open ? '' : ' collapsed') + '" role="button" ' +
          'aria-expanded="' + (open ? 'true' : 'false') + '" ' +
          'aria-label="展开或收起该服务的会话" title="展开 / 收起会话" ' +
          'onclick="toggleNavSess(event,\'' + s.id + '\')">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '</span>' +
      '</span>' +
    '</button>';
  /* 折叠着就整段不渲染：几个服务 × 每个几十条会话，塞进 DOM 就是几百个看不见的节点 */
  return '<div class="nav-grp">' + head + (open ? navSessHtml(s, on) : '') + '</div>';
}

function navSessHtml(s, on){
  const all = sessionsOf(s.id);
  if (!all.length) {
    /* 空态不是空白（§8.4 第 3 条）：这一行是入口，不是一句"暂无会话" */
    return '<div class="nav-sess">' +
      '<button class="nav-sess-empty" onclick="navNewSession(\'' + s.id + '\')">还没有会话，去开一段 ›</button>' +
    '</div>';
  }
  const cut = navSessAll[s.id] ? all.length : Math.min(all.length, NAV_SESS_LIMIT);
  const rows = all.slice(0, cut).map(c => navSessRow(c, on)).join('');
  const more = (all.length > cut)
    ? '<button class="nav-sess-all" onclick="expandNavSess(event,\'' + s.id + '\')">还有 ' + (all.length - cut) + ' 个 ›</button>'
    : '';
  return '<div class="nav-sess">' + rows + more + '</div>';
}

/* 三级行：标题 + 置顶标记 + hover 才现的 ⋯。
   专家名与相对时间**不在这里出现**——一行只有 260px 宽，塞三样东西的结果是每样都被截断；
   它们留在对话区头部（§8.3）与服务头，侧栏只负责回答"点哪一条"。 */
function navSessRow(c, on){
  if (on && space.renaming === c.id) {
    return '<div class="nav-sess-item on">' +
      '<input class="nav-sess-rename" id="rename-in" value="' + esc(c.title) + '"' +
        ' onkeydown="renameKey(event,\'' + c.id + '\')" />' +
    '</div>';
  }
  /* button 里不能嵌 button，所以 ⋯ 用 span + role —— 与一级项右侧的折叠箭头同一套做法 */
  const more = on
    ? '<span class="nav-sess-more" role="button" title="重命名 / 置顶 / 删除" ' +
        'onclick="event.stopPropagation();sessMenu(\'' + c.id + '\')">&#8943;</span>'
    : '';
  return '<button class="nav-sess-item' + (on && c.id === space.activeSessionId ? ' on' : '') + '"' +
      ' id="nsrow-' + c.id + '" title="' + esc(c.title) + '"' +
      ' onclick="navSession(\'' + c.serviceId + '\',\'' + c.id + '\')">' +
    '<span class="nav-sess-name">' + esc(c.title) + '</span>' +
    '<span class="nav-sess-pin" title="' + (c.pinned ? '已置顶' : '') + '">' + (c.pinned ? '●' : '') + '</span>' + more +
  '</button>' + sessRowMenu(c);   /* 菜单得挂在行外面——button 里放不下一个浮层 */
}

/* 侧栏随时可点。在创建表单里点侧栏 = 「离开表单」，走与「取消」同一套二次确认（§5.5） */
function navMyServices(){
  if (!document.getElementById('view-create').hidden) { cancelCreate(null); return; }
  if (document.getElementById('view-space').hidden && !document.getElementById('view-list').hidden) { toast('已在服务列表'); return; }
  applyNav(null);
}
function navService(id){
  if (!document.getElementById('view-create').hidden) { cancelCreate({ serviceId:id }); return; }
  applyNav(id);
}
/* 点三级会话（D21）：进那个服务、并**直接打开这一条**；
   已经在这个服务里就只切会话——不重建界面，会话选中态与右侧面板都还在（D20 同一条道理） */
function navSession(sid, cid){
  if (!document.getElementById('view-create').hidden) { cancelCreate({ serviceId:sid, sessionId:cid }); return; }
  if (!document.getElementById('view-space').hidden && space.serviceId === sid) { openSession(cid); return; }
  enterSpace(sid, cid);
}
/* 某个服务下还没有会话时，那一行是入口：点了就进这个服务，光标落在输入框里 */
function navNewSession(sid){
  if (!document.getElementById('view-create').hidden) { cancelCreate({ serviceId:sid }); return; }
  if (!document.getElementById('view-space').hidden && space.serviceId === sid) { newSession(); return; }
  enterSpace(sid);
}
function applyNav(id){
  if (!id) { if (!document.getElementById('view-space').hidden) backToList(); return; }
  const inSpace = !document.getElementById('view-space').hidden;
  if (inSpace && space.serviceId === id) { navExpanded = id; renderNav(); return; }  /* 已经在这个服务里：别重建界面 */
  enterSpace(id);
}

function tplHtml(t, big){
  return '<div class="tpl-card' + (big ? ' big' : '') + '" onclick="openCreate(\'' + t.id + '\')">' +
    '<div class="tpl-row1"><div class="tpl-icon">' + icon(t.icon) + '</div>' +
    '<span class="tpl-name">' + esc(t.name) + '</span></div>' +
    '<p class="tpl-desc">' + esc(t.desc) + '</p>' +
    '<p class="tpl-prev">预置 ' + t.experts + ' 个专家 · ' + t.statuses + ' 个事项状态</p>' +
  '</div>';
}

function renderTemplates(){
  let list = templates;
  if (mode.qt.trim()) {
    const q = mode.qt.trim().toLowerCase();
    list = list.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q));
  }
  const html = list.length ? list.map(t => tplHtml(t)).join('')
    : '<div class="no-result" style="grid-column:1/-1">没有匹配的模板</div>';
  const a = document.getElementById('tpl-grid');
  const b = document.getElementById('tpl-grid-empty');
  if (a) a.innerHTML = html;
  if (b) b.innerHTML = list.length ? list.map(t => tplHtml(t, true)).join('') : '<div class="no-result" style="grid-column:1/-1">没有匹配的模板</div>';
}

function render(){
  /* 演示模式「空态」= 真的一个服务都没有；「全部归档」也落在空态分支，但文案不同（§4.2） */
  const visible = mode.demo === 'empty' ? [] : services.filter(s => s.state !== 'archived');
  const isEmpty = visible.length === 0;
  document.getElementById('list-content').hidden = isEmpty;
  document.getElementById('empty-content').hidden = !isEmpty;
  renderNav();

  if (isEmpty) {
    renderEmptyCard(mode.demo === 'archived');
  } else {
    const wrap = document.getElementById('svc-grid-wrap');
    const list = visibleServices();
    if (!list.length && mode.q.trim()) {
      wrap.innerHTML = '<div class="no-result">没有匹配「' + esc(mode.q) + '」的服务　<button class="btn-text" onclick="clearQuery()">清除筛选</button></div>';
    } else {
      wrap.innerHTML = '<div class="grid">' + list.map(cardHtml).join('') + '</div>';
    }
  }
  renderTemplates();
}

/* 两种空态共用同一张引导卡（界面说明 §4.2 / §7）：
   真·没有服务 → 「还没有服务」+「从空白创建」；
   服务都归档了 → 「服务都已归档」+「查看归档服务」。
   文案不分，用户会以为数据丢了。 */
function renderEmptyCard(allArchived){
  const t = document.getElementById('empty-title');
  const x = document.getElementById('empty-text');
  const act = document.getElementById('empty-action');
  if (!t || !x || !act) return;
  if (allArchived) {
    t.textContent = '服务都已归档';
    x.innerHTML = '归档的服务不再列在这里，需要时可以恢复。<br />模板还在，随时能再建一个。';
    act.setAttribute('class', 'btn-text');
    act.setAttribute('onclick', "toast('查看归档服务（原型略）')");
    act.textContent = '查看归档服务';
  } else {
    t.textContent = '还没有服务';
    x.innerHTML = '选一个模板开始，配置都预置好了，创建后随时能改。<br />也可以从空白服务自己配全套。';
    act.setAttribute('class', 'btn');
    act.setAttribute('onclick', 'openCreate(null)');
    act.textContent = '从空白创建';
  }
}

function clearQuery(){
  mode.q = '';
  document.getElementById('q').value = '';
  render();
}

function toggleMenu(e, id){
  e.stopPropagation();
  openMenuId = (openMenuId === id) ? null : id;
  render();
}

document.addEventListener('click', () => {
  let dirty = false;
  if (openMenuId) { openMenuId = null; dirty = true; }
  /* 会话行的 ⋯ 菜单也在这里收（两套菜单都挂在文档上，统一由冒泡关闭） */
  if (space.menuId) { space.menuId = null; dirty = true; }
  if (!dirty) return;
  render();
  if (space.serviceId && !document.getElementById('view-space').hidden) renderSpace();
});

function menuAct(e, k, id){
  e.stopPropagation();
  openMenuId = null;
  const s = services.find(x => x.id === id);
  /* 默认服务全局唯一（同用户下至多一个）：设新的，旧的自动取消 */
  if (k === 'default' && s) {
    services.forEach(x => { x.is_default = false; });
    s.is_default = true;
  }
  render();
  const map = {
    open:'打开服务（原型略）',
    default:'已设为默认服务（原型略）',
    rename:'重命名（原型略）',
    info:'服务信息（原型略）',
    members:'成员管理（原型略）',
    settings:'服务设置（原型略）',
    archive:'归档服务需二次确认并输入服务名（原型略）',
    leave:'退出服务需二次确认（原型略）'
  };
  toast(map[k] + (s ? '：' + s.name : ''));
}

function openService(id){
  if (openMenuId) { openMenuId = null; render(); return; }
  const s = services.find(x => x.id === id);
  if (!s) return;
  if (s.state === 'draft') { openCreate(null, s); return; }
  enterSpace(id);
}

/* ---------- 服务空间（D15：会话工作台） ---------- */

function enterSpace(id, pickSessionId){
  const s = services.find(x => x.id === id);
  space.serviceId = id;
  dropRunning();
  space.menuId = null;
  space.renaming = null;
  space.panelKind = null;
  space.artifactId = null;
  space.stepsOpen = {};
  space._sessRendered = null;
  space.modal = null;
  const tpl = (s && s.tpl) ? templates.find(t => t.name === s.tpl) : null;
  space.expertId = tpl ? tpl.defaultExperts[0] : 'e1';
  /* 落地即落在最近更新的会话上（D15）：进来就是工作现场，不必先点一次。
     pickSessionId 来自「点侧栏三级」，比"最近"更明确，优先于它 */
  const first = sessionsOf(id)[0];
  space.activeSessionId = pickSessionId || (first ? first.id : null);
  /* 进哪个服务就在侧栏展开哪个服务的会话（D21）——否则会出现"进了服务却看不到会话列表"：
     会话栏已经不在了，侧栏是会话列表唯一的落点 */
  navExpanded = id;
  document.getElementById('view-list').hidden = true;
  document.getElementById('view-create').hidden = true;
  document.getElementById('view-space').hidden = false;
  document.getElementById('sess-input').value = '';
  onSessInput();
  renderNav();          /* 侧栏：当前服务高亮（D20）+ 它下面的会话（D21） */
  renderSpace();
  /* 空服务：光标直接落进输入框，别让人再点一次 */
  if (!space.activeSessionId) document.getElementById('sess-input').focus();
}

function backToList(){
  dropRunning();
  space.menuId = null;      /* 会话行的菜单 / 行内重命名都留在服务空间里，别把浮层带回列表页 */
  space.renaming = null;
  document.getElementById('view-space').hidden = true;
  document.getElementById('view-list').hidden = false;
  render();
}

/* 相对时间：口径与列表页服务卡片完全一致（界面说明 §8.3） */
function relTime(ts){
  const d = Date.now() - ts;
  if (d < H)          return Math.max(1, Math.round(d / 60000)) + ' 分钟前';
  if (d < 24 * H)     return Math.round(d / H) + ' 小时前';
  if (d < 48 * H)     return '昨天';
  if (d < 7 * D)      return Math.round(d / D) + ' 天前';
  if (d < 14 * D)     return '上周';
  if (d < 30 * D)     return Math.max(2, Math.floor(d / (7 * D))) + ' 周前';
  return Math.max(1, Math.floor(d / (30 * D))) + ' 个月前';
}

function expertName(id){ const e = EXPERTS.find(x => x.id === id); return e ? e.name : '未指定专家'; }

/* 本服务的会话（D21）：置顶优先 → 最近更新。
   侧栏三级、进服务时"落在哪一条"、概览统计，三处共用这一处口径，免得跑偏。 */
function sessionsOf(sid){
  return sessions.filter(c => c.serviceId === sid)
    .slice()
    .sort((a, b) => (b.pinned - a.pinned) || (b.ts - a.ts));
}

/* 会话行的 ⋯ 菜单（D21：会话列表搬到侧栏三级之后，菜单还长在同一行旁边）：
   重命名（行内）/ 置顶 / 删除，与列表页卡片菜单同构（界面说明 §8.3）。
   视口定位——侧栏是滚动容器，相对定位会被 overflow 裁掉，靠底部的行还会上下翻转 */
function sessRowMenu(c){
  if (space.menuId !== c.id) return '';
  const p = space.menuPos || { top:0, left:0 };
  return '<div class="nav-menu" style="top:' + p.top + 'px;left:' + p.left + 'px" onclick="event.stopPropagation()">' +
      '<button class="menu-item" onclick="startRename(\'' + c.id + '\')">重命名</button>' +
      '<button class="menu-item" onclick="togglePin(\'' + c.id + '\')">' + (c.pinned ? '取消置顶' : '置顶') + '</button>' +
      '<div class="menu-sep"></div>' +
      '<button class="menu-item danger" onclick="removeSession(\'' + c.id + '\')">删除</button>' +
    '</div>';
}

/* ---------- 渲染：对话区 ---------- */

function sessionById(id){ return sessions.find(c => c.id === id); }

function artCardHtml(id){
  const a = ARTIFACTS[id];
  if (!a) return '';
  return '<button class="art-card' + (space.artifactId === id ? ' on' : '') + '" onclick="openArtifact(\'' + id + '\')">' +
    '<span class="art-ic">' + esc(a.fmt) + '</span>' +
    '<span><span class="art-name">' + esc(a.title) + '</span>' +
      '<span class="art-sub" style="display:block">' + esc(a.meta) + '</span></span>' +
  '</button>';
}

/* 专家运行消息（Web端PRD §7.1）：专家名 + 状态 + 执行过程（折叠）+ 服务卡片 + 产物卡 + 追问入口 */
function botMsgHtml(m, key){
  const open = !!space.stepsOpen[key];
  const steps = (m.steps && m.steps.length)
    ? '<div class="steps' + (open ? ' open' : '') + '">' +
        '<button class="steps-head" onclick="toggleSteps(\'' + key + '\')">' +
          '<span class="steps-arrow">&#8250;</span>执行过程 · ' + m.steps.length + ' 步</button>' +
        '<div class="steps-body">' +
          m.steps.map(t => '<div class="step">· ' + esc(t) + '</div>').join('') +
        '</div></div>'
    : '';
  const card = m.card
    ? '<div class="svc-card"><h5>' + esc(m.card.title) + '</h5>' +
      '<p>' + esc(m.card.summary) + '</p>' +
      (m.card.next ? '<p class="svc-next">下一步：' + esc(m.card.next) + '</p>' : '') + '</div>'
    : '';
  const arts = (m.arts && m.arts.length)
    ? '<div class="art-cards">' + m.arts.map(artCardHtml).join('') + '</div>'
    : '';
  const acts = m.actions
    ? '<div class="msg-actions">' +
        '<button class="btn-text" onclick="toast(\'继续追问（原型略）\')">继续追问</button>' +
        '<button class="btn-text" onclick="toast(\'重新生成（原型略）\')">重新生成</button>' +
      '</div>'
    : '';
  const stateCls = m.state === '已完成' ? 'ok' : (m.state === '运行中' ? 'doing' : '');
  return '<div class="msg-bot">' +
      '<div class="msg-bot-head"><span class="bot-avatar">' + esc(expertName(m.expert).slice(0,1)) + '</span>' +
        '<span class="bot-name">' + esc(expertName(m.expert)) + '</span>' +
        '<span class="bot-state ' + stateCls + '">' + esc(m.state) + '</span></div>' +
      steps + card + arts + acts +
    '</div>';
}

function chatHtml(c){
  if (!c) {
    /* 空态不是空白：输入框保持可用 + 行业化示例引导（§8.4 第 3 条），不写「暂无数据」 */
    return '<div class="chat-empty">' +
      '<h4>这个服务还没有会话</h4>' +
      '<p>在下面输入框里问一句就开始——一个问题就是一个会话，可以一直往下聊。<br />专家跑完一轮，产物会挂在这条消息下面。</p>' +
      '<div class="chat-examples">' +
        '<button class="chat-example" onclick="pickExample(this)">本月哪些孩子该做视力复查？</button>' +
        '<button class="chat-example" onclick="pickExample(this)">把本周的晨检异常汇总一下</button>' +
      '</div></div>';
  }
  return c.msgs.map((m, i) => {
    if (m.who === 'user') return '<div class="msg-user">' + esc(m.text) + '</div>';
    if (m.who === 'sys')  return '<div class="chat-meta" style="font-size:12px">· ' + esc(m.text) + '</div>';
    return botMsgHtml(m, c.id + ':' + i);
  }).join('');
}

/* 点开一份产物：右侧面板切到预览（面板是浮层，不挤压对话区） */
function openArtifact(id){ space.artifactId = id; space.panelKind = 'artifact'; renderSpace(); }
function toggleSteps(key){ space.stepsOpen[key] = !space.stepsOpen[key]; renderSpace(); }
function pickExample(btn){
  const el = document.getElementById('sess-input');
  el.value = btn.textContent;
  onSessInput();
  el.focus();
}

function renderSpace(){
  const s = services.find(x => x.id === space.serviceId);
  if (!s) { backToList(); return; }

  document.getElementById('space-name').textContent = s.name;
  document.getElementById('space-tpl').textContent = s.tpl || '自定义';
  const st = document.getElementById('space-state');
  st.textContent = s.state === 'active' ? '进行中' : (s.state === 'paused' ? '已暂停' : '已归档');
  st.style.cssText = s.state === 'active'
    ? 'background:var(--brand-light);color:var(--brand-dark);'
    : 'background:#f2f2f2;color:var(--text-2);';

  /* D18 / D21：服务空间没有"别的页面"，也没有服务级导航栏——会话列表在**应用级侧栏**里，
     这里只剩对话区与浮层右侧面板，所以不再需要"切页时隐藏左中两栏"。 */

  /* 中：对话区（显示侧栏三级里选中的那个会话） */
  const cur = sessionById(space.activeSessionId);
  const curId = cur ? cur.id : null;
  document.getElementById('chat-title').textContent = cur ? cur.title : '新会话';
  document.getElementById('chat-meta').textContent = cur
    ? expertName(cur.expert) + ' · ' + relTime(cur.ts)
    : '发送后创建';
  /* 滚动位置：换会话才跳到底；同一会话内的重渲染（展开执行过程、开关产物面板、置顶…）
     必须保持原位置，否则用户点个产物就被甩到对话末尾（Web端PRD §6.5「回到原聊天位置」） */
  const sc = document.getElementById('chat-scroll');
  const keep = space._sessRendered === curId;
  const prevTop = keep ? sc.scrollTop : null;
  sc.innerHTML = chatHtml(cur);
  sc.scrollTop = (prevTop === null) ? sc.scrollHeight : prevTop;
  space._sessRendered = curId;

  /* 服务头右侧：产物 / 事项 两个带计数入口（D21）——常驻，不随面板开关变化 */
  renderHeadTools();

  /* 右：统一侧面板（浮层；关闭即隐藏，不影响对话位置） */
  renderPanel();

  /* 侧栏：会话列表与当前会话的高亮（D21）。
     会话是挂在侧栏上的，所以对话区每次重渲染都要把它带上——
     否则置顶 / 重命名 / 新会话之后，侧栏会停在旧状态（"我明明置顶了，侧栏没动"） */
  renderNav();

  document.getElementById('expert-pick').textContent = expertName(space.expertId) + ' ▾';

  /* 发送 / 停止 双态（界面说明 §8.6）：运行中这个按钮变成「停止」并保持可点 */
  const sendBtn = document.getElementById('btn-send');
  sendBtn.textContent = space.running ? '停止' : '发送';
  sendBtn.disabled = space.running ? false : !(document.getElementById('sess-input').value || '').trim();

  /* 输入框降级：只读 / 已归档置灰并说明原因（不隐藏），暂停态保持可读、发送时才拦（§8.7） */
  const locked = s.state === 'archived' || s.role === 'viewer';
  document.getElementById('composer').classList.toggle('locked', locked);
  document.getElementById('sess-input').disabled = locked;
  const lock = document.getElementById('composer-lock');
  lock.hidden = !locked;
  lock.textContent = s.state === 'archived' ? '服务已归档，恢复后可继续' : '你在此服务为只读';

  /* 黄条：未添加专家时贴输入框上方（与创建表单 §5.4 同一条规则）；只读时此提示无意义，不显示 */
  const tpl = s.tpl ? templates.find(t => t.name === s.tpl) : null;
  const hasExpert = !!(tpl && tpl.defaultExperts && tpl.defaultExperts.length);
  const warn = document.getElementById('sess-warn');
  warn.hidden = locked || hasExpert;
  if (!warn.hidden) {
    document.getElementById('sess-warn-text').textContent =
      '该服务未添加专家，将以默认助手响应；可在「专家」里添加岗位专家。';
  }
}

/* ⋯ 菜单：置顶（切换排序）+ 重命名（行内）+ 删除（二次确认）
   菜单定位在打开时算一次（视口坐标），靠近窗口底部时向上翻转，避免被裁掉 */
function sessMenu(id){
  if (space.menuId === id) { space.menuId = null; renderSpace(); return; }
  const row = document.getElementById('nsrow-' + id);
  if (row) {
    const b = row.getBoundingClientRect();
    const MH = 118, MW = 132;
    let top = b.top + 26;
    if (top + MH > window.innerHeight - 8) top = Math.max(8, b.bottom - MH);
    space.menuPos = { top:Math.round(top), left:Math.round(b.right - MW - 8) };
  }
  space.menuId = id;
  space.renaming = null;
  renderSpace();
}
function togglePin(id){
  const c = sessionById(id);
  if (!c) return;
  c.pinned = !c.pinned;
  space.menuId = null;
  renderSpace();
  toast(c.pinned ? '已置顶：' + c.title : '已取消置顶：' + c.title);
}
function startRename(id){
  space.menuId = null;
  space.renaming = id;
  renderSpace();
}
function renameKey(e, id){
  if (e.key === 'Enter') { e.preventDefault(); commitRename(id); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelRename(); }
}
function commitRename(id){
  const c = sessionById(id);
  const el = document.getElementById('rename-in');
  const v = el ? el.value.trim() : '';
  space.renaming = null;
  /* 不改 c.ts：重命名是元数据操作，不是「最近干活」——改了会把这条顶到列表最前面（排序键=会话更新时间） */
  if (c && v) c.title = v;
  renderSpace();
  if (c && v) toast('已重命名');
}
function cancelRename(){ space.renaming = null; renderSpace(); }
function removeSession(id){
  const c = sessionById(id);
  if (!c) return;
  if (space.running && space.running.sessionId === id) dropRunning();
  space.menuId = null;
  space.artifactId = null;
  sessions = sessions.filter(x => x.id !== id);
  /* 删掉当前正在看的会话时，落到下一条（不留在空对话区上） */
  if (space.activeSessionId === id) {
    const next = sessionsOf(space.serviceId)[0];
    space.activeSessionId = next ? next.id : null;
  }
  renderSpace();
  toast('已删除会话「' + c.title + '」（运行记录保留，处置见 PRD Q32）');
}

function openSession(id){
  space.activeSessionId = id;
  dropRunning();
  space.artifactId = null;
  space.stepsOpen = {};
  space.menuId = null;
  const c = sessionById(id);
  if (c) space.expertId = c.expert;
  renderSpace();
}

/* 本服务已有的产物 id：从各会话的运行里反查（原型不另存索引，
   真实实现走产物表的 service_id —— 见 PRD §5.2 产物表） */
function artifactsOf(sid){
  const out = [];
  sessions.filter(c => c.serviceId === sid).forEach(c =>
    (c.msgs || []).forEach(m => (m.arts || []).forEach(id => { if (out.indexOf(id) < 0) out.push(id); })));
  return out;
}

/* 服务头右侧入口（D21）：产物 / 事项 —— 点击在右侧面板查看，不跳页。
   它们原先坐在会话栏底部，会话栏上移到应用级侧栏之后落到这里（服务头本来就是服务级信息行）。
   带计数是必要的：这两个入口没有页面标题承载"有多少"，数字直接给在入口上；
   计数也让人一眼看出"这个服务攒下东西了没有"。 */
function renderHeadTools(){
  const host = document.getElementById('head-tools');
  if (!host) return;
  const sid = space.serviceId;
  const counts = {
    artifacts: artifactsOf(sid).length,
    reminders: REMINDERS.filter(r => r.serviceId === sid).length
  };
  host.innerHTML = HEAD_TOOLS.map(t => {
    const on = (space.panelKind === t.k);
    return '<button class="head-tool' + (on ? ' on' : '') + '" ' +
      'title="' + esc(t.label) + '：点击在右侧面板查看" onclick="openPanel(\'' + t.k + '\')">' +
      icon(t.path) + '<span>' + esc(t.label) + '</span>' +
      '<span class="tool-count">' + counts[t.k] + '</span></button>';
  }).join('');
}

/* 右侧统一面板（D18）：产物预览 / 产物列表 / 事项列表 / 服务设置 / 概览
   共用一个位置——用户不需要记住"哪个东西在哪个页面"，只需记住"点它，右边看"。 */
function renderPanel(){
  const el = document.getElementById('art-panel');
  const kind = space.artifactId ? 'artifact' : space.panelKind;
  if (!kind) { el.hidden = true; return; }
  el.hidden = false;

  const title = document.getElementById('art-title');
  const body = document.getElementById('art-body');
  const foot = document.getElementById('panel-foot');
  foot.hidden = true;
  foot.innerHTML = '';

  if (kind === 'artifact') {
    const a = ARTIFACTS[space.artifactId];
    if (!a) { el.hidden = true; return; }
    title.textContent = a.title;
    body.innerHTML = '<div class="art-meta">' + esc(a.meta) + '<br />来自本会话的一次运行</div>' +
      '<div class="art-preview">' + a.body + '</div>';
    foot.hidden = false;
    foot.innerHTML =
      '<button class="btn" onclick="toast(\'下载产物（原型略）\')">下载</button>' +
      '<button class="btn" onclick="toast(\'新窗口打开（原型略）\')">新窗口打开</button>';
    return;
  }

  const views = {
    artifacts: { t:'产物',    render:panelArtifactsHtml },
    reminders: { t:'事项',    render:panelRemindersHtml },
    settings:  { t:'服务设置', render:panelSettingsHtml },
    overview:  { t:'服务概览', render:panelOverviewHtml }
  };
  const v = views[kind];
  title.textContent = v ? v.t : '';
  body.innerHTML = v ? v.render() : '';
}

function panelArtifactsHtml(){
  const ids = artifactsOf(space.serviceId);
  if (!ids.length) {
    return '<p class="pane-empty">这个服务还没有产物。<br />在会话里让专家跑一轮——产物会先出现在对话中，也会汇总到这里。</p>';
  }
  return '<p class="pane-sub">本服务的全部产物。点开任意一份来看内容。</p>' +
    ids.map(id => {
      const a = ARTIFACTS[id];
      if (!a) return '';
      return '<div class="art-card wide" onclick="openArtifact(\'' + id + '\')">' +
        '<span class="art-ic">' + esc(a.fmt) + '</span>' +
        '<span><span class="art-name">' + esc(a.title) + '</span>' +
        '<span class="art-sub" style="display:block">' + esc(a.meta) + '</span></span></div>';
    }).join('');
}

function panelRemindersHtml(){
  const list = REMINDERS.filter(r => r.serviceId === space.serviceId);
  if (!list.length) {
    return '<p class="pane-empty">这个服务还没有事项。<br />会话里说一句"记得……"，专家就会替你建一条。</p>';
  }
  return '<p class="pane-sub">多数事项是会话跑出来的。右下角标着它来自哪一段对话。</p>' +
    list.map(r =>
      '<div class="rem-row" onclick="toast(\'打开事项（原型略）：' + r.title + '\')">' +
        '<div class="rem-top"><span class="rem-title">' + esc(r.title) + '</span>' +
          '<span class="rem-state' + (r.state === '已完成' ? ' ok' : '') + '">' + esc(r.state) + '</span></div>' +
        '<div class="rem-sub">' + esc(r.owner) + ' · ' + relTime(r.ts) + '</div>' +
        '<div class="rem-from">来自会话「' + esc(r.from) + '」</div>' +
      '</div>').join('');
}

function panelSettingsHtml(){
  return '<p class="pane-sub">服务里的东西都在这儿配。' +
    '至于服务本身（叫什么、怎么写描述、谁能看），在右上角的 ⋯ 里。</p>' +
    SETTINGS_SECTIONS.map(x =>
      '<div class="set-row" onclick="toast(\'' + x.label + '：原型未展开，见界面设计说明\')">' +
        '<span class="set-name">' + x.label + '</span>' +
        '<span class="set-desc">' + x.desc + '</span></div>').join('');
}

function panelOverviewHtml(){
  const sid = space.serviceId;
  const rem = REMINDERS.filter(r => r.serviceId === sid);
  const stats = [
    { n:sessionsOf(sid).length,          label:'会话' },
    { n:artifactsOf(sid).length,         label:'产物' },
    { n:rem.length,                      label:'事项' },
    { n:rem.filter(r => r.state !== '已完成').length, label:'待推进' }
  ];
  return '<p class="pane-sub">这个服务的累积情况，只统计本服务。</p>' +
    '<div class="stat-grid">' + stats.map(s =>
      '<div class="stat-card"><span class="stat-n">' + s.n + '</span>' +
      '<span class="stat-l">' + s.label + '</span></div>').join('') + '</div>';
}

/* 左栏入口的开关语义：点同一个入口第二次 = 收起面板（省掉一次"找关闭按钮"） */
function openPanel(kind){
  if (space.panelKind === kind && !space.artifactId) { closePanel(); return; }
  space.panelKind = kind;
  space.artifactId = null;
  renderSpace();
}
function closePanel(){
  space.panelKind = null;
  space.artifactId = null;
  renderSpace();
}

/* 服务头 ⋯ 菜单（D18，形态对齐 WorkBuddy 项目菜单）：
   一级只放**服务本身**的三件事——改名、改描述、分享；其余收进「更多 ›」。
   为什么一级只留三项：菜单一长就"什么都没突出"。改名 / 改描述 / 分享是服务级的日常动作，
   概览、服务对象、运行记录、服务设置是"偶尔才去"的，进二级不损失效率。
   分工要记牢：**⋯ = 服务本身**；**「设置」= 服务里的东西**（成员 / 专家 / 事项配置 / 运行记录）。 */
function toggleSpaceMenu(e){
  e.stopPropagation();
  const already = !!document.querySelector('.space-more-menu');
  closeSpaceMenu();
  if (already) return;
  const r = e.currentTarget.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'nav-menu space-more-menu';
  m.style.top = (r.bottom + 6) + 'px';
  m.style.left = Math.max(8, r.right - 156) + 'px';
  const isOwner = ['owner', 'admin'].includes((services.find(s => s.id === space.serviceId) || {}).role);
  m.innerHTML =
    '<button class="menu-item" onclick="closeSpaceMenu();openDialog(\'name\')">修改服务名称</button>' +
    '<button class="menu-item" onclick="closeSpaceMenu();openDialog(\'desc\')">修改服务描述</button>' +
    '<button class="menu-item" onclick="closeSpaceMenu();openDialog(\'share\')">分享设置</button>' +
    '<div class="menu-sep"></div>' +
    '<div class="menu-item has-sub" onclick="toggleSub(event)"><span>更多</span><span class="sub-arrow">›</span>' +
      '<div class="space-sub" onclick="event.stopPropagation()">' +
        '<button class="menu-item" onclick="closeSpaceMenu();openPanel(\'overview\')">服务概览</button>' +
        '<button class="menu-item" onclick="closeSpaceMenu();toast(\'服务对象（原型略）\')">服务对象</button>' +
        '<button class="menu-item" onclick="closeSpaceMenu();toast(\'运行记录（原型略）\')">运行记录</button>' +
        '<button class="menu-item" onclick="closeSpaceMenu();openPanel(\'settings\')">服务设置</button>' +
        '<div class="menu-sep"></div>' +
        (isOwner
          ? '<button class="menu-item danger" onclick="closeSpaceMenu();toast(\'归档服务需二次确认（原型略）\')">归档服务</button>' +
            '<button class="menu-item danger" onclick="closeSpaceMenu();toast(\'删除服务需二次确认（原型略）\')">删除服务</button>'
          : '<button class="menu-item danger" onclick="closeSpaceMenu();toast(\'退出服务需二次确认（原型略）\')">退出服务</button>') +
      '</div>' +
    '</div>';
  document.body.appendChild(m);
  /* 用 setTimeout 注册一次性外部点击关闭，否则本次点击会立刻把菜单关掉 */
  setTimeout(function(){ document.addEventListener('click', closeSpaceMenu, { once:true }); }, 0);
}
/* 「更多 ›」：子菜单默认收起，点一次展开。
   不做 hover 展开——鼠标划过就弹层太容易误触，而且移动端没有 hover。 */
function toggleSub(e){
  e.stopPropagation();
  const m = document.querySelector('.space-more-menu');
  if (m) m.classList.toggle('sub-open');
}
function closeSpaceMenu(){
  const m = document.querySelector('.space-more-menu');
  if (m) m.remove();
}

function newSession(){
  space.activeSessionId = null;
  dropRunning();
  space.artifactId = null;
  space.stepsOpen = {};
  space.menuId = null;
  renderSpace();
  document.getElementById('sess-input').focus();
  toast('已切到「新会话」，发送后创建');
}

/* 切换专家：写入会话的 expert_ref；不回溯已有运行（PRD FR-213） */
function cycleExpert(){
  const i = EXPERTS.findIndex(e => e.id === space.expertId);
  space.expertId = EXPERTS[(i + 1) % EXPERTS.length].id;
  const c = sessionById(space.activeSessionId);
  if (c) c.expert = space.expertId;
  renderSpace();
  toast('本会话专家：' + expertName(space.expertId));
}

/* 发送按钮随输入启停：空输入不可点，避免一次无意义的请求。
   运行中例外——那时它是「停止」，与输入内容无关（界面说明 §8.6） */
function onSessInput(){
  const el = document.getElementById('sess-input');
  const btn = document.getElementById('btn-send');
  if (!btn) return;
  if (space.running) { btn.disabled = false; return; }
  btn.disabled = !(el.value || '').trim();
}

/* 首次发送即建会话（PRD FR-210）；已有会话则续写一轮（会话 ⊇ 多次运行）。
   原型不真跑 Agent：先用「运行中」落位，1.2 秒后由 finishRun 改成「已完成」并挂上服务卡片，
   对应真实实现里的运行事件流（Web端Agent实时执行与产物交互PRD §9）。
   运行中按钮变「停止」（界面说明 §8.6）——用户必须能中断一次跑偏的运行。 */
function sendMessage(){
  if (space.running) { toast('专家正在执行，可点「停止」中断'); return; }
  const s = services.find(x => x.id === space.serviceId);
  if (s && s.state === 'paused') { toast('服务已暂停，恢复后可继续'); return; }
  const el = document.getElementById('sess-input');
  const text = (el.value || '').trim();
  if (!text) { toast('先写点什么'); return; }

  const run = { who:'bot', expert:space.expertId, state:'运行中',
                steps:['正在理解你的要求','正在检索服务内的相关资料'],
                card:null, arts:[], actions:false };
  let c = sessionById(space.activeSessionId);
  if (c) {
    c.ts = Date.now();
    c.msgs.push({ who:'user', text:text }, run);
  } else {
    const title = text.length > 14 ? text.slice(0, 14) + '…' : text;
    c = { id:'c' + Date.now(), serviceId:space.serviceId, title:title,
          expert:space.expertId, pinned:false, ts:Date.now(),
          msgs:[{ who:'user', text:text }, run] };
    sessions.push(c);
    space.activeSessionId = c.id;
  }
  space.running = { msg:run, sessionId:c.id, timer:setTimeout(() => finishRun(c.id, run), 1200) };
  space._sessRendered = null;   /* 有新消息 —— 这次允许跳到对话末尾 */
  renderSpace();
  el.value = '';
  onSessInput();
}

/* 一轮运行收尾：挂上服务卡片与追问入口，并解除「停止」态 */
function finishRun(sid, run){
  if (!run || run.state !== '运行中') return;
  const c = sessionById(sid);
  run.state = '已完成';
  run.steps = ['正在理解你的要求','正在检索服务内的相关资料','正在整理结果'];
  run.card = { title:'已受理：' + (c ? c.title : ''),
               summary:'原型演示回复。真实实现里这里是一条专家运行消息，含执行摘要、服务卡片与产物卡片。',
               next:'确认无误后，把结果归档到本服务。' };
  run.actions = true;
  if (space.running && space.running.msg === run) space.running = null;
  if (!document.getElementById('view-space').hidden) {
    space._sessRendered = null;
    renderSpace();
  }
}

/* 收掉还没结束的那次运行。不假装成功——状态落到「已停止」，也不产出产物。
   离开会话 / 空间、删掉正在跑的会话时都要调它，否则消息会永远停在「运行中」。 */
function dropRunning(){
  if (!space.running) return;
  clearTimeout(space.running.timer);
  const run = space.running.msg;
  if (run && run.state === '运行中') { run.state = '已停止'; run.actions = true; }
  space.running = null;
}

function stopRun(){
  if (!space.running) return;
  dropRunning();
  space._sessRendered = null;
  renderSpace();
  toast('已停止本次执行');
}

/* 输入框右侧那一个按钮，两种身份（界面说明 §8.6） */
function onSendClick(){ if (space.running) stopRun(); else sendMessage(); }

/* 演示模式：有数据 / 空态 / 全部归档。
   「空态」不销毁数据（只让列表看起来没有服务），「全部归档」把状态真的改成 archived——
   这样才能顺带演示「已归档服务的空间里输入框置灰」（§8.9）。 */
function setMode(m){
  mode.demo = m;
  if (m === 'archived') {
    services.forEach(s => { if (!s._bak) s._bak = s.state; s.state = 'archived'; });
  } else {
    services.forEach(s => { if (s._bak) { s.state = s._bak; s._bak = null; } });
  }
  document.getElementById('tg-data').classList.toggle('on', m === 'data');
  document.getElementById('tg-empty').classList.toggle('on', m === 'empty');
  document.getElementById('tg-arch').classList.toggle('on', m === 'archived');
  render();
  const inSpace = !document.getElementById('view-space').hidden;
  if (inSpace && m === 'empty') backToList();
  else if (inSpace) renderSpace();
}

/* ---------- 创建表单 ---------- */
function openCreate(tplId, existingDraft){
  /* 模板入口只剩列表页的「从模板创建」分组（D23）——从那里进来时 tplId 有值：
     指令与专家组合已预填，**知识库与技能仍为空**（模板是跨租户的全局表，
     它预置的知识库 ID 在别的租户下并不存在，PRD §5.2.9 展开规则第 5 条）。
     本表单里**没有**"选择模板"入口，也没有"服务范围 / 服务描述"两个折叠区。 */
  const tpl = tplId ? templates.find(t => t.id === tplId) : null;
  form = {
    tpl: tpl,
    picker: null,
    draftId: existingDraft ? existingDraft.id : null,
    name: existingDraft ? existingDraft.name : (tpl ? tpl.name : ''),
    instruction: existingDraft ? (existingDraft.instruction || '') : (tpl ? tpl.instruction : ''),
    experts: tpl ? tpl.defaultExperts.slice() : [],
    kbs:    existingDraft && existingDraft.kbs    ? existingDraft.kbs.slice()    : [],
    skills: existingDraft && existingDraft.skills ? existingDraft.skills.slice() : [],
    err: ''
  };
  document.getElementById('view-list').hidden = true;
  document.getElementById('view-create').hidden = false;
  window.scrollTo(0,0);
  renderForm();
}

/* 目的地随「离开确认」一起走（D20 / D21）：取消 → 回列表；
   点侧栏二级 → 进那个服务；点侧栏三级 → 进那个服务、并直接打开这条会话 */
function cancelCreate(to){
  leaveAfter = to;
  if (formDirty()) { openLeaveModal(); return; }
  leaveForm();
}

function leaveForm(){
  form = null;
  document.getElementById('view-create').hidden = true;
  document.getElementById('view-list').hidden = false;
  const to = leaveAfter;
  leaveAfter = undefined;
  render();
  /* to 为空 = 回列表：render() 已经落在列表页 */
  if (to) enterSpace(to.serviceId, to.sessionId);
}

/* 有未保存修改时离开：二次确认三选项（界面说明 §6 / §7）。
   直接把用户填的内容丢掉是不礼貌的——尤其指令框可能写了很长一段。 */
function formDirty(){
  if (!form) return false;
  readFields();
  return !!(form.name || (form.instruction || '').trim() ||
            form.experts.length || form.kbs.length || form.skills.length);
}

function openLeaveModal(){
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'leave-mask';
  mask.onclick = function(ev){ if (ev.target === mask) closeLeaveModal(); };
  mask.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head">有未保存的内容</div>' +
      '<div class="modal-body">' +
        '<p class="modal-hint" style="font-size:12px;color:var(--text-2);line-height:1.7;margin:0">' +
          '保存为草稿吗？草稿会出现在服务列表里，之后可以接着填。<br />放弃则这次填的内容不再保留。</p>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn" onclick="closeLeaveModal()">继续编辑</button>' +
        '<button class="btn" onclick="discardForm()">放弃</button>' +
        '<button class="btn-primary" onclick="draftAndLeave()">保存草稿</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(mask);
}
function closeLeaveModal(){ hideLeaveModal(); leaveAfter = undefined; }   /* 点「继续编辑」= 放弃这次跳转意图 */
function hideLeaveModal(){ const m = document.getElementById('leave-mask'); if (m) m.remove(); }
function discardForm(){ hideLeaveModal(); leaveForm(); }
function draftAndLeave(){ hideLeaveModal(); saveDraft(); }

/* 从表单读回输入值（渲染会重建 DOM，必须先把用户输入存进状态）。
   D23 之后表单只有两个自由输入框（名称 / 指令）——专家、知识库、技能是选出来的，
   直接存在 form.experts / form.kbs / form.skills 里，不经过这里。 */
function readFields(){
  const n = document.getElementById('f-name');
  const ins = document.getElementById('f-instruction');
  if (n) form.name = n.value.trim();
  if (ins) form.instruction = ins.value;
}

function validate(){
  readFields();
  if (!form.name) return '请填写服务名称';
  if (form.name.length > 255) return '服务名称不能超过 255 个字符';
  if (form.instruction.length > 4000) return '服务指令不能超过 4000 个字符';
  return '';
}

/* 保存草稿：字段完整度不校验（界面说明 §5.5），但草稿数量有上限——
   同一个人攒一堆没名没内容的草稿，等于把列表页变成垃圾场。 */
function saveDraft(){
  readFields();
  const drafts = services.filter(s => s.state === 'draft' && s.id !== form.draftId).length;
  if (!form.draftId && drafts >= DRAFT_LIMIT) {
    toast('草稿过多，请先完成或删除');
    leaveAfter = undefined;   /* 没走成，跳转意图作废 */
    return;
  }
  upsertService('draft');
}

function finish(){
  const err = validate();
  if (err) { form.err = err; renderForm(); return; }
  upsertService('active');
}

function upsertService(state){
  /* 草稿不校验字段完整度（界面说明 §5.5）：没填名字时给一个占位名，
     否则列表里会出现一张没有标题的卡片。 */
  if (state === 'draft' && !form.name) form.name = '未命名服务';
  const tplName = form.tpl ? form.tpl.name : '';
  const usedTpl = form.tpl;
  const expertCount = form.experts.length;
  const kbCount = form.kbs.length;      /* 服务级资源边界（D23）：与专家并列的三项选择之二 */
  const skillCount = form.skills.length;
  const madeDraft = state === 'draft';
  let newId;
  if (form.draftId) {
    const s = services.find(x => x.id === form.draftId);
    if (s) {
      s.name = form.name; s.tpl = tplName; s.state = state; s.role = 'owner';
      s.ts = Date.now(); s.members = s.members || 1;
      s.label = madeDraft ? '草稿 · 未启用' : '刚刚';
      s.instruction = form.instruction;
      s.kbs = form.kbs.slice(); s.skills = form.skills.slice();
    }
    newId = form.draftId;
  } else {
    newId = 'new' + Date.now();
    services.unshift({
      id: newId, name: form.name, tpl: tplName,
      role:'owner', members:1, ts:Date.now(), created:Date.now(),
      label: madeDraft ? '草稿 · 未启用' : '刚刚', state: state,
      instruction: form.instruction,
      kbs: form.kbs.slice(), skills: form.skills.slice()
    });
  }
  form = null;
  document.getElementById('view-create').hidden = true;
  document.getElementById('view-list').hidden = false;
  mode.q = ''; document.getElementById('q').value = '';
  render();
  const el = document.getElementById('card-' + newId);
  if (el) {
    el.classList.add('flash');
    el.scrollIntoView({ block:'nearest', behavior:'smooth' });
    setTimeout(() => el.classList.remove('flash'), 2200);
  }
  const created = services.find(s => s.id === newId);
  document.getElementById('banner-slot').innerHTML =
    '<div class="banner">' + (madeDraft ? '已保存为草稿。' : '服务已创建。') +
    '事项状态与字段选项已按' + (usedTpl ? '模板' : '默认') + '配好。' +
    (expertCount ? '' : '添加专家后才能发起 Agent 工作。') +
    (kbCount ? (kbCount + ' 个知识库、' + skillCount + ' 项技能已就位。') : '未选知识库与技能，专家将只依据指令与对话回答。') +
    '<button class="btn-text" onclick="toast(\'去配置事项状态（原型略）\')">去调整事项状态</button>' +
    '<button class="banner-x" onclick="this.parentNode.remove()" aria-label="关闭">&#215;</button></div>';
  toast(madeDraft ? '已保存为草稿' : '服务「' + created.name + '」已创建');
  const to = leaveAfter; leaveAfter = undefined;
  if (to) enterSpace(to);   /* 若这次保存是"从表单经侧栏离开"触发的，保存完继续去点的那一项 */
}

function renderForm(){
  const noExpert = form.experts.length === 0;
  const insLen = (form.instruction || '').length;
  /* 阻断性校验：错误落在字段正下方（界面说明 §5.4），不是笼统挂在表单顶部 */
  const nameErr  = form.err && form.err.indexOf('名称') >= 0;
  const insErr   = form.err && form.err.indexOf('指令') >= 0;
  const otherErr = form.err && !nameErr && !insErr;
  const err = otherErr ? '<div class="err-msg" style="margin:0 0 14px">' + esc(form.err) + '</div>' : '';

  /* 专家卡：岗位名 + 所属职能 · 来源（界面说明 §5.3）。只出现岗位名，不出现 expert_ref 等技术标识（FR-309） */
  const expertCards = form.experts.map(id => {
    const e = EXPERTS.find(x => x.id === id);
    if (!e) return '';
    return '<div class="expert-card" title="' + esc(e.desc) + '">' +
      '<span class="expert-ic">' + esc(e.name.slice(0,1)) + '</span>' +
      '<span class="expert-main"><span class="expert-name">' + esc(e.name) + '</span>' +
      '<span class="expert-meta">' + esc(e.domain) + ' · ' + esc(e.source) + '</span></span>' +
      '<button class="btn-text" onclick="removeExpert(\'' + id + '\')">移除</button></div>';
  }).join('');

  /* 知识库 / 技能的选择浮层（D23）。两者都是"从清单里挑"，不是自由输入——与专家选择共用同一套浮层。
     知识库取"当前用户可访问的库"；技能取平台内置技能库（ListPreloadedSkills）。
     ⚠️ 技能名一律中文可读名：内置库里有一个 openmaic-classroom 是英文技术名，
        直接渲染会违反界面说明 §7.1 反面清单第 3 类，已在 SKILLS 常量里剔除（见界面说明 UI-Q12）。 */
  const kbPicker = form.picker === 'kb'
    ? '<div class="pick-panel"><div class="pick-panel-head"><span>选择知识库（本服务的检索范围）</span>' +
      '<button class="btn-text" onclick="closePicker()">收起</button></div>' +
      KBS.map(k => '<button class="pick-opt' + (form.kbs.indexOf(k.id) >= 0 ? ' on' : '') + '" onclick="toggleKb(\'' + k.id + '\')">' +
        '<span class="pick-opt-main">' + esc(k.name) + '</span>' +
        '<span>' + esc(k.meta) + '</span></button>').join('') +
      '<p class="pick-note">不选 = 这个服务不检索任何知识库。没有「全选」——默认从严，避免家长与学员资料被默认纳入检索。</p></div>'
    : '';

  const skillPicker = form.picker === 'skill'
    ? '<div class="pick-panel"><div class="pick-panel-head"><span>选择技能（本服务允许专家调用的能力）</span>' +
      '<button class="btn-text" onclick="closePicker()">收起</button></div>' +
      SKILLS.map(s => '<button class="pick-opt' + (form.skills.indexOf(s.id) >= 0 ? ' on' : '') + '" onclick="toggleSkill(\'' + s.id + '\')">' +
        '<span class="pick-opt-main">' + esc(s.name) + '</span>' +
        '<span>' + esc(s.desc) + '</span></button>').join('') +
      '<p class="pick-note">不选 = 这个服务不启用任何内置技能。含联网检索这类会把内容送出园的能力，须显式勾选才启用。</p></div>'
    : '';

  const avail = EXPERTS.filter(e => form.experts.indexOf(e.id) < 0);
  const expertPicker = form.picker === 'expert'
    ? '<div class="pick-panel"><div class="pick-panel-head"><span>添加专家</span>' +
      '<button class="btn-text" onclick="closePicker()">收起</button></div>' +
      (avail.length
        ? avail.map(e => '<button class="pick-opt" onclick="addExpert(\'' + e.id + '\')">' + esc(e.name) +
            '<span>' + esc(e.domain) + ' · ' + esc(e.desc) + '</span></button>').join('')
        : '<button class="pick-opt" onclick="closePicker()">专家已全部添加</button>') +
      '</div>'
    : '';

  const body = '<div class="panel">' + err +
    /* 不再重复页头的「新建服务」标题——标题在页头已有，面板里再写一遍是冗余 */
    '<div class="field"><label class="field-label" for="f-name">服务名称<span class="req">*</span></label>' +
      '<input class="input' + (nameErr ? ' err' : '') + '" id="f-name" value="' + esc(form.name) + '" placeholder="如：秋季招生咨询" oninput="onNameInput()" />' +
      (nameErr ? '<div class="err-msg">' + esc(form.err) + '</div>' : '') + '</div>' +

    '<div class="field">' +
      /* 指令框右上角原本有一个"选择模板 / 模板：XX · 更换"按钮，D23 已删除——
         模板的唯一入口是列表页的「从模板创建」分组；从那里进来时这里已预填好。 */
      '<div class="field-label"><label for="f-instruction" style="cursor:pointer">服务指令</label></div>' +
      /* 不设 maxlength：超出上限走阻断校验（§5.4），否则那条规则永远走不到 */
      '<textarea class="input' + (insErr ? ' err' : '') + '" id="f-instruction" rows="5" oninput="onInstrInput()" placeholder="例如：跟进 2026 秋季招生线索，语气亲切不催促，重点记录家长顾虑与到访意向；涉及课程与价格时先查知识库再回答。">' + esc(form.instruction) + '</textarea>' +
      '<div class="count' + (insLen > 4000 ? ' over' : '') + '" id="instr-count">' + insLen + ' / 4000</div>' +
      (insErr ? '<div class="err-msg">' + esc(form.err) + '</div>' : '') +
      '<div class="field-hint">用自然语言说清这个服务要做什么、按什么方式做。留空也可以。</div>' +
    '</div>' +

    '<div class="field"><div class="field-label"><span>专家</span>' +
        '<button class="btn-text" style="margin-left:auto" onclick="openPicker(\'expert\')">＋ 添加专家</button></div>' +
      (noExpert
        ? '<div class="notice"><span class="notice-text">未添加专家，创建后可随时添加；未添加前无法发起 Agent 工作</span></div>' +
          '<p class="notice-line">这是提示不是错误——只做事项协作的服务也可以直接创建。</p>'
        : '<div class="expert-list">' + expertCards + '</div>') +
      expertPicker +
    '</div>' +

    /* 知识库与技能：**服务级**，配一次全员共享（D23）。两者与专家并列为三个选择区。
       未选时给的是**灰色轻提示**、不是专家区那种黄条——能力缺失才配黄条，
       范围缺失（查不到资料 / 少几项能力）只影响回答质量，不影响能不能用。 */
    '<div class="field"><div class="field-label"><span>知识库</span>' +
        '<button class="btn-text" style="margin-left:auto" onclick="openPicker(\'kb\')">＋ 选择知识库</button></div>' +
      (form.kbs.length
        ? chipRow('kbs', kbsOf(form.kbs))
        : '<div class="field-hint">未选知识库，专家将只依据指令与对话回答。</div>') +
      kbPicker +
    '</div>' +

    '<div class="field"><div class="field-label"><span>技能</span>' +
        '<button class="btn-text" style="margin-left:auto" onclick="openPicker(\'skill\')">＋ 选择技能</button></div>' +
      (form.skills.length
        ? chipRow('skills', skillsOf(form.skills))
        : '<div class="field-hint">未启用内置技能。</div>') +
      skillPicker +
    '</div>' +
  '</div>';

  document.getElementById('panel-slot').innerHTML = body;
  /* 名称为空时主按钮不可点（界面说明 §5.4 阻断项），随输入实时切换 */
  document.getElementById('btn-create').disabled = !form.name;
}

/* 输入即时反馈：只改局部，不整块重渲染（否则光标会跳） */
function onNameInput(){
  const n = document.getElementById('f-name');
  const b = document.getElementById('btn-create');
  if (!n || !form) return;
  form.name = n.value.trim();
  n.classList.remove('err');
  if (b) b.disabled = !form.name;
}
function onInstrInput(){
  const el = document.getElementById('f-instruction');
  const c  = document.getElementById('instr-count');
  if (!el || !form) return;
  form.instruction = el.value;
  el.classList.remove('err');
  if (c) {
    c.textContent = el.value.length + ' / 4000';
    c.classList.toggle('over', el.value.length > 4000);
  }
}

function openPicker(k){ readFields(); form.picker = (form.picker === k ? null : k); renderForm(); }
function closePicker(){ readFields(); form.picker = null; renderForm(); }
function addExpert(id){
  readFields();
  if (form.experts.indexOf(id) < 0) form.experts.push(id);
  form.err = '';
  renderForm();
}
function removeExpert(id){
  readFields();
  form.experts = form.experts.filter(x => x !== id);
  renderForm();
}

/* 知识库 / 技能的勾选：点一项即切换选中态（浮层不关，可以连着勾几个） */
function toggleKb(id){
  readFields();
  const i = form.kbs.indexOf(id);
  if (i >= 0) form.kbs.splice(i, 1); else form.kbs.push(id);
  form.err = '';
  renderForm();
}
function toggleSkill(id){
  readFields();
  const i = form.skills.indexOf(id);
  if (i >= 0) form.skills.splice(i, 1); else form.skills.push(id);
  form.err = '';
  renderForm();
}
/* 已选项的标签展示（知识库 / 技能共用）。逐个可移除——**没有「全选」「清空」**（D23） */
function chipRow(key, items){
  return '<div class="chips">' + items.map(it =>
    '<span class="chip">' + esc(it.name) +
      '<button class="chip-x" onclick="dropChip(\'' + key + '\',\'' + it.id + '\')" aria-label="移除">&#215;</button>' +
    '</span>').join('') + '</div>';
}
function kbsOf(ids){ return ids.map(id => KBS.find(k => k.id === id)).filter(Boolean); }
function skillsOf(ids){ return ids.map(id => SKILLS.find(s => s.id === id)).filter(Boolean); }
function dropChip(key, val){
  readFields();
  form[key] = form[key].filter(x => x !== val);
  renderForm();
}

/* ---------- 轻量模态：⋯ 菜单里的三项（D18）----------
   改名 / 改描述 / 分享设置共用一个外壳，差别只在"标题 + 内容 + 保存动作"。
   为什么这三项独立成模态、不并进「服务设置」：
   它们改的是**服务本身**（叫什么、怎么描述、谁能看到），
   而「服务设置」配的是**服务里的东西**（成员、专家、事项配置、运行记录）。 */
function openDialog(kind){
  const s = services.find(x => x.id === space.serviceId);
  if (!s) return;
  space.modal = kind;

  let title = '', body = '', okText = '保存';
  if (kind === 'name') {
    title = '修改服务名称';
    body = '<label class="modal-label">服务名称</label>' +
      '<input class="modal-input" id="dlg-name" value="' + esc(s.name) + '" maxlength="40" />' +
      '<div class="modal-hint">名称只在成员之间出现，不对外。换成一眼能认出"这是哪件事"的名字，好过每次都要点进去看。</div>';
  } else if (kind === 'desc') {
    title = '修改服务描述';
    body = '<label class="modal-label">服务描述</label>' +
      '<textarea class="modal-textarea" id="dlg-desc" placeholder="一句话说清这个服务在做什么…">' + esc(s.desc || '') + '</textarea>' +
      '<div class="modal-hint">描述会出现在服务列表的卡片上，帮成员快速判断这个服务管什么。' +
      '它是说明，不是工作指令——工作指令在服务里的「设置」。</div>';
  } else {
    title = '分享设置';
    okText = '完成';
    const scopes = [
      { k:'private', name:'仅我可见',     desc:'其他人看不到这个服务，也不会出现在任何列表里' },
      { k:'members', name:'服务成员可见', desc:'被加入成员的同事可以看到并协作' },
      { k:'link',    name:'持有链接可见', desc:'任何拿到链接的同事都能查看内容，但不能修改' }
    ];
    body = '<div class="modal-label">谁能看到这个服务</div>' +
      scopes.map(x =>
        '<div class="share-opt' + (space.shareScope === x.k ? ' on' : '') + '" onclick="setShare(\'' + x.k + '\')">' +
          '<span class="share-dot"></span>' +
          '<span><span class="share-name">' + x.name + '</span>' +
          '<span class="share-desc" style="display:block">' + x.desc + '</span></span>' +
        '</div>').join('') +
      '<div class="modal-hint">这里管的是服务本身的可见范围。' +
      '服务里单个会话能不能共享给其他成员，是另一件事（PRD Q31，尚未定）。</div>';
  }

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'modal-mask';
  /* 点遮罩关闭：弹出层最常见的期望行为，不给用户造成"必须找到取消"的困扰 */
  mask.onclick = function(ev){ if (ev.target === mask) closeDialog(); };
  mask.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head">' + title + '</div>' +
      '<div class="modal-body">' + body + '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn" onclick="closeDialog()">取消</button>' +
        '<button class="btn-primary" onclick="saveDialog()">' + okText + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(mask);
  const inp = document.getElementById('dlg-name') || document.getElementById('dlg-desc');
  if (inp) { inp.focus(); if (inp.select) inp.select(); }
}

/* 分享范围：点一下就换选中并重绘，不做"选中后才生效"——用户期待即时反馈 */
function setShare(k){
  space.shareScope = k;
  const kind = space.modal;
  closeDialog();
  openDialog(kind);
}

function saveDialog(){
  const s = services.find(x => x.id === space.serviceId);
  const kind = space.modal;
  if (s && kind === 'name') {
    const el = document.getElementById('dlg-name');
    const v = el ? el.value.trim() : '';
    if (!v) { toast('服务名称不能为空'); return; }
    s.name = v;
    toast('已保存服务名称');
  } else if (s && kind === 'desc') {
    const el = document.getElementById('dlg-desc');
    s.desc = el ? el.value.trim() : '';
    toast('已保存服务描述');
  } else {
    const map = { private:'仅我可见', members:'服务成员可见', link:'持有链接可见' };
    toast('分享范围已设为：' + map[space.shareScope]);
  }
  closeDialog();
  if (kind !== 'share') renderSpace();
}

function closeDialog(){
  const m = document.getElementById('modal-mask');
  if (m) m.remove();
  space.modal = null;
}

render();
</script>
</body>
