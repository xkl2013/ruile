# 睿乐大脑官网 — 独立 Compose 编排文件
#
# 设计取向：与 WeKnora 主栈「解耦」而非「混编」。
#   - 官网是纯静态站（nginx 托管），不依赖 app / postgres / redis / docreader，
#     因此不接入 WeKnora-network，也无需与主栈同生命周期。
#   - 单独成文件的好处：升级发布包（重新解压 aliyun-weknora-*.tar）时，
#     主 docker-compose.yml 会被覆盖，本文件与官网容器不受影响。
#
# 用法（在服务器部署目录，如 weknora-image-deploy/ 下）：
#   docker compose -f docker-compose.website.yml pull
#   docker compose -f docker-compose.website.yml up -d
#   docker compose -f docker-compose.website.yml ps
#   docker compose -f docker-compose.website.yml logs -f website
#   docker compose -f docker-compose.website.yml down
#
# 若要和主栈一条命令起（可选，二者选一即可）：
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.aliyun-amd64.yml \
#                  -f docker-compose.website.yml up -d --no-build

services:
  website:
    image: ${WEBSITE_IMAGE_REGISTRY:-registry.cn-beijing.aliyuncs.com/rl-knowledge}/ruile-website:${WEBSITE_VERSION:-latest}
    container_name: ruile-website
    # 宿主机端口默认 8088：避开主栈已占用的 80（frontend）/ 8080（app）/ 8082（mcp）
    ports:
      - "${WEBSITE_PORT:-8088}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 说明：容器内 nginx 固定监听 80（镜像标准），端口调整只改宿主机侧映射，
    #       镜像无需重新构建或重新推送。
